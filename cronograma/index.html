  async function salvarModelos(novos, renomes, motivos){
    if(!podeModelosTela){ ui.alert("Seu grupo de acesso não mexe em Modelos."); return; }
    try {
      const noServidor = await kvLoad(KV_MODELOS_KEY).catch(()=>null);
      const servidor = (noServidor && noServidor.modelos) || modelos;
      // Conflito só se algum Modelo que ESTA pessoa edita mudou no servidor desde que ela abriu a página.
      const mudouLa = servidor.filter(podeEditarModelo).some(m => JSON.stringify(m) !== JSON.stringify(modelos.find(x => x.id === m.id)));
      if(mudouLa && !(await ui.confirm("Algum Modelo que você está editando foi salvo em outra sessão às " + fmtHora(noServidor.atualizadoEm) + ". Salvar agora vai SOBRESCREVER essas mudanças.", { titulo:"Conflito de edição", okLabel:"Sobrescrever", perigo:true }))) return;
      // Mescla: o que você pode editar vem da sua tela; o resto (ex.: Modelos de outra gerência) fica como está no servidor.
      const ordem = m => { const i = MODELOS_PADRAO_DEF.findIndex(d => d.id === m.id); return i < 0 ? 99 : i; };
      const final = [...novos.filter(podeEditarModelo), ...servidor.filter(m => !podeEditarModelo(m))]
        .map((m, i) => ({ m, i })).sort((a, b) => (ordem(a.m) - ordem(b.m)) || (a.i - b.i)).map(x => x.m);
      const antes = servidor;
      const em = new Date().toISOString();
      await kvSave(KV_MODELOS_KEY, { modelos: final, atualizadoEm: em });
      await gravarVersoesModelos(antes, final, motivos);
      setModelos(final); setModelosAtualizadoEm(em);
      showToast("Modelos salvos. Para levar as mudanças aos cronogramas, use “Aplicar Modelo atualizado” na tela inicial (você escolhe quais).");
      if(renomes && renomes.length && clientesResumo.length && podeEditar) await prepararRenomeio(renomes);
    } catch(e){ showToast("Falhou salvar os Modelos: " + e.message); }
  }
  // Nomes dos clientes de um cronograma (versão mais recente), para mostrar quem é afetado.
  function clientesDoRegistro(r){
    const anos = anosDoCronograma(r); const v = anos.length ? r.versoes[anos[anos.length - 1]] : null;
    const nomes = ((v && v.clientesIds) || []).map(id => basePorId[id] ? (basePorId[id].razaoSocial || fmtDocumento(basePorId[id].documento)) : null).filter(Boolean);
    return nomes.length ? nomes.slice(0, 4).join(", ") + (nomes.length > 4 ? " e mais " + (nomes.length - 4) : "") : "";
  }
  // Cronogramas que esta pessoa vê (todas as versões), para operações em lote vindas do Modelo.
  function idsCronogramasVisiveis(){
    return clientesResumo.filter(r => escopo === "all" || gerenciaDoCronograma(r.gerenteId, Object.values(r.versoes || {}).flatMap(v => (v && v.clientesIds) || []), basePorId) === escopo).map(r => r.id);
  }
  async function prepararRenomeio(renomes){
    showToast("Procurando cronogramas com essas tarefas…");
    const regs = await carregarVarios(idsCronogramasVisiveis());
    const itens = [];
    regs.forEach(r0 => {
      const r = cacheRef.current[r0.id] || r0; let n = 0; const anos = [];
      Object.keys(r.versoes || {}).forEach(a => { if(anoEncerrado(Number(a), anosEstado)) return; const res = renomearTarefas(r.versoes[a].processos, renomes); if(res.n){ n += res.n; anos.push(a); } });
      if(n) itens.push({ id: r.id, nome: r.nome, detalhe: n + " tarefa(s) renomeada(s) · " + anos.join(", "), clientes: clientesDoRegistro(r), bloqueado: sujos.has(r.id) ? "tem alterações não salvas" : null });
    });
    if(!itens.length){ showToast("Nenhum cronograma tem essas tarefas com o nome antigo."); return; }
    setLoteModal({ titulo:"Renomear nos cronogramas", okLabel:"Renomear", itens,
      descricao: "Tarefa(s) renomeada(s) no Modelo:\n" + renomes.map(x => "• \"" + x.de + "\" → \"" + x.para + "\"").join("\n") +
        "\n\nMarque em quais cronogramas aplicar. Só troca o nome (as datas não mudam), inclusive em aprovados; anos encerrados ficam de fora.",
      onAplicar: sel => renomearNosCronogramas(renomes, sel) });
  }
  // Operação em lote registrada para poder desfazer: cada item guarda a versão de segurança de cada ano alterado.
  async function gravarLote(lote){
    try {
      const atual = await kvLoad(KV_LOTES_KEY).catch(()=>null);
      const lista = [{ id: novoId("lote"), em: new Date().toISOString(), por: usuario.nome || perfil, ...lote }, ...((atual && atual.lotes) || lotes)].slice(0, 30);
      await kvSave(KV_LOTES_KEY, { lotes: lista, atualizadoEm: new Date().toISOString() });
      setLotes(lista);
    } catch(e){ showToast("Aviso: não consegui registrar a operação para desfazer (" + e.message + ")."); }
  }
  async function desfazerLote(lote){
    if(!podeRestaurar){ ui.alert("Seu grupo de acesso não desfaz operações."); return; }
    if(!(await ui.confirm('Desfazer "' + lote.descricao + '" (' + fmtHora(lote.em) + ")?\n\n" + lote.itens.length + " cronograma(s) voltam como estavam antes dessa operação. Os que foram alterados depois ficam de fora, para não perder o que foi feito.", { titulo:"Desfazer aplicação", okLabel:"Desfazer", perigo:true }))) return;
    const feitos = [], pulados = [], resumos = [];
    for(const it of lote.itens){
      try {
        const reg0 = await kvLoad(kvKeyCliente(it.cronogramaId));
        if(!reg0){ pulados.push(it.nome + " (não encontrado)"); continue; }
        if(sujos.has(it.cronogramaId) || reg0.atualizadoEm !== it.atualizadoEmDepois){ pulados.push(it.nome + " (alterado depois)"); continue; }
        const fotos = await carregarFotos(it.cronogramaId);
        let r = migrarParaVersoes(reg0, anoTrabalhoPadrao());
        const agora = new Date().toISOString();
        it.anos.forEach(a => {
          const f = fotos.find(x => x.id === a.fotoId), v = visaoDoAno(r, a.ano);
          if(!f || !v) return;
          r = gravarVisao(r, a.ano, { ...restaurarDaFoto(v, f), acoes: [...(v.acoes || []), { tipo:"edicao", descricao: "Desfeito: " + lote.descricao + ".", em: agora, quem: usuario.nome || null }] });
        });
        const paraSalvar = { ...r, atualizadoEm: agora };
        await kvSave(kvKeyCliente(it.cronogramaId), paraSalvar);
        cacheRef.current = { ...cacheRef.current, [it.cronogramaId]: paraSalvar };
        setClientesCache(prev => ({ ...prev, [it.cronogramaId]: paraSalvar }));
        marcarSalvo(paraSalvar); resumos.push(resumoDe(paraSalvar)); feitos.push(it.nome);
      } catch(e){ pulados.push(it.nome + " (" + e.message + ")"); }
    }
    if(resumos.length) await atualizarIndice(lista => resumos.reduce((l, x) => upsertResumo(l, x), lista)).catch(()=>{});
    try {
      const atual = await kvLoad(KV_LOTES_KEY).catch(()=>null);
      const lista = ((atual && atual.lotes) || lotes).map(l => l.id === lote.id ? { ...l, desfeitoEm: new Date().toISOString(), desfeitoPor: usuario.nome || perfil, desfeitos: feitos.length } : l);
      await kvSave(KV_LOTES_KEY, { lotes: lista, atualizadoEm: new Date().toISOString() }); setLotes(lista);
    } catch(e){}
    ui.alert(feitos.length + " cronograma(s) voltaram como estavam." + (pulados.length ? "\n\nFicaram de fora:\n• " + pulados.join("\n• ") : ""), { titulo:"Desfazer aplicação" });
  }

  function navegarMes(delta){
    const { y, m } = mesEfetivo(ano, mesReferencia, delta);
    setAno(y); setMesReferencia(m);
  }
  function setAba(a){ if(clienteId) navegar(linkCronograma(clienteId, a)); }

  const conflitos = useMemo(() => clienteAtual ? detectarConflitos(clienteAtual, ano, mesReferencia, soSinergy) : [], [clienteAtual, ano, mesReferencia, soSinergy]);
  const alertasAtual = useMemo(() => clienteAtual ? alertasDoAno(clienteAtual, ano) : [], [clienteAtual, ano]);
  const vinculadosAtual = clienteAtual ? (clienteAtual.clientesIds || []).map(id => basePorId[id]).filter(Boolean) : [];
  // Gerente/coordenador/analista vindos da base de clientes (o mais frequente entre os CNPJs vinculados).
  // Gerência do cronograma aberto e se esta pessoa pode vê-lo.
  const gerAtual = registroAtual ? gerenciaDoCronograma(registroAtual.gerenteId, clienteAtual ? clienteAtual.clientesIds : [], basePorId) : null;
  const semAcessoGerencia = !!registroAtual && escopo !== "all" && gerAtual !== escopo;
  const gerenciasDosClientes = clienteAtual ? [...new Set((clienteAtual.clientesIds || []).map(id => basePorId[id] && basePorId[id].gerenteId).filter(Boolean))] : [];
  function definirGerenciaCronograma(gid){
    if(gerenciasDosClientes.length && gerenciasDosClientes.some(g => g !== gid)){ ui.alert("Os clientes vinculados são da gerência " + gerenciasDosClientes.map(nomeGerente).join(" e ") + ". A gerência do cronograma precisa ser a mesma dos clientes."); return; }
    updateClienteAtual({ gerenteId: gid || null });
  }
  // Vincular clientes: todos da MESMA gerência e com gerência definida (decisão: um cronograma não mistura gerências).
  function vincularComGerencia(ids){
    if(!usaGerencia){ updateClienteAtual({ clientesIds: ids }); return; }
    const novos = ids.filter(id => !(clienteAtual.clientesIds || []).includes(id)).map(id => basePorId[id]).filter(Boolean);
    const semG = novos.filter(c => !c.gerenteId);
    if(semG.length){ ui.alert("Defina a gerência destes clientes na Base de clientes antes de vincular:\n" + semG.slice(0, 8).map(c => "• " + (c.razaoSocial || fmtDocumento(c.documento))).join("\n")); return; }
    const gs = [...new Set(ids.map(id => basePorId[id] && basePorId[id].gerenteId).filter(Boolean))];
    if(gs.length > 1){ ui.alert("Um cronograma não pode ter clientes de gerências diferentes (" + gs.map(nomeGerente).join(" e ") + ")."); return; }
    if(clienteAtual.gerenteId && gs[0] && gs[0] !== clienteAtual.gerenteId){ ui.alert("Este cronograma é da gerência " + nomeGerente(clienteAtual.gerenteId) + "; os clientes escolhidos são da gerência " + nomeGerente(gs[0]) + "."); return; }
    updateClienteAtual({ clientesIds: ids, ...(!clienteAtual.gerenteId && gs[0] ? { gerenteId: gs[0] } : {}) });
  }
  const respBase = clienteAtual ? Object.fromEntries(RESPONSAVEIS.map(([campo]) => [campo, responsavelDosClientes(clienteAtual.clientesIds, basePorId, campo)])) : {};
  const abertosAtual = new Set((clienteAtual && abertos[clienteAtual.id]) || []);
  function alternarProcesso(pid){ setAbertos(prev => { const s = new Set(prev[clienteId] || []); s.has(pid) ? s.delete(pid) : s.add(pid); return { ...prev, [clienteId]: [...s] }; }); }
  function abrirTodos(v){ setAbertos(prev => ({ ...prev, [clienteId]: v ? clienteAtual.processos.map(p => p.id) : [] })); }
  function irParaProcesso(pid){
    setAbertos(prev => { const s = new Set(prev[clienteId] || []); s.add(pid); return { ...prev, [clienteId]: [...s] }; });
    setTimeout(() => { const el = document.getElementById("proc-" + pid); if(el) el.scrollIntoView({ behavior:"smooth", block:"start" }); }, 50);
  }
  function irParaAlerta(a){
    setVerAlertas(false);
    if(aba !== "parametrizar") setAba("parametrizar");
    setMesReferencia(a.meses[0]);
    setAbertos(prev => { const s = new Set(prev[clienteId] || []); s.add(a.processoId); return { ...prev, [clienteId]: [...s] }; });
    setDestaque({ processoId: a.processoId, eventoId: a.eventoId, n: Date.now() });
  }
  async function copiarLink(){

  if(carregando) return <div style={{padding:40}}>Carregando…</div>;

  const abas = [
    ["parametrizar","Parametrização"], ["calendario","Calendário"], ["previa_anual","Prévia anual"], ["clientes","Clientes vinculados (" + vinculadosAtual.length + ")"],
    ...(!consulta ? [["historico","Histórico"]] : []),
  ];
  const menu = [
    { id:"inicio", ic:"🏠", label:"Cronogramas", href:linkTela("inicio") },
    { id:"aprovacoes", ic:"✅", label:"Aprovações", href:linkTela("aprovacoes"), badge:nAprovacoes },
    { id:"painel", ic:"📊", label:"Painel", href:linkTela("painel") },
    { id:"clientes", ic:"🏢", label:"Base de clientes (" + baseVisivel.filter(c => c.ativo !== false).length + ")", href:linkTela("clientes") },
    ...(podeSecoes ? [{ id:"secoes", ic:"🧩", label:"Seções (" + secoes.length + ")", href:linkTela("secoes") }] : []),
    ...(podeAcessos ? [{ id:"acessos", ic:"🔐", label:"Grupos de acesso", href:linkTela("acessos") }] : []),
    ...(podeLixeira ? [{ id:"lixeira", ic:"🗑", label:"Lixeira (" + linhasLixeira.length + ")", href:linkTela("lixeira") }] : []),
  ];
  const nomeResumo = id => (linhasCarteira.find(c => c.id === id) || {}).nome;
  // Em quantos cronogramas (qualquer ano) cada seção da biblioteca está em uso — vem do índice e das versões abertas.
  const usoDasSecoes = (() => {
    const porCrono = {};
    clientesResumo.forEach(r => { porCrono[r.id] = new Set(Object.values(r.versoes || {}).flatMap(v => v.secoesUsadas || [])); });
    Object.values(clientesCache).forEach(c => { porCrono[c.id] = new Set(Object.values(c.versoes || {}).flatMap(v => (v.processos || []).map(p => p.origemSecaoId).filter(Boolean))); });
    const out = {};
    Object.values(porCrono).forEach(set => set.forEach(id => { out[id] = (out[id] || 0) + 1; }));
    return out;
  })();
  // Anos no seletor: do mais antigo que tem versão (ou o ano passado) até dois anos à frente.
  const anosDisponiveis = (() => {
    const existentes = clientesResumo.flatMap(r => Object.keys(r.versoes || {}).map(Number));
    const ini = Math.min(anoVigente() - 1, ano, ...existentes), fim = Math.max(anoVigente() + 2, ano, ...existentes);
    const out = []; for(let a = fim; a >= ini; a--) out.push(a); return out;

  const processosAtivos = clienteAtual ? clienteAtual.processos.filter(p => p.ativo) : [];

  return (

          </div>
          <button className="btn btn-primary" style={{width:"100%", marginBottom:10}} onClick={()=>setModalNovo("cadastro")} title="Novo cronograma" disabled={!podeEditar}>{recolhida ? "+" : "+ Novo cronograma"}</button>
          {menu.map(m => (

              <span className="nav-ic">{m.ic}</span>{!recolhida && <span>{m.label}</span>}

          {podeModelosTela
            ? <a href={linkTela("modelos")} className={"nav-item" + (rota.tela === "modelos" ? " active" : "")} title="Modelos (tarefas-padrão)"><span className="nav-ic">⚙</span>{!recolhida && <span>Modelos</span>}</a>
            : <button className="nav-item" title="Seu grupo de acesso não administra Modelos" disabled><span className="nav-ic">⚙</span>{!recolhida && <span>Modelos</span>}</button>}

          {recolhida && <button className="nav-item" onClick={alternarTema} title={tema === "claro" ? "Mudar para escuro" : "Mudar para claro"}><span className="nav-ic">{tema === "claro" ? "🌙" : "☀️"}</span></button>}
          {!recolhida && recentes.filter(nomeResumo).length > 0 && <>

            {recentes.filter(nomeResumo).map(id => (
              <a key={id} href={linkCronograma(id)} className={"nav-item nav-recente" + (clienteId === id ? " active" : "")} title={nomeResumo(id)}>
                <span className="nav-ic">•</span><span className="nav-trunc">{nomeResumo(id)}</span>{sujos.has(id) && <span className="dot">●</span>}
              </a>

          {!recolhida && <>

            <select id="ano-input" value={ano} onChange={e=>setAno(Number(e.target.value))} style={{width:"100%", fontWeight:700}} aria-label="Ano de trabalho">
              {anosDisponiveis.map(a => <option key={a} value={a}>{a}{anoEncerrado(a, anosEstado) ? " 🔒 encerrado" : anoPendenteDeEncerrar(a, anosEstado) ? " (a encerrar)" : a === anoVigente() ? " (atual)" : ""}</option>)}

            {sessao ? <>

                <button className="btn btn-sm btn-ghost" onClick={async ()=>{ if(sujos.size && !(await ui.confirm("Há alterações não salvas. Sair mesmo assim?", { okLabel:"Sair", perigo:true }))) return; onSair(); }}>Sair</button>
              </div>

            <div className="nav-secao">Você (provisório até o login)</div>
            <input type="text" className="side-search" placeholder="Seu nome" value={usuario.nome} onChange={e=>setUsuario({ ...usuario, nome:e.target.value })} aria-label="Seu nome" list="lista-analistas" />
            <select value={perfil} onChange={e=>setUsuario({ ...usuario, perfil:e.target.value })} style={{width:"100%"}} aria-label="Perfil">
              {Object.entries(PERFIS).map(([id, p]) => <option key={id} value={id}>{p.label}</option>)}

            {/* Dados e backup ficam recolhidos num menu (só abre ao clicar). */}

                  <input ref={inputBackupBanco} type="file" accept=".json" style={{display:"none"}} onChange={importarBackupParaBanco} />

        {!consulta && !["clientes","secoes","acessos","modelos","lixeira","cronograma"].includes(rota.tela) && anoEncerrado(ano, anosEstado) && (

            {podeEncerrar && <> <button className="btn btn-sm btn-outline" style={{marginLeft:8}} onClick={reabrirAnoInteiro}>Reabrir {ano}…</button></>}
          </div>
        )}
        {rota.tela === "inicio" && !consulta && (
          <CarteiraTela key={"carteira-" + carteiraStatus + "-" + ano} ano={ano} statusInicial={carteiraStatus} linhas={linhasVisiveis} problemasResp={problemasCrono} modelos={modelos} usuario={usuario} analistas={analistas} sujos={sujos} basePorId={basePorId}
            atualizandoResumo={atualizandoResumo} onAbrir={id => navegar(linkCronograma(id))} onNovo={()=>setModalNovo("cadastro")} onAcaoMassa={acaoMassa} />
        )}
        {rota.tela === "aprovacoes" && !consulta && (

        )}
        {rota.tela === "lixeira" && !consulta && (podeLixeira
          ? <LixeiraTela itens={linhasLixeira} nomeGerente={nomeGerente} usaGerencia={usaGerencia} onRestaurar={restaurarDaLixeira} onExcluir={excluirDefinitivo} />
          : <div className="card muted" style={{marginTop:20}}>A lixeira é acessada por Gerente ou Administrador/Diretor.</div>)}
        {rota.tela === "modelos" && !consulta && (podeModelosTela
          ? <ModeloAdmin key="modelos" modelos={modelos} versoes={modelosVersoes} podeRestaurar={podeRestaurar} onSalvar={salvarModelos} ano={ano}
              podeEditarModelo={podeEditarModelo} gerentes={gerentes} escopo={escopo} usoModelos={usoModelos} lotes={lotes} onDesfazerLote={desfazerLote} />
          : <div className="card muted" style={{marginTop:20}}>Seu grupo de acesso não administra Modelos.</div>)}
        {rota.tela === "painel" && !consulta && (
          <PainelTela key={"painel-" + ano} ano={ano} estadoAno={anosEstado[ano]} podeEncerrar={podeEncerrar && ano <= anoVigente()} onEncerrar={encerrarAnoInteiro} onReabrir={reabrirAnoInteiro} linhas={linhasVisiveis} base={baseVisivel.filter(c => c.ativo !== false)} basePorId={basePorId} modelos={modelos} analistas={analistas}
            onAbrir={id => navegar(linkCronograma(id))} onFiltrarCarteira={st => { setCarteiraStatus(st); navegar(linkTela("inicio")); }} />
        )}
        {rota.tela === "secoes" && !consulta && (podeSecoes
          ? <SecoesTela key="secoes" secoes={secoes} ano={ano} podeEditar={podeSecoes} uso={usoDasSecoes} onSalvar={salvarSecoes} />
          : <div className="card muted" style={{marginTop:20}}>As seções personalizadas são geridas por Diretor, Gerente ou Coordenador.</div>)}
        {rota.tela === "acessos" && !consulta && (podeAcessos
          ? <GruposTela grupos={PERFIS} onSalvar={salvarGrupos} />
          : <div className="card muted" style={{marginTop:20}}>Seu grupo não tem acesso à gestão de grupos.</div>)}
        {rota.tela === "clientes" && !consulta && (
          <ClientesBaseTela podeEditar={podeClientes} base={baseVisivel} baseCompleta={baseClientesG} problemasCliente={problemasCliente} vinculoDe={vinculoDe} vinculoTodosAnos={vinculoTodosAnos}
            gerentes={gerentes} usuariosPainel={pessoasPainel} gruposPainel={gruposPainelEf} escopo={escopo} usuarioNome={usuario.nome} onAtualizarBase={atualizarBase} onAbrirCronograma={id => navegar(linkCronograma(id))} />
        )}

        {rota.tela === "cronograma" && (!registroAtual ? (
          <div className="muted" style={{paddingTop:30}}>{carregandoCrono ? "Abrindo o cronograma…" : <>Cronograma não encontrado. <a href={linkTela("inicio")}>Voltar para a lista</a></>}</div>
        ) : registroAtual.excluido ? (
          <div className="card" style={{marginTop:24}}>
            <h3>🗑 “{registroAtual.nome}” está na lixeira</h3>
            <p className="muted">Excluído em {fmtHora(registroAtual.excluido.em)}{registroAtual.excluido.por ? " por " + registroAtual.excluido.por : ""} · apagado de vez em {diasRestantesLixeira(registroAtual.excluido)} dia(s).</p>
            {podeLixeira ? <button className="btn btn-primary" onClick={()=>restaurarDaLixeira(registroAtual.id)}>Restaurar</button> : <p className="muted">Peça a um Gerente ou Administrador/Diretor para restaurar.</p>}
            {" "}<a href={linkTela("inicio")}>Voltar para a lista</a>
          </div>
        ) : semAcessoGerencia ? (
          <div className="card" style={{marginTop:24}}>
            <h3>Sem acesso a este cronograma</h3>
            <p className="muted">“{registroAtual.nome}” {gerAtual ? "é da gerência " + nomeGerente(gerAtual) : "ainda não tem gerência definida"}. Você vê apenas os cronogramas da sua gerência.</p>
            <a href={linkTela("inicio")}>Voltar para a lista</a>
          </div>
        ) : !clienteAtual ? (
          <div style={{paddingTop:24}}>
            <div className="migalha" style={{marginBottom:10}}><a href={linkTela("inicio")}>Cronogramas {ano}</a> › <strong>{registroAtual.nome}</strong></div>
            <div className="card sem-versao">
              <h3>“{registroAtual.nome}” não tem versão {ano}</h3>
              <p>Versões existentes: {anosDoCronograma(registroAtual).map(a => <a key={a} className="chip-ano chip-link" href={linkCronograma(registroAtual.id, "parametrizar", a)}>{a}</a>)}</p>
              {anoEncerrado(ano, anosEstado)
                ? <p className="muted">{ano} está encerrado — não dá pra abrir versão nele.</p>
                : podeEditar && <>
                    <p className="muted">Abrir {ano} copia a versão anterior mais recente (as regras que valiam em dezembro) e os mesmos clientes. A versão nova começa “Em desenvolvimento” e passa de novo pela aprovação; a anterior não muda.</p>
                    <button className="btn btn-primary" onClick={()=>abrirAnoPara([registroAtual.id])}>Abrir {ano} a partir de {anosDoCronograma(registroAtual).filter(a => a < ano).pop() || anosDoCronograma(registroAtual)[0]}</button>
                  </>}
            </div>
          </div>
        ) : <>
          {!consulta && (
            <div className="savebar">
              <span className="migalha"><a href={linkTela("inicio")}>Cronogramas {ano}</a> › <strong>{clienteAtual.nome}</strong> <span className="chip-ano">{ano}</span></span>
              <span style={{display:"flex", gap:10, alignItems:"center"}}>
                {podeEditar && (atualSujo
                  ? <span className="dirty">● Alterações não salvas</span>
                  : <span className="muted">✓ Salvo{clienteAtual.atualizadoEm ? " em " + fmtHora(clienteAtual.atualizadoEm) : ""}</span>)}
                {podeEditar && <button className="btn btn-primary" disabled={!atualSujo || salvando} onClick={()=>salvarCliente(clienteAtual)}>{salvando ? "Salvando…" : "Salvar (Ctrl+S)"}</button>}
              </span>
            </div>
          )}
          <div className="topbar" style={consulta ? {paddingTop:24} : undefined}>
            <div>
              <h2>{clienteAtual.nome} {clienteAtual.arquivado && <span className="status-pill status-desfeito">Arquivado</span>}</h2>
              <div className="anos-crono" role="tablist" aria-label="Versões por ano">
                <span className="editando-ano">{travado ? "🔒 Vendo" : "Editando"}: <strong>{ano}</strong></span>
                {anosDoCronograma(registroAtual).map(a => (
                  <a key={a} role="tab" aria-selected={a === ano} className={"chip-ano chip-link" + (a === ano ? " on" : "")} href={linkCronograma(registroAtual.id, aba, a)}
                    title={anoEncerrado(a, anosEstado) ? "Ano encerrado" : ""}>{a}{anoEncerrado(a, anosEstado) ? " 🔒" : ""}</a>
                ))}
                {podeEditar && !anosDoCronograma(registroAtual).includes(ano + 1) && (
                  <a className="link-btn" href={linkCronograma(registroAtual.id, "parametrizar", ano + 1)} title={"Ir para " + (ano + 1) + " (lá você pode abrir a versão)"}>+ {ano + 1}</a>
                )}
              </div>
              <div className="sub">
                {usaGerencia && <>Gerência: {gerAtual ? <strong style={{fontWeight:600}}>{nomeGerente(gerAtual)}</strong> : <span className="alerta">⚠ não definida</span>}
                  {escopo === "all" && podeEditar && !somenteLeitura && !gerAtual && <> <select value={clienteAtual.gerenteId || ""} onChange={e=>definirGerenciaCronograma(e.target.value)} aria-label="Definir gerência do cronograma" style={{padding:"1px 4px"}}>
                    <option value="">definir…</option>
                    {gerentes.map(g => <option key={g.id} value={g.id}>{g.nome}</option>)}
                  </select></>}
                  {gerenciasDosClientes.length > 1 && <span className="alerta"> ⚠ clientes de gerências diferentes</span>}
                  {" · "}</>}
                Modelo: {clienteAtual.modeloBase} · {vinculadosAtual.length} CNPJ(s) ·{" "}
                <label>Analista: <input type="text" list="lista-analistas" value={clienteAtual.analista || ""} disabled={!podeEditar} placeholder="—" onChange={e=>updateClienteAtual({ analista: e.target.value })} style={{width:150, padding:"2px 6px"}} aria-label="Analista responsável" /></label>
                {respBase.analista && respBase.analista !== (clienteAtual.analista || "") && podeEditar && <> <button className="link-btn" onClick={()=>updateClienteAtual({ analista: respBase.analista })} title="Analista cadastrado na base de clientes para os CNPJs deste cronograma">usar "{respBase.analista}" (da base)</button></>}
                {respBase.coordenador && <> · Coordenador: <strong style={{fontWeight:600}}>{respBase.coordenador}</strong></>}
                {!usaGerencia && respBase.gerente && <> · Gerente: <strong style={{fontWeight:600}}>{respBase.gerente}</strong></>}
                {!consulta && <> · <button className="link-btn" onClick={copiarLink}>🔗 Copiar link</button></>}
                {podeModelosTela && <> · <button className="link-btn" onClick={criarModeloDoCronograma} title="Cria um Modelo novo com os blocos e tarefas deste cronograma (o cronograma não muda)">Salvar como Modelo</button></>}
                {podeEditar && <> · <button className="link-btn" onClick={duplicarCliente}>Duplicar</button>
                  {" · "}<button className="link-btn" onClick={alternarArquivado}>{clienteAtual.arquivado ? "Desarquivar" : "Arquivar"}</button>
                  {" · "}<button className="link-btn perigo" onClick={excluirCliente}>Excluir</button></>}
              </div>
            </div>
            <div className="toolbar">
              <button className={"btn " + (alertasAtual.length ? "btn-alerta" : "btn-outline")} onClick={()=>setVerAlertas(!verAlertas)} title="Central de alertas do ano">⚠ {alertasAtual.length} alerta(s)</button>
              <button className="btn btn-outline" title="Para enviar ao cliente validar: sem modelo base, status nem responsáveis internos"
                onClick={()=>exportarExcel(clienteAtual, ano, vinculadosAtual, "cliente").catch(e=>showToast("Erro ao gerar o Excel: " + e.message))}>⬇ Excel cliente</button>
              <button className="btn btn-outline" title="Uso interno: com modelo base, status, data de geração e gerente/coordenador/analista"
                onClick={()=>exportarExcel(clienteAtual, ano, vinculadosAtual, "interno").catch(e=>showToast("Erro ao gerar o Excel: " + e.message))}>⬇ Excel interno</button>
            </div>
          </div>

          <BarraStatus cronograma={clienteAtual} podeMudar={podeEditar && !travado} podeAprovar={podeAprovar} onPedir={pedirMudancaStatus} onHistorico={()=>setAba("historico")} />

          <div className="abas" role="tablist">
            {abas.map(([id,label]) => (
              <button key={id} role="tab" aria-selected={aba===id} className={"aba" + (aba===id ? " on" : "")} onClick={()=>setAba(id)}>{label}</button>
            ))}
          </div>

          {verAlertas && <CentralAlertas alertas={alertasAtual} ano={ano} onIr={irParaAlerta} onFechar={()=>setVerAlertas(false)} />}
          {presenca && (
            <div className="note note-info">
              Este cronograma está sendo editado em outra sessão desde {fmtHora(presenca.desde)}. Combine antes de salvar — quem salvar por último sobrescreve o rascunho do outro.
            </div>
          )}
          {travado && (
            <div className="note note-lock">
              🔒 {ano} foi encerrado{anosEstado[ano] && anosEstado[ano].por ? " por " + anosEstado[ano].por + " em " + fmtHora(anosEstado[ano].em) : ""} — esta versão fica só para consulta (histórico).
              {podeEncerrar && <> <button className="btn btn-sm btn-outline" style={{marginLeft:8}} onClick={reabrirAno}>Reabrir este cronograma para correção…</button></>}
            </div>
          )}
          {!travado && versaoAtual && versaoAtual.reaberto && anoEncerrado(ano, anosEstado) && (
            <div className="note">
              ✎ {ano} foi reaberto para correção por {versaoAtual.reaberto.por} em {fmtHora(versaoAtual.reaberto.em)} — motivo: {versaoAtual.reaberto.motivo}.
              {podeEncerrar && <> <button className="btn btn-sm btn-outline" style={{marginLeft:8}} onClick={travarAnoDeNovo}>Travar de novo</button></>}
            </div>
          )}
          {!consulta && clienteAtual.status === "aprovado" && (
            <div className="note note-lock">🔒 Cronograma aprovado — a edição está travada. Para alterar algo, volte o status para uma etapa anterior.</div>
          )}

          {aba === "parametrizar" && (
            <div className="layout-crono">
              <aside className="indice-proc" aria-label="Processos">
                <div className="nav-secao" style={{color:"var(--muted)", marginTop:0}}>Processos</div>
                {clienteAtual.processos.map(p => {
                  const calc = p.ativo && mesesDoProcesso(p).length ? resolveProcesso(p, ano, mesesDoProcesso(p).includes(mesReferencia) ? mesReferencia : mesesDoProcesso(p)[0], clienteAtual.processos) : [];
                  const nAl = calc.reduce((s, c) => s + (c && c.alertas ? c.alertas.length : 0), 0);
                  const modP = modeloAtual && modeloAtual.processos.find(x => x.id === p.id);
                  const pad = modP ? resumoPadraoProcesso(p, modP) : { fora:0, extras:0 };
                  return (
                    <div key={p.id} className={"indice-item" + (p.ativo ? "" : " inativo")}>
                      <input type="checkbox" checked={p.ativo} disabled={somenteLeitura} onChange={e=>toggleProcessoAtivo(p.id, e.target.checked)} title={p.ativo ? "Desativar processo" : "Ativar processo"} aria-label={"Processo " + p.nome + " ativo"} />
                      <button type="button" className="link-btn indice-nome" disabled={!p.ativo} onClick={()=>irParaProcesso(p.id)}>{p.nome}</button>
                      {nAl > 0 && <span className="alerta" title="Alertas nesta competência">⚠{nAl}</span>}
                      {(pad.fora + pad.extras) > 0 && <span className="badge badge-padrao" title="Tarefas diferentes do Modelo">≠{pad.fora + pad.extras}</span>}
                    </div>
                  );
                })}
                <div style={{marginTop:10, display:"flex", gap:8, flexWrap:"wrap"}}>
                  <button className="link-btn" onClick={()=>abrirTodos(true)}>expandir todos</button>
                  <button className="link-btn" onClick={()=>abrirTodos(false)}>recolher todos</button>
                </div>
                {podeSecoes && !somenteLeitura && (
                  <button className="btn btn-sm btn-outline" style={{width:"100%", marginTop:10}} onClick={()=>setModalSecao(true)}>+ Adicionar seção</button>
                )}
              </aside>
              <div style={{minWidth:0}}>
                <div className="card faixa-competencia">
                  <span className="muted">Competência de referência:</span>
                  <select value={mesReferencia} onChange={e=>setMesReferencia(Number(e.target.value))}>
                    {MESES_LONGOS.map((m,i) => <option key={m} value={i+1}>{m}/{ano}</option>)}
                  </select>
                  <span className="muted" style={{marginLeft:"auto"}}>Clique no nome do processo pra abrir. Os prazos aparecem em texto — use “✎ editar” pra mudar.</span>
                </div>
                <PainelConflitos recolhido conflitos={conflitos} ano={ano} mes={mesReferencia} soSinergy={soSinergy} onSoSinergy={setSoSinergy} />
                {processosAtivos.map(processo => (
                  <ProcessoCard key={clienteAtual.id + ":" + processo.id} processo={processo} todosProcessos={clienteAtual.processos} mesReferencia={mesReferencia} ano={ano} somenteLeitura={somenteLeitura}
                    processoModelo={modeloAtual ? modeloAtual.processos.find(x => x.id === processo.id) || null : null}
                    aberto={abertosAtual.has(processo.id)} onAlternar={()=>alternarProcesso(processo.id)}
                    acoesExtras={(!modeloAtual || !modeloAtual.processos.some(x => x.id === processo.id)) && <>
                      <span className="badge badge-extra" title={processo.origemSecaoId ? "Veio da biblioteca de seções" : "Seção criada só neste cronograma"}>🧩 seção personalizada</span>
                      {podeSecoes && !somenteLeitura && <button className="btn btn-sm btn-ghost" onClick={()=>removerSecaoDoCronograma(processo)}>Remover seção</button>}
                    </>}
                    destaqueEventoId={destaque && destaque.processoId === processo.id ? destaque.eventoId + ":" + destaque.n : null}
                    onUpdate={(novo)=>updateProcesso(processo.id, novo)}
                    onDesdobrar={(novos)=>desdobrarProcesso(processo, novos)} />
                ))}
                {!processosAtivos.length && <div className="muted">Nenhum processo ativo — ative no índice ao lado.</div>}
              </div>
            </div>
          )}
          {aba === "calendario" && <>
            <CalendarioMensal cliente={clienteAtual} ano={ano} mes={mesReferencia} soSinergy={soSinergy} onSoSinergy={setSoSinergy} onNavegar={navegarMes} />
            <PainelConflitos conflitos={conflitos} ano={ano} mes={mesReferencia} soSinergy={soSinergy} onSoSinergy={setSoSinergy} />
          </>}
          {aba === "previa_anual" && <GradeAnual cliente={clienteAtual} ano={ano} />}
          {aba === "clientes" && (
            <ClientesVinculadosTab key={clienteAtual.id} cliente={clienteAtual} vinculoDe={vinculoDe}
              base={usaGerencia && gerAtual ? baseClientesG.filter(c => c.gerenteId === gerAtual || (clienteAtual.clientesIds || []).includes(c.id)) : (escopo === "all" ? baseClientesG : baseVisivel.concat(baseClientesG.filter(c => (clienteAtual.clientesIds || []).includes(c.id) && c.gerenteId !== escopo)))}
              ano={ano} mesReferencia={mesReferencia} somenteLeitura={somenteLeitura}
              onEditar={()=>setAba("parametrizar")}
              onAlterarVinculos={vincularComGerencia} />
          )}
          {aba === "historico" && <>
            <VersoesCard fotos={fotosAtual} ano={ano} podeEditar={podeEditar && !travado} podeRestaurar={podeRestaurar}
              onSalvar={salvarVersaoManual} onRestaurar={restaurarFoto}
              onVer={f => setFotoAberta({ foto: f, modo: "ver" })} onComparar={f => setFotoAberta({ foto: f, modo: "comparar" })}
              onExcel={f => exportarExcel({ ...clienteAtual, ...f.visao, processos: f.visao.processos, nome: clienteAtual.nome + " (v" + f.n + ")" }, ano,
                (f.visao.clientesIds || []).map(id => basePorId[id]).filter(Boolean), "cliente").catch(e => showToast("Erro ao gerar o Excel: " + e.message))} />
            <HistoricoTab cliente={clienteAtual} />
          </>}
          {fotoAberta && clienteAtual && (
            <FotoModal foto={fotoAberta.foto} modo={fotoAberta.modo} cliente={clienteAtual} ano={ano} podeRestaurar={podeRestaurar}
              diferencas={fotoAberta.modo === "comparar" ? diffClientes({ ...clienteAtual, ...fotoAberta.foto.visao }, clienteAtual, nomeClienteBase) : []}
              onRestaurar={restaurarFoto} onFechar={()=>setFotoAberta(null)} />
          )}
        </>)}
      </main>
      {toast && <div className="toast" role="status">{toast}</div>}

      {modalNovo === "cadastro" && (
        <NovoCronogramaForm modelos={modelosVisiveis.filter(m => m.ativo !== false)} base={baseVisivel.filter(c => c.ativo !== false)} vinculoDe={vinculoDe} gerentes={gerentes} escopo={escopo} ano={ano} anosEstado={anosEstado} onCancelar={()=>setModalNovo(null)}
          onCriarDireto={criarCliente}
          onIrParaAssistente={(dados)=>{ setDadosCadastroPendente(dados); setModalNovo("assistente"); }} />
      )}
      {modalNovo === "assistente" && (
        <AssistenteWizard dadosCadastro={dadosCadastroPendente} ano={(dadosCadastroPendente && dadosCadastroPendente.ano) || ano}
          modelo={modelos.find(m => m.id === dadosCadastroPendente?.modeloId) || modelos[0]}
          onCancelar={()=>setModalNovo(null)} onCriar={criarClienteViaAssistente} />
      )}
      {loteModal && <LoteCronogramasModal {...loteModal} onCancelar={()=>setLoteModal(null)}
        onAplicar={async sel => { const f = loteModal.onAplicar; setLoteModal(null); await f(sel); }} />}
      {modalSecao && clienteAtual && (
        <AdicionarSecaoModal secoes={secoes} processosAtuais={clienteAtual.processos} ano={ano}
          onAdicionar={adicionarSecaoAoCronograma} onFechar={()=>setModalSecao(false)} />
      )}
      {modalStatus && clienteAtual && (
        <div className="modal-overlay" onMouseDown={fecharAoClicarFora(false, () => setModalStatus(null))}>
          <div className="modal-box" style={{width:480}}>
            {modalStatus.alvo === "aprovado" ? (
              modalStatus.etapa === 1 ? (
                <>
                  <h3>Aprovar cronograma — passo 1 de 2</h3>
                  <p>Aprovar o cronograma de <strong>{clienteAtual.nome}</strong> marca o rascunho como pronto para gerar tarefas na esteira e <strong>trava a edição</strong>. A aprovação é salva na hora, junto com qualquer alteração pendente.</p>
                  {alertasAtual.length > 0 && <p className="alerta">⚠ Este cronograma tem {alertasAtual.length} alerta(s) em {ano}.</p>}
                  <div className="wizard-actions">
                    <button className="btn btn-ghost" onClick={()=>setModalStatus(null)}>Cancelar</button>
                    <button className="btn btn-primary" onClick={()=>setModalStatus({alvo:"aprovado", etapa:2})}>Entendi, continuar</button>
                  </div>
                </>
              ) : (
                <>
                  <h3>Aprovar cronograma — passo 2 de 2</h3>
                  <p>Tem certeza? Confirme só depois de revisar a prévia anual e o calendário.</p>
                  <div className="wizard-actions">
                    <button className="btn btn-ghost" onClick={()=>setModalStatus(null)}>Cancelar</button>
                    <button className="btn btn-primary" onClick={confirmarMudancaStatus}>Aprovar definitivamente</button>
                  </div>
                </>
              )
            ) : (
              <>
                <h3>Mudar status</h3>
                <p>Mudar o status de <strong>{clienteAtual.nome}</strong> para "{STATUS_FLOW.find(s=>s.id===modalStatus.alvo)?.label}"? A mudança é salva na hora{atualSujo ? ", junto com as alterações pendentes" : ""}.</p>
                {clienteAtual.status === "aprovado" && (
                  <p className="muted">Isso destrava a edição. Quando a geração automática de tarefas estiver conectada, tarefas já concluídas na esteira NUNCA serão desfeitas por essa ação — só as pendentes.</p>
                )}
                <div className="wizard-actions">
                  <button className="btn btn-ghost" onClick={()=>setModalStatus(null)}>Cancelar</button>
                  <button className="btn btn-primary" onClick={confirmarMudancaStatus}>Confirmar</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
      <DialogHost />
    </>
  );
}

/* ---------- Sessão anônima e presença (aviso de edição concorrente) ---------- */
const SESSAO_ANONIMA_KEY = "sinergy_cronograma_sessao_anonima";
function getSessaoAnonima(){
  try {
    let id = sessionStorage.getItem(SESSAO_ANONIMA_KEY);
    if(!id){ id = novoId("s"); sessionStorage.setItem(SESSAO_ANONIMA_KEY, id); }
    return id;
  } catch(e){ return novoId("s"); }
}
const PRESENCA_TTL_MIN = 20;
function presencaAtiva(presenca, minhaSessao){
  if(!presenca || !presenca.sessao || presenca.sessao === minhaSessao) return null;
  const minutos = (Date.now() - new Date(presenca.ultimoPing).getTime()) / 60000;
  return minutos <= PRESENCA_TTL_MIN ? presenca : null;
}

// Mesma ordem do login do painel: Administrador > Gerente > Coordenador > demais, e alfabética dentro de cada grupo.
function ordemHierarquiaPainel(usuarios, grupos){
  const grupoDe = u => (grupos || []).find(g => g && g.id === u.groupId);
  const rank = u => {
    const g = grupoDe(u);
    if(!g) return 9;
    if(g.fullAccess) return 0;
    if(g.isGerente) return 1;
    if(g.id === "coord" || normalizar(g.name).includes("coord")) return 2;
    return 3;
  };
  return usuarios.slice().sort((a,b) => (rank(a) - rank(b)) || String(a.name || "").localeCompare(String(b.name || ""), "pt-BR", { sensitivity:"base" }));
}
function LoginTela({ usuarios, grupos, onEntrar }){
  const [tema, setTema] = useState(() => temaSalvo(null));
  function alternarTema(){ const t = tema === "claro" ? "escuro" : "claro"; setTema(t); aplicarTema(t); salvarTema(t, null); }
  const [nome, setNome] = useState("");
  const [pin, setPin] = useState("");
  const [erro, setErro] = useState("");
  const ordem = ordemHierarquiaPainel(usuarios, grupos);
  function entrar(e){
    e.preventDefault();
    const u = usuarios.find(x => x.name === nome && String(x.pin) === pin);
    if(!u){ setErro("Usuário ou PIN incorreto."); setPin(""); return; }
    onEntrar({ id: u.id, name: u.name, groupId: u.groupId, em: Date.now(), via: "login" });
  }
  return (
    <div className="login-wrap">
      <div className="login-col">
        <div className="login-topo">
          <div className="login-selo">S</div>
          <div className="login-marca">SinergyRH</div>
          <h1>Cronograma Operacional</h1>
          <p>🔒 Acesso restrito · mesmo usuário e PIN do painel</p>
        </div>
        <form className="login-box" onSubmit={entrar}>
          <label className="login-campo"><span>Usuário</span>
            <select value={nome} onChange={e=>{ setNome(e.target.value); setErro(""); }} autoFocus>
              <option value="">Selecione...</option>
              {ordem.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
            </select>
          </label>
          <label className="login-campo"><span>PIN</span>
            <input type="password" inputMode="numeric" autoComplete="current-password" placeholder="......" maxLength={6} value={pin}
              onChange={e=>{ setPin(e.target.value.replace(/\D/g, "").slice(0, 6)); setErro(""); }} />
          </label>
          {erro && <div className="login-erro">{erro}</div>}
          <button className="btn btn-primary login-entrar" disabled={!nome || pin.length < 4}>Entrar</button>
        </form>
        <div className="login-tema"><button type="button" className="botao-tema" onClick={alternarTema}>{tema === "claro" ? "🌙 Escuro" : "☀️ Claro"}</button></div>
      </div>
    </div>
  );
}
// Confere quem está entrando: vindo do painel (passagem de 2 min), sessão desta aba (12 h) ou tela de login.
function PortaoLogin(){
  const [st, setSt] = useState({ carregando: true, erro: null, usuarios: [], grupos: [], sessao: null });
  useEffect(() => { (async () => {
    try {
      const { usuarios, grupos } = await carregarUsuariosDoPainel();
      const ativos = usuarios.filter(u => u && u.id && u.active !== false);
      const achar = s => s && ativos.find(u => u.id === s.id);
      let sessao = null;
      const h = consumirHandoff(), uh = achar(h);
      if(uh){ sessao = { id: uh.id, name: uh.name, groupId: uh.groupId, em: Date.now(), via: "painel" }; gravarSessao(sessao); aplicarTema(temaSalvo(sessao.id)); }
      else {
        const s = lerSessao(), us = achar(s);
        if(us) sessao = { ...s, name: us.name, groupId: us.groupId }; else encerrarSessao();
      }
      setSt({ carregando: false, erro: null, usuarios: ativos, grupos, sessao });
    } catch(e){ setSt(x => ({ ...x, carregando: false, erro: e.message })); }
  })(); }, []);
  if(st.carregando) return <div style={{padding:40}}>Carregando…</div>;
  if(st.erro) return <div className="login-wrap"><div className="card login-box"><div className="alerta">Não consegui carregar os usuários do painel: {st.erro}</div></div></div>;
  if(!st.sessao) return <><LoginTela usuarios={st.usuarios} grupos={st.grupos} onEntrar={s => { gravarSessao(s); aplicarTema(temaSalvo(s.id)); setSt(x => ({ ...x, sessao: s })); }} /><DialogHost /></>;
  return <App sessao={st.sessao} gruposPainel={st.grupos} usuariosPainel={st.usuarios} onSair={() => { encerrarSessao(); setSt(x => ({ ...x, sessao: null })); }} />;
}
function Raiz(){
  const p = new URLSearchParams(window.location.search);
  if(p.get("testes") === "1") return <PainelTestes />;
  // Link de consulta (só leitura) continua abrindo sem login, como antes.
  if(!LOGIN_INTEGRADO || p.get("consulta") === "1") return <App />;
  return <PortaoLogin />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);
</script>
