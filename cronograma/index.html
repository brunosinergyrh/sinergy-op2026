function limiteCreditoDe4Para2(processos){
  return processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    const credito = acharEventoCredito(p);
    return { ...p, eventos: p.eventos.map(ev => {
      if(!/relatorios finais/.test(normalizar(ev.nome)) || ev.regra.tipo !== "deslocamento" || !Array.isArray(ev.regra.ou)) return ev;
      return { ...ev, regra: { ...ev.regra, ou: ev.regra.ou.map(o => credito && o.ref === credito.id && o.dias === 4 ? { ...o, dias: 2 } : o) } };
    }) };
  });
}

// Garante o limite "relatórios oficiais no mínimo N d.u. antes do crédito".
function limitarRelatoriosPeloCredito(processos, dias){
  return processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    const relatorios = p.eventos.find(e => /relatorios finais/.test(normalizar(e.nome)));
    const credito = acharEventoCredito(p);
    if(!relatorios || !credito || relatorios.regra.tipo !== "deslocamento") return p;
    const ou = (relatorios.regra.ou || []).filter(o => o.ref !== credito.id).concat([{ ref: credito.id, dias, direcao: "antes" }]);
    return { ...p, eventos: p.eventos.map(ev => ev.id === relatorios.id ? { ...ev, regra: { ...ev.regra, ou } } : ev) };
  });
}

// Amarra a Folha Mensal ao contábil, em sequência:
//   contábil (âncora, `regraContabil`)
//   ← conferência de encargos: `diasEncargos` d.u. antes do contábil
//   ← relatórios oficiais: `diasRelatorios` d.u. antes da conferência de encargos
// O resto da folha (fechamento, processamento, bloqueio, inputs) já conta pra
// trás a partir dos relatórios. Sem conferência de encargos no processo, os
// relatórios contam direto do contábil.
function amarrarFolhaAoContabil(processos, regraContabil, diasRelatorios, diasEncargos, diasCredito){
  if(diasCredito == null) diasCredito = CONTABIL_PADRAO.diasCredito;
  return limitarRelatoriosPeloCredito(processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    const achar = re => p.eventos.find(e => re.test(normalizar(e.nome)));
    const contabil = achar(/contabil/), relatorios = achar(/relatorios finais/), encargos = achar(/conferencia de encargos/);
    if(!contabil) return p;
    return { ...p, eventos: p.eventos.map(ev => {
      if(ev.id === contabil.id) return { ...ev, regra: clonar(regraContabil) };
      if(encargos && ev.id === encargos.id) return { ...ev, regra: offBeforeManual(contabil.id, diasEncargos) };
      if(relatorios && ev.id === relatorios.id) return { ...ev, regra: offBeforeManual(encargos ? encargos.id : contabil.id, encargos ? diasRelatorios : diasRelatorios + diasEncargos) };
      return ev;
    }) };
  }), diasCredito);
}
// Cliente COM prévia da folha (só Folha Mensal): o "Fechamento definitivo da
// folha" vira "Liberação da prévia para validação" e entra, logo depois, a
// tarefa do cliente "Validação da prévia da folha de pagamento". A validação
// assume a posição do antigo fechamento (1 d.u. antes da emissão), então
// relatórios, encargos e contábil não mudam; a liberação fica 1 d.u. antes da
// validação e o início da folha (processamento, bloqueio, inputs) antecipa 1 d.u.
function aplicarPreviaFolha(processos){
  return processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    if(p.eventos.some(e => /validacao da previa/.test(normalizar(e.nome)))) return p; // já tem
    const i = p.eventos.findIndex(e => /fechamento definitivo/.test(normalizar(e.nome)));
    if(i < 0) return p;
    const fech = p.eventos[i];
    const idVal = p.eventos.some(e => e.id === fech.id + "_val") ? novoId("fmp_valprev") : fech.id + "_val";
    const validacao = { id: idVal, nome: "Validação da prévia da folha de pagamento", responsavel: "CLIENTE", ativo: true,
      bloqueada: !!fech.bloqueada, excecoes: {}, regra: clonar(fech.regra) };
    const liberacao = { ...fech, nome: "Liberação da prévia para validação", responsavel: "SINERGY",
      regra: fech.regra.tipo === "deslocamento" && fech.regra.direcao === "antes" ? offBeforeManual(idVal, 1) : clonar(fech.regra) };
    if(!(fech.regra.tipo === "deslocamento" && fech.regra.direcao === "antes")) validacao.regra = offAfterManual(fech.id, 1);
    return { ...p, eventos: [...p.eventos.slice(0, i), liberacao, validacao, ...p.eventos.slice(i + 1)] };
  });
}
// O inverso: cliente SEM prévia. Tira a validação do cliente e a liberação da
// prévia volta a ser "Fechamento definitivo da folha", na posição da validação
// (mesmas datas de relatórios/encargos/contábil).
function removerPreviaFolha(processos){
  return processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    const val = p.eventos.find(e => /validacao da previa/.test(normalizar(e.nome)));
    const lib = p.eventos.find(e => /liberacao da previa/.test(normalizar(e.nome)));
    if(!val || !lib) return p;
    const regraFech = lib.regra.tipo === "deslocamento" && lib.regra.ref === val.id ? clonar(val.regra) : clonar(lib.regra);
    const eventos = p.eventos.filter(e => e.id !== val.id).map(e => {
      if(e.id === lib.id) return { ...e, nome: "Fechamento definitivo da folha", responsavel: "SINERGY", regra: regraFech };
      if(e.regra.tipo === "deslocamento" && e.regra.ref === val.id) return { ...e, regra: { ...e.regra, ref: lib.id } };
      return e;
    });
    return { ...p, eventos };
  });
}
function temPreviaFolha(processos){
  const p = (processos || []).find(x => x.id === "folha_mensal");
  return !!(p && p.eventos.some(e => /validacao da previa/.test(normalizar(e.nome))));
}

// Padrão: contábil dia 25 (ou útil anterior) · encargos 1 d.u. antes · relatórios 1 d.u. antes dos
// encargos, mas no mínimo 2 d.u. antes do crédito (padrão definido pelo usuário em set/2026).
const CONTABIL_PADRAO = { regra: { tipo:"dia_fixo", dia:25, ajuste:"prev", mesOffset:0 }, diasRelatorios: 1, diasEncargos: 1, diasCredito: 2 };

// v4 → v5: relatórios que contavam N d.u. antes do contábil passam a contar
// (N − dias dos encargos) antes da conferência de encargos — mesma data.
function relatoriosAntesDosEncargos(processos){
  return processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    const achar = re => p.eventos.find(e => re.test(normalizar(e.nome)));
    const contabil = achar(/contabil/), relatorios = achar(/relatorios finais/), encargos = achar(/conferencia de encargos/);
    if(!contabil || !relatorios || !encargos) return p;
    const rr = relatorios.regra, re = encargos.regra;
    if(rr.tipo !== "deslocamento" || rr.ref !== contabil.id || re.tipo !== "deslocamento" || re.ref !== contabil.id) return p;
    const dias = Math.max(1, (rr.direcao === "antes" ? rr.dias : -rr.dias) - (re.direcao === "antes" ? re.dias : -re.dias));
    return { ...p, eventos: p.eventos.map(ev => ev.id === relatorios.id ? { ...ev, regra: offBeforeManual(encargos.id, dias) } : ev) };
  });
}
function aplicarRegrasEncargosContabil(processos){
  return processos.map(p => {
    if(p.id !== "folha_mensal") return p;
    const achar = re => p.eventos.find(e => re.test(normalizar(e.nome)));
    const relatorios = achar(/relatorios finais/), conferencia = achar(/conferencia de encargos/), contabil = achar(/contabil/);
    return { ...p, eventos: p.eventos.map(ev =>
      conferencia && relatorios && ev.id === conferencia.id ? { ...ev, regra: offAfterManual(relatorios.id, 1) } :
      contabil && conferencia && ev.id === contabil.id ? { ...ev, regra: offAfterManual(conferencia.id, 1) } : ev) };
  });
}

// Faz as tarefas que contavam a partir de `eventoId` passarem a contar a partir
// da referência dele, somando os prazos — as datas não mudam, mas `eventoId`
// deixa de impactar qualquer outra tarefa. (Só vale se ele for um deslocamento.)
function desacoplarEvento(processo, eventoId){
  const alvo = processo.eventos.find(e => e.id === eventoId);
  if(!alvo || alvo.regra.tipo !== "deslocamento") return processo;
  const r = alvo.regra, sAlvo = r.direcao === "antes" ? -1 : 1;
  return { ...processo, eventos: processo.eventos.map(ev => {
    if(ev.id === eventoId || ev.regra.tipo !== "deslocamento" || ev.regra.ref !== eventoId || r.ref === ev.id) return ev;
    const total = sAlvo * r.dias + (ev.regra.direcao === "antes" ? -1 : 1) * ev.regra.dias;
    return { ...ev, regra: { ...ev.regra, ref: r.ref, dias: Math.abs(total), direcao: total < 0 ? "antes" : "depois", refManual: true } };
  }) };
}
function desacoplarHolerites(processos){
  return processos.map(p => p.eventos.filter(e => /holerite/.test(normalizar(e.nome))).reduce((acc, ev) => desacoplarEvento(acc, ev.id), p));
}

function seedModelosPadrao(){
  return MODELOS_PADRAO_DEF.map(d => {
    let processos = seedProcessos(d.regime);
    if(d.previa) processos = aplicarPreviaFolha(processos);
    return {
      id: d.id, nome: d.nome, regime: d.regime, previa: d.previa, versaoPadrao: VERSAO_MODELOS_PADRAO,
      processos: processos.map(p => ({ ...p, eventos: p.eventos.map(ev => ({ ...ev, bloqueada: true })) })),
    };
  });
}
// Garante que os dois Modelos padrão existam num catálogo já salvo (sem mexer
// nos Modelos que o usuário criou). O "Modelo Padrão (Caixa)" da versão
// anterior tinha regras imprecisas — fica marcado como antigo pra revisar/remover.
function completarModelosPadrao(salvos){
  let mudou = false;
  const lista = salvos.map(m => {
    if(m.id === "modelo_padrao" && !/antigo/i.test(m.nome)){ mudou = true; return { ...m, nome: m.nome + " (antigo — revisar ou remover)" }; }
    // Nome padrão antigo → nome novo (com "sem prévia"), só se o usuário não renomeou.
    const def = MODELOS_PADRAO_DEF.find(d => d.id === m.id);
    if(def && (def.nomesAntigos || []).includes(m.nome)){ mudou = true; m = { ...m, nome: def.nome, previa: def.previa }; }
    if(MODELOS_PADRAO_DEF.some(d => d.id === m.id) && (m.versaoPadrao || 1) < VERSAO_MODELOS_PADRAO){
      mudou = true;
      let processos = m.processos;
      if((m.versaoPadrao || 1) < 2) processos = desacoplarHolerites(processos);
      if((m.versaoPadrao || 1) < 3) processos = aplicarRegrasEncargosContabil(processos);
      if((m.versaoPadrao || 1) < 4) processos = amarrarFolhaAoContabil(processos, CONTABIL_PADRAO.regra, CONTABIL_PADRAO.diasRelatorios, CONTABIL_PADRAO.diasEncargos);
      else if((m.versaoPadrao || 1) < 5) processos = relatoriosAntesDosEncargos(processos);
      if((m.versaoPadrao || 1) < 6) processos = limitarRelatoriosPeloCredito(processos, CONTABIL_PADRAO.diasCredito);
      else if((m.versaoPadrao || 1) < 7) processos = limiteCreditoDe4Para2(processos);
      if((m.versaoPadrao || 1) < 8) processos = renomearTarefas(processos, RENOMES_V8).processos;
      return { ...m, versaoPadrao: VERSAO_MODELOS_PADRAO, processos };
    }
    return m;
  });
  seedModelosPadrao().forEach(s => { if(!lista.some(m => m.id === s.id)){ lista.unshift(s); mudou = true; } });
  lista.sort((a,b) => (MODELOS_PADRAO_DEF.findIndex(d => d.id === a.id) + 1 || 99) - (MODELOS_PADRAO_DEF.findIndex(d => d.id === b.id) + 1 || 99));
  return { lista, mudou };
}

// Cronograma → Modelo novo (quem tem a permissão "modelos"). Leva os blocos e tarefas da versão do ano, com a
// regra que vale em DEZEMBRO (como na virada de ano); regras "a partir de", ajustes pontuais, a foto do
// Modelo de origem (ev.padrao) e a origem de seção não vão. Travas 🔒, responsáveis, ciclo semanal, vínculos
// e categorias vão como estão.
function modeloAPartirDoCronograma(cr, nome, quem){
  const processos = clonar(cr.processos || []).map(p => {
    const { origemSecaoId, ...proc } = p;
    return { ...proc, eventos: p.eventos.map(ev => {
      const { excecoes, vigencias, padrao, ...e } = ev;
      return { ...e, regra: clonar(regraVigente(ev, 12)), excecoes: {} };
    }) };
  });
  return { id: novoId("modelo"), nome, processos,
    criadoDe: { cronogramaId: cr.id || null, cronograma: cr.nome || "", ano: cr.ano || null, em: new Date().toISOString(), por: quem || null } };
}
/* ---------- Versões ("fotos") ----------
   Cronograma: uma foto por ano é criada ao ENVIAR ao cliente (status "Aguardando cliente"), ao APROVAR e
   manualmente. Se o conteúdo (blocos/tarefas/prazos/clientes) for igual ao da última foto do ano, NÃO vira
   versão nova: só ganha mais um marco (ex.: v1 enviada → v1 aprovada). Restaurar: grupo com "restaura".
   Modelos: cada "Salvar Modelos" guarda o estado de cada Modelo que mudou (até 15 por Modelo). */
const TIPOS_FOTO = { envio:"enviada ao cliente", aprovacao:"aprovada", manual:"salva manualmente", antes_restaurar:"antes de restaurar", antes_modelo:"antes de mudança vinda do Modelo", antes_lixeira:"antes de ir para a lixeira" };
function fotoDoCronograma(visao){
  return clonar({ nome: visao.nome || "", processos: visao.processos || [], clientesIds: visao.clientesIds || [], status: visao.status,
    modeloId: visao.modeloId || null, modeloBase: visao.modeloBase || "", analista: visao.analista || "" });
}
function conteudoDaFoto(v){ return JSON.stringify({ p: v.processos || [], c: (v.clientesIds || []).slice().sort() }); }
// Devolve { lista, foto, nova } — nova = false quando só acrescentou um marco na última versão (conteúdo igual).
function registrarFotoNaLista(lista, ano, visao, tipo, motivo, quem){
  lista = (lista || []).slice();
  const em = new Date().toISOString(), marco = { tipo, em, por: quem || null, motivo: motivo || "" };
  const doAno = lista.filter(f => f.ano === ano).sort((a,b) => a.n - b.n);
  const ultima = doAno[doAno.length - 1];
  const visaoFoto = fotoDoCronograma(visao);
  if(ultima && conteudoDaFoto(ultima.visao) === conteudoDaFoto(visaoFoto)){
    const atualizada = { ...ultima, marcos: [...(ultima.marcos || []), marco], visao: { ...ultima.visao, status: visaoFoto.status } };
    return { lista: lista.map(f => f.id === ultima.id ? atualizada : f), foto: atualizada, nova: false };
  }
  const foto = { id: novoId("foto"), n: (ultima ? ultima.n : 0) + 1, ano, em, por: quem || null, marcos: [marco], visao: visaoFoto };
  return { lista: [...lista, foto], foto, nova: true };
}
function restaurarDaFoto(visaoAtual, foto){
  return { ...visaoAtual, processos: clonar(foto.visao.processos), modeloId: foto.visao.modeloId, modeloBase: foto.visao.modeloBase };
}
const MAX_VERSOES_POR_MODELO = 15;
// `motivo`: texto, ou objeto { modeloId: texto }.
function registrarVersoesDeModelos(versoes, antes, depois, quem, motivo){
  let out = (versoes || []).slice();
  const em = new Date().toISOString();
  const motivoDe = id => (motivo && typeof motivo === "object" ? motivo[id] : motivo) || "";
  depois.forEach(m => {
    const old = (antes || []).find(x => x.id === m.id);
    if(old && JSON.stringify(old) === JSON.stringify(m)) return;
    const doModelo = out.filter(v => v.modeloId === m.id);
    let n = doModelo.reduce((mx, v) => Math.max(mx, v.n), 0);
    if(!doModelo.length && old){ n++; out.push({ id: novoId("mv"), modeloId: m.id, n, nome: old.nome, em: null, por: null, motivo: "como estava antes do histórico", modelo: clonar(old) }); }
    n++;
    out.push({ id: novoId("mv"), modeloId: m.id, n, nome: m.nome, em, por: quem || null, motivo: motivoDe(m.id) || (old ? "alterado" : "criado"), modelo: clonar(m) });
  });
  const cont = {};
  return out.slice().reverse().filter(v => (cont[v.modeloId] = (cont[v.modeloId] || 0) + 1) <= MAX_VERSOES_POR_MODELO).reverse();
}
function processosDoModelo(modelo){ return clonar(modelo.processos); }
function acharEventoCredito(processo){ return processo.eventos.find(e => /cr[eé]dito/i.test(e.nome)) || null; }
function normalizar(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
// Tarefas de eSocial e de GFD/FGTS dentro da Folha Mensal (pelo nome, pra funcionar com Modelos já salvos).
function acharEventoGfd(processo){ return processo.eventos.find(e => /gfd|fgts/.test(normalizar(e.nome))) || null; }
function acharEventoEsocial(processo){ return processo.eventos.find(e => /esocial/.test(normalizar(e.nome))) || null; }

/* ---------- Categorias (cor por tipo de tarefa no calendário) ----------
   A categoria vem do nome da tarefa quando ele é específico (contábil,
   eSocial, encargos/FGTS — que moram dentro da Folha Mensal) e, fora isso,
   do processo. Processo novo, sem categoria conhecida, ganha uma cor própria. */
const CATEGORIAS = {
  folha:        { label:"Folha",             cor:"#2563eb" },
  adiantamento: { label:"Adiantamento",      cor:"#0891b2" },
  encargos:     { label:"Encargos / FGTS",   cor:"#ea580c" },
  esocial:      { label:"eSocial",           cor:"#7c3aed" },
  contabil:     { label:"Contábil",          cor:"#16a34a" },
  beneficios:   { label:"Benefícios",        cor:"#db2777" },
  ferias:       { label:"Férias",            cor:"#a16207" },
  decimo:       { label:"13º Salário",       cor:"#dc2626" },
  plr:          { label:"PLR",               cor:"#475569" },
};
const CORES_EXTRAS = ["#0f766e","#9d174d","#1d4ed8","#854d0e","#6d28d9","#be123c","#15803d","#0369a1"];
function categoriaDoEvento(processo, ev){
  if(ev.categoria) return ev.categoria;
  const n = normalizar(ev.nome);
  if(/contab/.test(n)) return "contabil";
  if(/esocial|dirf/.test(n)) return "esocial";
  if(/encargo|fgts|gfd|inss|darf|irrf/.test(n)) return "encargos";
  if(processo.categoria) return processo.categoria; // seção personalizada com cor escolhida
  const pid = processo.id || "";
  if(pid === "folha_mensal") return "folha";
  if(pid === "adiantamento") return "adiantamento";
  if(pid === "ferias") return "ferias";
  if(processo.familia === "beneficios" || pid.startsWith("beneficios")) return "beneficios";
  if(pid.startsWith("decimo")) return "decimo";
  if(pid === "plr") return "plr";
  return "proc:" + pid;
}
function infoCategoria(cat, nomeProcesso){
  if(CATEGORIAS[cat]) return CATEGORIAS[cat];
  let h = 0; for(const ch of cat) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return { label: nomeProcesso || cat.replace(/^proc:/, ""), cor: CORES_EXTRAS[h % CORES_EXTRAS.length] };
}

/* ---------- Base de clientes (CNPJ/CPF) e importação ---------- */
function soDigitos(s){ return String(s == null ? "" : s).replace(/\D/g, ""); }
// Responsáveis por cliente (importáveis pela planilha) e campos atualizáveis na importação.
const RESPONSAVEIS = [["gerente","Gerente"], ["coordenador","Coordenador"], ["analista","Analista responsável"]];
const CAMPOS_CLIENTE = [["razaoSocial","Razão social"], ["codigo","ID"], ["grupo","Grupo"], ...RESPONSAVEIS];
// Vários responsáveis no mesmo campo: "Ana, Bia" (vírgula ou ponto e vírgula). Mantém planilha/Excel como texto.
function nomesDoCampo(v){ return String(v || "").split(/\s*[,;]\s*/).map(s => s.trim()).filter(Boolean); }
function juntarNomes(lista){ return [...new Set((lista || []).map(s => String(s).trim()).filter(Boolean))].join(", "); }
function temNome(v, nome){ const n = normalizar(nome).trim(); return !!n && nomesDoCampo(v).some(x => normalizar(x).trim() === n); }
// ===== Gerência (mesma regra do painel op2026) =====
// Administrador/Diretor (fullAccess) vê tudo; Gerente vê a própria gerência; os demais, a do gerente a que estão
// ligados no painel (usuário.gerenteId). Gerências = usuários do grupo Gerente do painel.
function grupoDoUsuario(u, grupos){ return (grupos || []).find(g => g && u && g.id === u.groupId) || {}; }
function ehGerentePainel(u, grupos){ const g = grupoDoUsuario(u, grupos); return !!(u && (g.isGerente || u.groupId === "gerente")); }
function ehCoordPainel(u, grupos){ const g = grupoDoUsuario(u, grupos); return !!(u && !g.fullAccess && !g.isGerente && (u.groupId === "coord" || normalizar(g.name).includes("coord"))); }
function gerentesDoPainel(usuarios, grupos){
  return (usuarios || []).filter(u => u && u.active !== false && ehGerentePainel(u, grupos)).map(u => ({ id: u.id, nome: u.name })).sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR"));
}
function escopoDoUsuario(u, grupos){
  if(!u) return "all";
  const g = grupoDoUsuario(u, grupos);
  if(g.fullAccess || u.groupId === "admin" || u.gerenteId === "all") return "all";
  if(g.isGerente || u.groupId === "gerente") return u.id;
  return u.gerenteId || "__nenhuma__";
}
// Pessoas de uma gerência, por papel (para escolher coordenador/analista do cliente).
function pessoasDaGerencia(usuarios, grupos, gerenteId, papel){
  return (usuarios || []).filter(u => u && u.active !== false && u.gerenteId === gerenteId && !ehGerentePainel(u, grupos) && !grupoDoUsuario(u, grupos).fullAccess &&
    (papel === "coordenador" ? ehCoordPainel(u, grupos) : !ehCoordPainel(u, grupos))).map(u => u.name).sort((a,b) => a.localeCompare(b, "pt-BR"));
}
// Casa o nome do gerente digitado na base/planilha (ex.: "Ariana") com um gerente do painel.
function gerentePorNome(nome, gerentes){
  const n = normalizar(nome).trim(); if(!n) return null;
  const exato = (gerentes || []).filter(g => normalizar(g.nome).trim() === n); if(exato.length === 1) return exato[0];
  const parcial = (gerentes || []).filter(g => { const gn = normalizar(g.nome).trim(); return gn.startsWith(n + " ") || gn.split(" ")[0] === n; });
  return parcial.length === 1 ? parcial[0] : null;
}
// Pessoa do painel pelo nome digitado (exato; ou único que começa igual / mesmo primeiro nome).
function pessoaPorNome(nome, usuarios){
  const n = normalizar(nome).trim(); if(!n) return null;
  const ex = (usuarios || []).filter(u => u && normalizar(u.name).trim() === n); if(ex.length === 1) return ex[0];
  const pa = (usuarios || []).filter(u => { const un = normalizar(u && u.name).trim(); return un.startsWith(n + " ") || un.split(" ")[0] === n; });
  return pa.length === 1 ? pa[0] : null;
}
// Importação de clientes: confere Gerente/Coordenador/Analista com os usuários do painel.
//  - Gerente que não existe (ou de outra gerência, para quem não é Administrador) → a linha não entra.
//  - Coordenador/Analista que não existe ou é de outra gerência → o nome não é gravado e vira aviso.
//  - Nomes reconhecidos ficam com a grafia do painel. Sem Gerente, quem não é Administrador importa na própria gerência.
function validarResponsaveisImportacao(itens, opcoes){
  const { gerentes, usuarios, grupos, escopo } = opcoes;
  const avisos = [], rejeitados = [], ok = [];
  itens.forEach((it, i) => {
    const linha = it._linha || (i + 1), rotulo = it.razaoSocial || it.documentoBruto;
    let gid = null;
    if(it.gerente){
      const g = gerentePorNome(it.gerente, gerentes);
      if(!g){ rejeitados.push({ ...it, linha, motivo: 'Gerente "' + it.gerente + '" não existe entre os gerentes do painel' }); return; }
      if(escopo !== "all" && g.id !== escopo){ rejeitados.push({ ...it, linha, motivo: 'Gerente "' + g.nome + '" é de outra gerência' }); return; }
      gid = g.id;
    } else if(escopo !== "all") gid = escopo;
    const novo = { ...it, gerente: gid ? (gerentes.find(g => g.id === gid) || {}).nome || "" : "" };
    ["coordenador", "analista"].forEach(campo => {
      const bons = [];
      nomesDoCampo(it[campo]).forEach(nome => {
        const u = pessoaPorNome(nome, usuarios);
        if(!u){ avisos.push({ linha, rotulo, campo, nome, motivo: "não existe na tabela de usuários do painel" }); return; }
        if(gid && u.gerenteId !== gid){ avisos.push({ linha, rotulo, campo, nome: u.name, motivo: "é de outra gerência" }); return; }
        bons.push(u.name);
      });
      novo[campo] = juntarNomes(bons);
    });
    ok.push(novo);
  });
  return { itens: ok, avisos, rejeitados };
}
// Responsáveis de um cliente que não batem com nenhum usuário do painel (ou cliente sem gerência).
function responsaveisSemUsuario(c, usuarios){
  const out = [];
  if(!c.gerenteId) out.push("gerência não definida" + (c.gerente ? ' ("' + c.gerente + '" não é gerente no painel)' : ""));
  ["coordenador", "analista"].forEach(campo => nomesDoCampo(c[campo]).forEach(n => { if(!pessoaPorNome(n, usuarios)) out.push(campo + ' "' + n + '" sem usuário'); }));
  return out;
}
// Edição em lote de um campo de responsáveis ("Ana, Bia"): manter | substituir | adicionar | remover | limpar.
function aplicarAcaoNomes(valorAtual, acao, nomes){
  const atuais = nomesDoCampo(valorAtual), escolhidos = nomesDoCampo(nomes);
  const tem = (lista, n) => lista.some(x => normalizar(x) === normalizar(n));
  if(acao === "substituir") return juntarNomes(escolhidos);
  if(acao === "adicionar") return juntarNomes([...atuais, ...escolhidos.filter(n => !tem(atuais, n))]);
  if(acao === "remover") return juntarNomes(atuais.filter(n => !tem(escolhidos, n)));
  if(acao === "limpar") return "";
  return juntarNomes(atuais);
}
function gerenciaDoCliente(c, gerentes){ return (c && c.gerenteId) || ((gerentePorNome(c && c.gerente, gerentes) || {}).id) || null; }
// Gerência do cronograma: a gravada nele; senão, a dos clientes vinculados (se todos forem da mesma).
function gerenciaDoCronograma(gerenteId, clientesIds, basePorId){
  if(gerenteId) return gerenteId;
  const ids = [...new Set((clientesIds || []).map(id => basePorId[id] && basePorId[id].gerenteId).filter(Boolean))];
  return ids.length === 1 ? ids[0] : null;
}
// Responsável de um cronograma derivado dos clientes vinculados (o mais frequente; cada nome conta).
function responsavelDosClientes(clientesIds, basePorId, campo){
  const cont = {};
  (clientesIds || []).forEach(id => { nomesDoCampo(basePorId[id] && basePorId[id][campo]).forEach(v => { cont[v] = (cont[v] || 0) + 1; }); });
  const top = Object.entries(cont).sort((a,b) => b[1] - a[1])[0];
  return top ? top[0] : "";
}
function cnpjValido(d){
  if(!/^\d{14}$/.test(d) || /^(\d)\1{13}$/.test(d)) return false;
  const dv = base => {
    const pesos = base.length === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const r = base.split("").reduce((s, c, i) => s + Number(c) * pesos[i], 0) % 11;
    return r < 2 ? 0 : 11 - r;
  };
  const d1 = dv(d.slice(0, 12)), d2 = dv(d.slice(0, 12) + d1);
  return d.endsWith("" + d1 + d2);
}
function cpfValido(d){
  if(!/^\d{11}$/.test(d) || /^(\d)\1{10}$/.test(d)) return false;
  const dv = n => { let s = 0; for(let i = 0; i < n; i++) s += Number(d[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === Number(d[9]) && dv(10) === Number(d[10]);
}
// O Excel costuma comer o zero à esquerda de CNPJ/CPF guardado como número —
// aqui o documento é completado antes de validar.
function normalizarDocumento(v){
  let d = soDigitos(v);
  if(d.length === 11 && cpfValido(d)) return { doc:d, tipo:"CPF", valido:true };
  if(d.length >= 12 && d.length < 14) d = d.padStart(14, "0");
  if(d.length === 14) return { doc:d, tipo:"CNPJ", valido:cnpjValido(d) };
  if(d.length >= 9 && d.length <= 11){ const c = d.padStart(11, "0"); return { doc:c, tipo:"CPF", valido:cpfValido(c) }; }
  return { doc:d, tipo:"?", valido:false };
}
function fmtDocumento(d){
  if(/^\d{14}$/.test(d)) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
  if(/^\d{11}$/.test(d)) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
  return d || "—";
}
// Texto colado do Excel (tabulação) ou CSV (; ou ,) → matriz de células.
function parseTabelaTexto(txt){
  const linhas = String(txt || "").split(/\r?\n/).filter(l => l.trim());
  if(!linhas.length) return [];
  const l0 = linhas[0];
  const sep = l0.includes("\t") ? "\t" : (l0.split(";").length >= l0.split(",").length ? ";" : ",");
  return linhas.map(l => l.split(sep).map(c => c.trim().replace(/^"(.*)"$/, "$1")));
}
// Matriz de células → registros de cliente. Reconhece o cabeçalho pelos nomes
// (CNPJ/CPF/documento, razão social/nome, código, grupo); sem cabeçalho,
// adivinha a coluna do documento pelo conteúdo.
function mapearLinhasClientes(rows){
  if(!rows.length) return [];
  const cab = rows[0].map(normalizar);
  const achar = re => cab.findIndex(c => re.test(c));
  let iDoc = achar(/cnpj|cpf|documento|inscri/);
  let iCod = achar(/^cod|codigo|^id\b|^id$/);
  let iNome = cab.findIndex((c, i) => i !== iCod && /razao|nome|empresa|cliente/.test(c));
  let iGrupo = achar(/grupo/);
  let iGerente = achar(/gerente/), iCoord = achar(/coordena/), iAnalista = achar(/analista/);
  let dados = rows.slice(1);
  if(iDoc < 0){
    dados = rows;
    const ncol = Math.max(...rows.map(r => r.length));
    const pontua = f => [...Array(ncol).keys()].map(i => rows.filter(r => f(r[i] || "")).length);
    const docs = pontua(v => soDigitos(v).length >= 11);
    iDoc = docs.indexOf(Math.max(...docs));
    const textos = pontua(v => /[a-zA-ZÀ-ú]{3,}/.test(v));
    textos[iDoc] = -1;
    iNome = textos.indexOf(Math.max(...textos));
    iCod = -1; iGrupo = -1; iGerente = -1; iCoord = -1; iAnalista = -1;
  }
  const col = (r, i) => i >= 0 ? String(r[i] || "").trim() : "";
  return dados.map(r => ({
    documentoBruto: r[iDoc] || "",
    razaoSocial: col(r, iNome), codigo: col(r, iCod), grupo: col(r, iGrupo),
    gerente: col(r, iGerente), coordenador: col(r, iCoord), analista: col(r, iAnalista),
  })).filter(x => x.documentoBruto || x.razaoSocial);
}
// Compara o que veio da planilha com a base atual (casando por documento).
// Regras: CNPJ/CPF é a chave (existente = atualização); CNPJ repetido no arquivo e ID repetido (no arquivo ou já
// usado por OUTRO CNPJ na base) vão para "Com problema" e não entram.
function analisarImportacao(base, itens){
  const porDoc = Object.fromEntries(base.map(c => [c.documento, c]));
  const chaveId = v => normalizar(v).trim();
  const porId = {}; base.forEach(c => { const k = chaveId(c.codigo); if(k) porId[k] = c; });
  const vistos = {}, idsNoArquivo = {};
  const novos = [], atualizados = [], iguais = [], invalidos = [];
  itens.forEach((it, i) => {
    const linha = it._linha || (i + 1);
    const n = normalizarDocumento(it.documentoBruto);
    if(!n.valido){ invalidos.push({ ...it, linha, motivo: n.doc ? n.tipo + " inválido (" + n.doc + ")" : "sem documento" }); return; }
    if(vistos[n.doc]){ invalidos.push({ ...it, linha, motivo: "CNPJ/CPF repetido no arquivo (já aparece na linha " + vistos[n.doc] + ")" }); return; }
    vistos[n.doc] = linha;
    const kId = chaveId(it.codigo);
    if(kId){
      if(idsNoArquivo[kId] && idsNoArquivo[kId].doc !== n.doc){ invalidos.push({ ...it, linha, motivo: 'ID "' + it.codigo + '" repetido no arquivo (linha ' + idsNoArquivo[kId].linha + ", outro CNPJ)" }); return; }
      const dono = porId[kId];
      if(dono && dono.documento !== n.doc){ invalidos.push({ ...it, linha, motivo: 'ID "' + it.codigo + '" já pertence a ' + (dono.razaoSocial || "outro cliente") + " (" + fmtDocumento(dono.documento) + ")" }); return; }
      idsNoArquivo[kId] = { doc: n.doc, linha };
    }
    const reg = { documento:n.doc, tipoDocumento:n.tipo, razaoSocial:it.razaoSocial, codigo:it.codigo, grupo:it.grupo,
      gerente:it.gerente || "", coordenador:it.coordenador || "", analista:it.analista || "" };
    const ex = porDoc[n.doc];
    if(!ex){ novos.push(reg); return; }
    // Célula vazia na planilha não apaga o que já está na base — só valores preenchidos atualizam.
    const campos = CAMPOS_CLIENTE.map(c => c[0]).filter(k => reg[k] && reg[k] !== (ex[k] || ""));
    if(campos.length) atualizados.push({ existente:ex, novo:reg, campos }); else iguais.push(ex);
  });
  return { novos, atualizados, iguais, invalidos };
}
function aplicarImportacao(base, analise){
  const atual = Object.fromEntries(analise.atualizados.map(a => [a.existente.id, a]));
  const agora = new Date().toISOString();
  return [
    ...base.map(c => {
      const a = atual[c.id]; if(!a) return c;
      const patch = {}; a.campos.forEach(k => { patch[k] = a.novo[k]; });
      return { ...c, ...patch, atualizadoEm: agora };
    }),
    ...analise.novos.map(r => ({ id: novoId("emp"), ...r, criadoEm: agora })),
  ];
}

const ANCORA_TIPOS = ["dia_fixo","nth_util","ultimo_util","penultimo_util","nth_util_fim","nth_semana"];

/* ---------- v4: alertas do ano, padrão do Modelo, resumo do índice ---------- */
// Todos os alertas de um cronograma no ano — uma entrada por tarefa+tipo de
// mensagem, com a lista de competências em que aparece (datas não entram na
// chave, senão o mesmo problema viraria 12 alertas).
function alertasDoAno(cronograma, ano){
  const mapa = {};
  (cronograma.processos || []).filter(p => p.ativo).forEach(p => {
    mesesDoProcesso(p).forEach(m => {
      resolveProcesso(p, ano, m, cronograma.processos).forEach(c => {
        if(!c || c.ativo === false || !c.alertas || !c.alertas.length) return;
        c.alertas.forEach(msg => {
          const k = p.id + "|" + c.id + "|" + msg.replace(/\d{2}\/\d{2}\/\d{4}/g, "…").replace(/\d+/g, "#");
          if(!mapa[k]) mapa[k] = { processoId:p.id, processo:p.nome, eventoId:c.id, evento:c.nome, mensagem:msg, meses:[] };
          mapa[k].meses.push(m);
        });
      });
    });
  });
  return Object.values(mapa);
}

/* ---------- Versões por ano ----------
   Um cronograma guarda, no topo, o que é dele em qualquer ano (nome, analista,
   arquivado) e, em `versoes[ano]`, o que é de cada ano: regras (processos),
   clientes vinculados, Modelo, status/aprovação e histórico. Editar 2026 não
   mexe em 2027. Anos já encerrados ficam só para leitura. */
const CAMPOS_VERSAO = ["processos", "clientesIds", "status", "historico", "acoes", "modeloId", "modeloBase", "reaberto"];
const CAMPOS_TOPO = ["nome", "analista", "arquivado", "gerenteId"]; // gerência vale para todos os anos
function anoCalendarioAtual(){ return new Date().getFullYear(); }
// ANO VIGENTE = o "ano atual" da operação no sistema (não o do calendário). Hoje 2027: é quando começam a
// criação e as validações dos cronogramas. Fica salvo em sinergy_cronograma_anos e só muda por Gerente/
// Administrador (não vira sozinho em 1º de janeiro). Sem configuração salva, assume o ano seguinte ao calendário.
let ANO_VIGENTE = null;
function anoVigente(){ return ANO_VIGENTE || (anoCalendarioAtual() + 1); }
function anoTrabalhoPadrao(){ return anoVigente(); }
// Cronograma antigo (sem versões) vira a versão do ano indicado.
function migrarParaVersoes(cr, anoPadrao){
  if(!cr || cr.versoes) return cr;
  const topo = { ...cr }, v = {};
  CAMPOS_VERSAO.forEach(k => { if(cr[k] !== undefined) v[k] = cr[k]; delete topo[k]; });
  topo.versoes = { [anoPadrao]: { ...v, atualizadoEm: cr.atualizadoEm || null } };
  return topo;
}
function anosDoCronograma(cr){ return Object.keys((cr && cr.versoes) || {}).map(Number).sort((a,b) => a - b); }
// "Visão" = o cronograma como o resto do sistema sempre enxergou (processos,
// status etc. no topo), só que do ano pedido. null se não houver versão.
function visaoDoAno(cr, ano){
  const v = cr && cr.versoes && cr.versoes[ano];
  if(!v) return null;
  return { ...cr, ...v, id: cr.id, ano: Number(ano) };
}
// Grava uma visão editada de volta no ano dela.
function gravarVisao(cr, ano, visao){
  const v = {};
  CAMPOS_VERSAO.forEach(k => { if(visao[k] !== undefined) v[k] = visao[k]; });
  const topo = { ...cr };
  CAMPOS_TOPO.forEach(k => { if(visao[k] !== undefined) topo[k] = visao[k]; });
  topo.versoes = { ...(cr.versoes || {}), [ano]: { ...((cr.versoes || {})[ano] || {}), ...v } };
  return topo;
}
// Encerramento do ano é MANUAL (Gerente/Administrador), para o ano inteiro de uma vez:
// anosEstado = { "2026": { encerrado:true, por, em, historico:[...] } }.
// Ano encerrado = só leitura, a não ser que a versão de um cronograma tenha sido reaberta para correção.
function anoEncerrado(ano, anosEstado){ return !!(anosEstado && anosEstado[ano] && anosEstado[ano].encerrado); }
function anoTravado(ano, versao, anosEstado){
  return anoEncerrado(ano, anosEstado) && !(versao && versao.reaberto);
}
// Ano que já terminou no calendário mas ainda não foi encerrado pelo gerente.
// Ano anterior ao vigente que ainda não foi encerrado pelo gerente.
function anoPendenteDeEncerrar(ano, anosEstado, vigente){
  return Number(ano) < (vigente || anoVigente()) && !anoEncerrado(ano, anosEstado);
}
// Última data da competência de dezembro do ano (folha, encargos, eSocial… caem no ano seguinte):
// antes dela, encerrar o ano pode travar tarefas que ainda vão acontecer.
function ultimaTarefaDeDezembro(cronogramasVisoes, ano){
  let ultima = null;
  cronogramasVisoes.forEach(cr => (cr.processos || []).filter(p => p.ativo && mesesDoProcesso(p).includes(12)).forEach(p => {
    resolveProcesso(p, ano, 12, cr.processos).forEach(c => { if(c && c.ativo !== false && c.data && (!ultima || c.data > ultima)) ultima = c.data; });
  }));
  return ultima;
}
// Virada de ano: nova versão copiada da versão anterior mais recente. A regra que
// valia em dezembro vira a regra do ano novo; regras "a partir de" e ajustes
// pontuais (que eram do ano anterior) não passam; status recomeça do zero.
function abrirAno(cr, anoNovo, quem){
  const anteriores = anosDoCronograma(cr).filter(a => a < anoNovo);
  const anoBase = anteriores.length ? anteriores[anteriores.length - 1] : anosDoCronograma(cr)[0];
  const base = cr.versoes[anoBase];
  const agora = new Date().toISOString();
  const processos = clonar(base.processos || []).map(p => ({ ...p, eventos: p.eventos.map(ev => {
    const { vigencias, ...resto } = ev;
    return { ...resto, regra: clonar(regraVigente(ev, 12)), excecoes: {} };
  }) }));
  const versao = {
    processos, clientesIds: (base.clientesIds || []).slice(), modeloId: base.modeloId || null, modeloBase: base.modeloBase || "",
    status: "em_desenvolvimento",
    historico: [{ status:"em_desenvolvimento", em: agora, por: quem || "sistema", motivo: "Versão " + anoNovo + " aberta a partir de " + anoBase }],
    acoes: [{ tipo:"criacao", descricao:"Versão " + anoNovo + " aberta a partir de " + anoBase + ".", em: agora, quem: quem || null }],
    atualizadoEm: agora,
  };
  return { cronograma: { ...cr, versoes: { ...cr.versoes, [anoNovo]: versao } }, anoBase };
}

// Lixeira: cronograma excluído fica 15 dias (cronograma.excluido = { em, por }); depois é apagado sozinho.
const LIXEIRA_DIAS = 15;
function diasRestantesLixeira(excluido, agora){
  if(!excluido || !excluido.em) return null;
  const passados = ((agora || new Date()) - new Date(excluido.em)) / 86400000;
  return Math.max(0, Math.ceil(LIXEIRA_DIAS - passados));
}
// Resumo leve de um cronograma, guardado no índice: é o que a tela inicial,
// o painel, a fila de aprovação e a busca usam sem abrir cada cronograma.
// Um resumo por ano (status, clientes e alertas daquele ano).
function resumoDe(cr){
  const versoes = {};
  anosDoCronograma(cr).forEach(a => {
    const v = cr.versoes[a];
    let alertas = 0;
    try { alertas = alertasDoAno({ processos: v.processos || [] }, a).length; } catch(e){}
    versoes[a] = { status: v.status, clientesIds: (v.clientesIds || []).slice(), modeloId: v.modeloId || null, modeloBase: v.modeloBase || "", alertas, atualizadoEm: v.atualizadoEm || null, reaberto: !!v.reaberto,
      secoesUsadas: [...new Set((v.processos || []).map(p => p.origemSecaoId).filter(Boolean))] };
  });
  return { id: cr.id, nome: cr.nome, analista: cr.analista || "", arquivado: !!cr.arquivado, gerenteId: cr.gerenteId || null, excluido: cr.excluido || null, atualizadoEm: cr.atualizadoEm || null, versoes };
}
// Linha da lista/painel para um ano: dados do cronograma + da versão daquele ano (ou "sem versão").
function linhaDoAno(r, ano){
  const v = r.versoes && r.versoes[ano];
  return { id: r.id, nome: r.nome, analista: r.analista || "", arquivado: !!r.arquivado, gerenteId: r.gerenteId || null, excluido: r.excluido || null, anos: Object.keys(r.versoes || {}).map(Number).sort(),
    temVersao: !!v, status: v ? v.status : null, clientesIds: v ? v.clientesIds || [] : [], modeloId: v ? v.modeloId : null,
    modeloBase: v ? v.modeloBase : "", alertas: v ? v.alertas : undefined, atualizadoEm: v ? v.atualizadoEm : r.atualizadoEm, reaberto: v ? !!v.reaberto : false };
}
// Índice antigo (sem versões) → formato novo, sem abrir o cronograma.
function migrarResumo(r, anoPadrao){
  if(r.versoes) return r;
  return { id: r.id, nome: r.nome, analista: r.analista || "", arquivado: !!r.arquivado, atualizadoEm: r.atualizadoEm || null, precisaRecalcular: r.alertas === undefined,
    versoes: { [anoPadrao]: { status: r.status, clientesIds: r.clientesIds || [], modeloId: r.modeloId || null, modeloBase: r.modeloBase || "", alertas: r.alertas, atualizadoEm: r.atualizadoEm || null } } };
}
function upsertResumo(lista, item){ return lista.some(c => c.id === item.id) ? lista.map(c => c.id === item.id ? item : c) : [...lista, item]; }

// Guarda em cada tarefa a versão do Modelo de onde ela nasceu (nome,
// responsável, prazo). É o que permite, depois, "aplicar o Modelo atualizado"
// sem atropelar o que foi personalizado no cronograma.
function anexarPadrao(processos, modelo){
  if(!modelo) return processos;
  const idx = {};
  modelo.processos.forEach(p => p.eventos.forEach(e => { idx[p.id + "|" + e.id] = e; }));
  return processos.map(p => ({ ...p, eventos: p.eventos.map(e => {
    const m = idx[p.id + "|" + e.id];
    return m ? { ...e, padrao: { nome:m.nome, responsavel:m.responsavel, regra:clonar(m.regra) } } : e;
  }) }));
}

// Diferenças de uma tarefa do cronograma em relação ao Modelo ATUAL.
// null = igual ao padrão; { extra:true } = tarefa que não existe no Modelo.
function diferencasDoPadrao(procCron, ev, procModelo){
  if(!procModelo) return null;
  const m = procModelo.eventos.find(e => e.id === ev.id);
  if(!m) return { extra:true, itens:["Tarefa que não existe no Modelo"] };
  const itens = [];
  if(m.nome !== ev.nome) itens.push('Nome no Modelo: "' + m.nome + '"');
  if(m.responsavel !== ev.responsavel) itens.push("Responsável no Modelo: " + m.responsavel);
  if((m.ativo !== false) !== (ev.ativo !== false)) itens.push(m.ativo !== false ? "No Modelo a tarefa é ativa" : "No Modelo a tarefa é inativa");
  const a = descreverRegra(ev.regra, procCron.eventos), b = descreverRegra(m.regra, procModelo.eventos);
  if(a !== b) itens.push("Prazo no Modelo: " + b);
  return itens.length ? { extra:false, itens, modelo:m } : null;
}
// Quantas tarefas de um processo estão fora do padrão / faltando em relação ao Modelo.
function resumoPadraoProcesso(procCron, procModelo){
  if(!procModelo) return { fora:0, extras:0, faltando:0 };
  let fora = 0, extras = 0;
  procCron.eventos.forEach(ev => { const d = diferencasDoPadrao(procCron, ev, procModelo); if(d){ d.extra ? extras++ : fora++; } });
  const faltando = procModelo.eventos.filter(m => !procCron.eventos.some(e => e.id === m.id)).length;
  return { fora, extras, faltando };
}

// Aplica num cronograma o que mudou no Modelo DESDE que o cronograma foi
// criado — campo a campo (prazo, nome, responsável). Se o cronograma já tinha
// personalizado aquele campo, ele é preservado. Tarefas sem a referência de
// origem (cronogramas criados antes da v4) não são tocadas.
function aplicarModeloAtualizado(cronograma, modelo){
  const idx = {};
  modelo.processos.forEach(p => p.eventos.forEach(e => { idx[p.id + "|" + e.id] = e; }));
  const alteradas = []; let semReferencia = 0, personalizadas = 0;
  const campos = [["regra", x => JSON.stringify(x)], ["nome", x => x], ["responsavel", x => x]];
  const processos = cronograma.processos.map(p => ({ ...p, eventos: p.eventos.map(e => {
    const m = idx[p.id + "|" + e.id];
    if(!m) return e;
    if(!e.padrao){ semReferencia++; return e; }
    let novo = e, mudou = false;
    const padrao = { ...e.padrao };
    campos.forEach(([campo, f]) => {
      const orig = f(e.padrao[campo]), doModelo = f(m[campo]), atual = f(e[campo]);
      if(doModelo === orig) return;                    // o Modelo não mudou esse campo
      if(atual !== orig){ personalizadas++; return; }  // o cronograma personalizou — preserva
      novo = { ...novo, [campo]: clonar(m[campo]) }; padrao[campo] = clonar(m[campo]); mudou = true;
    });
    if(mudou){ alteradas.push(p.nome + " · " + e.nome); return { ...novo, padrao }; }
    return e;
  }) }));
  return { cronograma: { ...cronograma, processos }, alteradas, semReferencia, personalizadas };
}

// Migração: cronogramas criados antes da base de clientes guardavam CNPJ
// principal/adicionais dentro deles. Leva esses documentos pra base (sem
// duplicar) e preenche clientesIds. Idempotente.
function migrarCnpjsParaBase(cronogramas, base){
  let novaBase = base.slice(), mudouBase = false;
  const porDoc = Object.fromEntries(novaBase.map(c => [c.documento, c]));
  const cronosAlterados = {};
  cronogramas.forEach(cr => {
    if(cr.clientesIds) return;
    const docs = [cr.cnpjPrincipal, ...(cr.cnpjsAdicionais || [])].filter(Boolean);
    const ids = [];
    docs.forEach((d, i) => {
      const n = normalizarDocumento(d);
      if(!n.doc) return;
      let reg = porDoc[n.doc];
      if(!reg){
        reg = { id: novoId("emp"), documento:n.doc, tipoDocumento:n.tipo, razaoSocial: i === 0 ? (cr.razaoSocial || cr.nome) : "", codigo: i === 0 ? (cr.codigoExterno || "") : "", grupo:"", criadoEm: new Date().toISOString() };
        novaBase.push(reg); porDoc[n.doc] = reg; mudouBase = true;
      }
      ids.push(reg.id);
    });
    cronosAlterados[cr.id] = { ...cr, clientesIds: ids };
  });
  return { base: novaBase, mudouBase, cronosAlterados };
}
