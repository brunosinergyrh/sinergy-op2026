   referência (validadas para daltonismo em todos os pares); barras de uma série
   só usam uma cor. Valores sempre escritos ao lado — cor nunca é a única pista. */
const COR_SITUACAO = { aprovado:"#2a78d6", andamento:"#eb6834", sem:"#1baf7a" };
const ROTULO_SITUACAO = { aprovado:"Com cronograma aprovado no ano", andamento:"Cronograma do ano em andamento", sem:"Sem cronograma no ano" };
function diasDesde(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }
function pct(n, total){ return total ? Math.round(n / total * 100) : 0; }

function BarraSerie({ valor, max, rotulo, detalhe, onClick }){
  const larg = max ? Math.max(valor ? 2 : 0, valor / max * 100) : 0;
  return (
    <div className="serie-linha">

        <div className="serie-barra" style={{ width: larg + "%" }} />

      <div className="serie-valor"><strong>{valor}</strong>{detalhe && <span className="muted"> · {detalhe}</span>}</div>
    </div>

}

function PainelTela({ linhas: todasLinhas, ano, base, basePorId, modelos, analistas, onAbrir, onFiltrarCarteira, estadoAno, podeEncerrar, onEncerrar, onReabrir }){
  // Só entram no painel os cronogramas com versão no ano; os que ainda não abriram o ano viram um indicador próprio.
  const semVersaoAno = todasLinhas.filter(c => !c.arquivado && !c.temVersao);
  const linhas = todasLinhas.filter(c => c.temVersao);
  const [fAnalista, setFAnalista] = useState("");
  const [agrupar, setAgrupar] = useState("analista"); // analista (do cronograma) | coordenador | gerente (da base de clientes)
  const [fModelo, setFModelo] = useState("");
  const [diasParado, setDiasParado] = useState(15);
  const [verTabelaSituacao, setVerTabelaSituacao] = useState(false);

  const ativos = linhas.filter(c => !c.arquivado);
  const filtrados = ativos.filter(c => (!fAnalista || (fAnalista === "__sem" ? !c.analista : c.analista === fAnalista)) && (!fModelo || c.modeloId === fModelo));
  const nCnpj = c => (c.clientesIds || []).length;

  // Situação de cada CNPJ da base (sempre a base inteira): aprovado > em andamento > sem cronograma.
  const situacao = useMemo(() => {
    const porCliente = {};
    ativos.forEach(c => (c.clientesIds || []).forEach(id => { (porCliente[id] = porCliente[id] || []).push(c.status); }));
    const cont = { aprovado:0, andamento:0, sem:0 };
    const semPorGrupo = {};
    base.forEach(b => {
      const st = porCliente[b.id];
      const s = !st ? "sem" : st.includes("aprovado") ? "aprovado" : "andamento";
      cont[s]++;
      if(s === "sem"){ const g = b.grupo || "(sem grupo)"; semPorGrupo[g] = (semPorGrupo[g] || 0) + 1; }
    });
    return { cont, semPorGrupo: Object.entries(semPorGrupo).sort((a,b) => b[1] - a[1]) };
  }, [ativos, base]);
  const totalBase = base.length;

  const funil = STATUS_FLOW.map(s => {
    const cs = filtrados.filter(c => c.status === s.id);
    return { ...s, n: cs.length, cnpjs: cs.reduce((t, c) => t + nCnpj(c), 0) };
  });
  const maxFunil = Math.max(1, ...funil.map(f => f.n));

  const parados = filtrados.filter(c => c.status !== "aprovado" && diasDesde(c.atualizadoEm) !== null && diasDesde(c.atualizadoEm) >= diasParado)
    .sort((a,b) => (a.atualizadoEm || "") < (b.atualizadoEm || "") ? -1 : 1);
  const emAprovacao = filtrados.filter(c => STATUS_EM_APROVACAO.includes(c.status)).sort((a,b) => (a.atualizadoEm || "") < (b.atualizadoEm || "") ? -1 : 1);
  const comAlerta = filtrados.filter(c => c.alertas > 0).sort((a,b) => b.alertas - a.alertas);
  const semClientes = filtrados.filter(c => !nCnpj(c));

  const chaveGrupo = c => (agrupar === "analista" ? c.analista : responsavelDosClientes(c.clientesIds, basePorId, agrupar)) || "__sem";
  const nomesAnalistas = [...new Set(filtrados.map(chaveGrupo))];
  const porAnalista = nomesAnalistas.map(a => {
    const cs = filtrados.filter(c => chaveGrupo(c) === a);
    return { analista: a, n: cs.length, cnpjs: cs.reduce((t, c) => t + nCnpj(c), 0), aprovados: cs.filter(c => c.status === "aprovado").length,
      emAprovacao: cs.filter(c => STATUS_EM_APROVACAO.includes(c.status)).length, alerta: cs.filter(c => c.alertas > 0).length,
      parados: cs.filter(c => parados.includes(c)).length };
  }).sort((a,b) => b.n - a.n);
  const porModelo = modelos.map(m => ({ id:m.id, nome:m.nome, n: filtrados.filter(c => c.modeloId === m.id).length }))
    .concat([{ id:"__outro", nome:"Sem Modelo / Modelo removido", n: filtrados.filter(c => !modelos.some(m => m.id === c.modeloId)).length }])
    .filter(x => x.n > 0).sort((a,b) => b.n - a.n);
  const maxModelo = Math.max(1, ...porModelo.map(m => m.n));
  const aprovadosFiltro = funil.find(f => f.id === "aprovado").n;

  const ListaAtencao = ({ titulo, itens, detalhe, vazio }) => (
    <div className="card atencao">
      <h3><span>{titulo}</span><span className="badge badge-months">{itens.length}</span></h3>
      {!itens.length ? <div className="muted">{vazio}</div> : (
        <ul className="lista-atencao">
          {itens.slice(0, 8).map(c => (
            <li key={c.id}>
              <a href={linkCronograma(c.id)} className="link-crono">{c.nome}</a>
              <span className="muted"> · {detalhe(c)}</span>
            </li>
          ))}
          {itens.length > 8 && <li className="muted">e mais {itens.length - 8}…</li>}
        </ul>
      )}
    </div>
  );

  return (
    <div style={{paddingTop:20}}>
      <div className="topbar"><div>
        <h2>Painel <span className="chip-ano">{ano}</span></h2>
        <div className="sub">Situação dos clientes e dos cronogramas em {ano} · {ativos.length} cronograma(s) com versão {ano} · {totalBase} CNPJ(s) na base</div>
      </div></div>

      <div className="card encerramento">
        <div>
          <strong>Encerramento de {ano}:</strong>{" "}
          {estadoAno && estadoAno.encerrado
            ? <span>🔒 encerrado por {estadoAno.por} em {fmtHora(estadoAno.em)}</span>
            : <span className="muted">aberto{ano < anoVigente() ? " — o ano já terminou no calendário" : ""}</span>}
          {estadoAno && (estadoAno.historico || []).length > 0 && (
            <div className="muted" style={{marginTop:4}}>{estadoAno.historico.slice(-3).reverse().map((h, i) => <div key={i}>{fmtHora(h.em)} · {h.acao === "encerrado" ? "encerrado" : "reaberto"} por {h.por}{h.motivo ? " — " + h.motivo : ""}{h.acao === "encerrado" && (h.naoAprovados || h.comAlerta) ? " (com " + h.naoAprovados + " não aprovado(s), " + h.comAlerta + " com alerta)" : ""}</div>)}</div>
          )}
        </div>
        {podeEncerrar && (estadoAno && estadoAno.encerrado
          ? <button className="btn btn-sm btn-outline" onClick={onReabrir}>Reabrir {ano}…</button>
          : <button className="btn btn-sm btn-primary" onClick={onEncerrar}>Encerrar {ano}…</button>)}
      </div>

      <div className="card filtros" style={{padding:"10px 14px"}}>
        <select value={fAnalista} onChange={e=>setFAnalista(e.target.value)} aria-label="Filtrar por analista">
          <option value="">Todos os analistas</option>
          {analistas.map(a => <option key={a} value={a}>{a}</option>)}
          <option value="__sem">Sem analista</option>
        </select>
        <select value={fModelo} onChange={e=>setFModelo(e.target.value)} aria-label="Filtrar por Modelo">
          <option value="">Todos os Modelos</option>
          {modelos.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
        </select>
        <label className="muted chk">Parado há mais de <input type="number" min="1" max="365" value={diasParado} onChange={e=>setDiasParado(Math.max(1, Number(e.target.value)||15))} style={{width:64}} /> dias</label>
        {(fAnalista || fModelo) && <button className="link-btn" onClick={()=>{ setFAnalista(""); setFModelo(""); }}>limpar filtros</button>}
        <span className="muted" style={{marginLeft:"auto"}}>Os filtros valem para os cronogramas; a situação dos CNPJs é sempre da base inteira.</span>
      </div>

      <div className="kpis">
        <div className="kpi"><div className="kpi-n">{totalBase}</div><div className="kpi-l">CNPJs na base</div></div>
        <div className="kpi"><div className="kpi-n">{pct(situacao.cont.aprovado, totalBase)}%</div><div className="kpi-l">dos CNPJs com cronograma aprovado <span className="muted">({situacao.cont.aprovado})</span></div></div>
        <div className="kpi"><div className="kpi-n">{situacao.cont.sem}</div><div className="kpi-l">CNPJs sem cronograma</div></div>
        <div className="kpi"><div className="kpi-n">{aprovadosFiltro}<span className="kpi-de"> / {filtrados.length}</span></div><div className="kpi-l">cronogramas aprovados</div></div>
        <div className="kpi"><div className="kpi-n">{emAprovacao.length}</div><div className="kpi-l">aguardando aprovação</div></div>
        <div className="kpi"><div className="kpi-n">{comAlerta.length}</div><div className="kpi-l">⚠ com alerta</div></div>
        <div className="kpi"><div className="kpi-n">{parados.length}</div><div className="kpi-l">⏸ parados há {diasParado}+ dias</div></div>
        <button type="button" className="kpi kpi-botao" onClick={()=>onFiltrarCarteira("__semVersao")} title="Ver na lista">
          <div className="kpi-n">{semVersaoAno.length}</div><div className="kpi-l">cronogramas sem versão {ano}</div>
        </button>
      </div>

      <div className="painel-grid">
        <div className="card">
          <h3><span>Situação dos CNPJs da base</span>
            <button className="link-btn" onClick={()=>setVerTabelaSituacao(!verTabelaSituacao)}>{verTabelaSituacao ? "ver gráfico" : "ver tabela"}</button></h3>
          {!totalBase ? <div className="muted">A base de clientes está vazia.</div> : verTabelaSituacao ? (
            <table><tbody>{Object.keys(COR_SITUACAO).map(k => <tr key={k}><td>{ROTULO_SITUACAO[k]}</td><td style={{textAlign:"right"}}>{situacao.cont[k]}</td><td style={{textAlign:"right"}}>{pct(situacao.cont[k], totalBase)}%</td></tr>)}</tbody></table>
          ) : <>
            <div className="empilhada" role="img" aria-label={Object.keys(COR_SITUACAO).map(k => ROTULO_SITUACAO[k] + ": " + situacao.cont[k]).join(", ")}>
              {Object.keys(COR_SITUACAO).filter(k => situacao.cont[k] > 0).map(k => (
                <div key={k} className="empilhada-seg" style={{ flexGrow: situacao.cont[k], background: COR_SITUACAO[k] }} title={ROTULO_SITUACAO[k] + ": " + situacao.cont[k] + " (" + pct(situacao.cont[k], totalBase) + "%)"} />
              ))}
            </div>
            <div className="legenda">
              {Object.keys(COR_SITUACAO).map(k => (
                <span key={k} className="legenda-item"><span className="legenda-cor" style={{background: COR_SITUACAO[k]}} />{ROTULO_SITUACAO[k]} <strong>{situacao.cont[k]}</strong> <span className="muted">({pct(situacao.cont[k], totalBase)}%)</span></span>
              ))}
            </div>
          </>}
          {situacao.semPorGrupo.length > 0 && <>
            <div className="nav-secao" style={{color:"var(--muted)"}}>CNPJs sem cronograma, por grupo</div>
            <table><tbody>
              {situacao.semPorGrupo.slice(0, 6).map(([g, n]) => <tr key={g}><td>{g}</td><td style={{textAlign:"right", width:60}}>{n}</td></tr>)}
              {situacao.semPorGrupo.length > 6 && <tr><td className="muted" colSpan={2}>e mais {situacao.semPorGrupo.length - 6} grupo(s) — veja em <a href={linkTela("clientes")}>Base de clientes</a></td></tr>}
            </tbody></table>
          </>}
        </div>

        <div className="card">
          <h3>Cronogramas por etapa</h3>
          {funil.map(f => <BarraSerie key={f.id} valor={f.n} max={maxFunil} rotulo={f.label.replace(" — pronto para gerar tarefas", "")} detalhe={f.cnpjs + " CNPJ(s)"} onClick={()=>onFiltrarCarteira(f.id)} />)}
          <div className="nav-secao" style={{color:"var(--muted)"}}>Por Modelo</div>
          {porModelo.map(m => <BarraSerie key={m.id} valor={m.n} max={maxModelo} rotulo={m.nome} />)}
        </div>
      </div>

      <div className="card">
        <h3>
          <span>Por {agrupar === "analista" ? "analista" : agrupar}</span>
          <label className="muted chk" style={{fontWeight:400}}>Agrupar por
            <select value={agrupar} onChange={e=>setAgrupar(e.target.value)} aria-label="Agrupar por">
              <option value="analista">Analista do cronograma</option>
              <option value="coordenador">Coordenador (base de clientes)</option>
              <option value="gerente">Gerente (base de clientes)</option>
            </select>
          </label>
        </h3>
        <div className="table-wrap"><table className="tabela-lista">
          <thead><tr><th>{agrupar === "analista" ? "Analista" : agrupar === "coordenador" ? "Coordenador" : "Gerente"}</th><th style={{textAlign:"right"}}>Cronogramas</th><th style={{textAlign:"right"}}>CNPJs</th><th style={{width:"26%"}}>Aprovados</th><th style={{textAlign:"right"}}>Aguardando aprovação</th><th style={{textAlign:"right"}}>⚠ Com alerta</th><th style={{textAlign:"right"}}>⏸ Parados</th></tr></thead>
          <tbody>{porAnalista.map(a => (
            <tr key={a.analista}>
              <td>{a.analista === "__sem" ? <span className="muted">Não definido</span> : a.analista}</td>
              <td style={{textAlign:"right"}}>{a.n}</td>
              <td style={{textAlign:"right"}}>{a.cnpjs}</td>
              <td>
                <div className="progresso"><div className="serie-trilho" title={a.aprovados + " de " + a.n + " aprovados"}><div className="serie-barra" style={{width: pct(a.aprovados, a.n) + "%"}} /></div>
                  <span>{a.aprovados}/{a.n} <span className="muted">({pct(a.aprovados, a.n)}%)</span></span></div>
              </td>
              <td style={{textAlign:"right"}}>{a.emAprovacao}</td>
              <td style={{textAlign:"right"}}>{a.alerta ? <span className="alerta">{a.alerta}</span> : 0}</td>
              <td style={{textAlign:"right"}}>{a.parados}</td>
            </tr>
          ))}
          {!porAnalista.length && <tr><td colSpan={7} className="muted">Nenhum cronograma nesse filtro.</td></tr>}</tbody>
        </table></div>
      </div>

      <div className="painel-grid painel-grid-4">
        <ListaAtencao titulo={"⏸ Parados há " + diasParado + "+ dias"} itens={parados} vazio="Nenhum parado." detalhe={c => statusLabel(c.status).replace(" — pronto para gerar tarefas", "") + " · " + diasDesde(c.atualizadoEm) + " dias sem edição"} />
        <ListaAtencao titulo="Aguardando aprovação" itens={emAprovacao} vazio="Fila vazia." detalhe={c => (c.analista || "sem analista") + " · desde " + fmtHora(c.atualizadoEm)} />
        <ListaAtencao titulo="⚠ Com alerta" itens={comAlerta} vazio="Nenhum alerta." detalhe={c => c.alertas + " alerta(s)"} />
        <ListaAtencao titulo="Sem clientes vinculados" itens={semClientes} vazio="Todos têm clientes." detalhe={c => statusLabel(c.status).replace(" — pronto para gerar tarefas", "")} />
      </div>
    </div>
  );
}

/* ---------- Central de alertas do cronograma ---------- */
function CentralAlertas({ alertas, ano, onIr, onFechar }){
  return (
    <div className="card" style={{border:"1px solid var(--aviso-borda)", background:"var(--aviso-bg)"}}>
      <h3>
        <span>⚠ {alertas.length} alerta(s) em {ano}</span>
        <button className="btn btn-sm btn-ghost" onClick={onFechar}>Fechar</button>
      </h3>
      {!alertas.length ? <div className="muted">Nenhum alerta. 👍</div> : (
        <div className="table-wrap" style={{maxHeight:320, overflow:"auto"}}><table>
          <tbody>{alertas.map((a, i) => (
            <tr key={i}>
              <td style={{whiteSpace:"normal", width:"28%"}}><strong>{a.evento}</strong><div className="muted">{a.processo}</div></td>
              <td style={{whiteSpace:"normal"}}>{a.mensagem}</td>
              <td className="muted" style={{whiteSpace:"normal", width:150}}>{a.meses.length === 12 ? "todas as competências" : a.meses.map(m => MESES[m-1]).join(", ")}</td>
              <td style={{width:70}}><button className="btn btn-sm btn-outline" onClick={()=>onIr(a)}>Ir →</button></td>
            </tr>
          ))}</tbody>
        </table></div>
      )}
    </div>
  );
}

/* ---------- Status compacto ---------- */
function BarraStatus({ cronograma, podeMudar, podeAprovar, onPedir, onHistorico }){
  const i = statusIndex(cronograma.status);
  const proximo = STATUS_FLOW[i + 1];
  const proximoBloqueado = proximo && proximo.id === "aprovado" && !podeAprovar;
  return (
    <div className="barra-status">
      <span className="muted">Status:</span>
      <span className={"status-pill status-" + cronograma.status}>{statusLabel(cronograma.status)}</span>
      <span className="status-trilha" aria-hidden="true">{STATUS_FLOW.map((s, j) => <span key={s.id} className={"trilha-ponto" + (j <= i ? " on" : "")} title={s.label} />)}</span>
      {podeMudar && proximo && (
        <button className="btn btn-sm btn-primary" disabled={proximoBloqueado} title={proximoBloqueado ? "Só o perfil Coordenador aprova" : undefined} onClick={()=>onPedir(proximo.id)}>
          Avançar para: {proximo.label.replace(" — pronto para gerar tarefas", "")} →
        </button>
      )}
      {podeMudar && (
        <select value="" onChange={e=>{ if(e.target.value) onPedir(e.target.value); }} aria-label="Mudar status para">
          <option value="">Mudar para…</option>
          {STATUS_FLOW.filter(s => s.id !== cronograma.status).map(s => <option key={s.id} value={s.id} disabled={s.id === "aprovado" && !podeAprovar}>{s.label}</option>)}
        </select>
      )}
      <button className="link-btn" onClick={onHistorico}>ver histórico</button>
    </div>
  );
}

/* ---------- Seções personalizadas (processos fora dos padrões) ----------
   Biblioteca de seções que Diretor/Gerente/Coordenador criam sozinhos (ex.:
   Pró-labore, Folha de estagiários). Uma seção é um processo como os outros
   (tarefas, responsáveis, frequência, prazos). Adicionada a um cronograma,
   vira uma CÓPIA daquele cronograma/ano — ajustar lá não mexe na biblioteca. */
const BLOCOS_REFERENCIA_SECOES = seedProcessos("caixa");
function novaSecaoEmBranco(nome){
  return { id: novoId("sec"), nome: nome || "Nova seção", ativo: true, ativa: true, categoria: "", frequencia: { tipo:"mensal" },
    eventos: [{ id: novoId("ev"), nome: "Nova tarefa", responsavel: "SINERGY", ativo: true, bloqueada: false, excecoes: {},
      regra: { tipo:"dia_fixo", dia:10, ajuste:"prev", mesOffset:0 } }] };
}
function SeletorCategoria({ valor, onMudar, disabled }){
  return (
    <label className="muted chk" title="Cor da seção no calendário">Cor:
      <select value={valor || ""} disabled={disabled} onChange={e=>onMudar(e.target.value)} aria-label="Categoria (cor no calendário)">
        <option value="">Própria (automática)</option>
        {Object.entries(CATEGORIAS).map(([id, c]) => <option key={id} value={id}>{c.label}</option>)}
      </select>
    </label>
  );
}

// Biblioteca com SALVAMENTO AUTOMÁTICO: criar, excluir, inativar e editar gravam sozinhos
// (edições de texto esperam ~1s de pausa pra gravar). Nada de botão "Salvar seções".
function SecoesTela({ secoes, ano, podeEditar, uso, onSalvar }){
  const [lista, setLista] = useState(() => clonar(secoes));
  const [mes, setMes] = useState(1);
  const [busca, setBusca] = useState("");
  const [verInativas, setVerInativas] = useState(true);
  const [abertas, setAbertas] = useState(() => new Set());
  const [estado, setEstado] = useState("salvo"); // salvo | pendente | salvando | erro
  const timer = useRef(null);
  const ultimaGravada = useRef(JSON.stringify(secoes));

  // Grava agora (ações pontuais) ou com espera (digitação).
  function gravar(nova, imediato){
    setLista(nova);
    clearTimeout(timer.current);
    const exec = async () => {
      const txt = JSON.stringify(nova);
      if(txt === ultimaGravada.current){ setEstado("salvo"); return; }
      setEstado("salvando");
      const ok = await onSalvar(nova);
      if(ok){ ultimaGravada.current = txt; setEstado("salvo"); } else setEstado("erro");
    };
    if(imediato) exec(); else { setEstado("pendente"); timer.current = setTimeout(exec, 900); }
  }
  useEffect(() => () => clearTimeout(timer.current), []);
  useEffect(() => {
    if(estado !== "pendente" && estado !== "salvando") return;
    const h = e => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [estado]);

  const alternar = id => setAbertas(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const atualizar = (id, novo, imediato) => gravar(lista.map(s => s.id === id ? novo : s), imediato);
  async function nova(){
    const nome = await ui.prompt("Nome da nova seção (ex.: Pró-labore, Folha de estagiários, Benefício avulso):", "", { titulo:"Nova seção", okLabel:"Criar" });
    if(!nome || !nome.trim()) return;
    const s = novaSecaoEmBranco(nome.trim());
    gravar([...lista, s], true);
    setAbertas(prev => new Set([...prev, s.id]));
  }
  function duplicar(s){
    const c = { ...clonar(s), id: novoId("sec"), nome: s.nome + " (cópia)", ativa: true };
    gravar([...lista, c], true);
    setAbertas(prev => new Set([...prev, c.id]));
  }
  async function remover(s){
    const n = uso[s.id] || 0;
    if(n > 0){
      const inativar = await ui.confirm('"' + s.nome + '" está em uso em ' + n + ' cronograma(s) — por isso não pode ser excluída.\n\nQuer INATIVAR? Ela some das opções de "+ Adicionar seção", e os cronogramas que já usam continuam iguais.', { titulo:"Seção em uso", okLabel:"Inativar" });
      if(inativar) atualizar(s.id, { ...s, ativa: false }, true);
      return;
    }
    if(!(await ui.confirm('Excluir a seção "' + s.nome + '" da biblioteca? Ela não está em uso em nenhum cronograma.', { okLabel:"Excluir", perigo:true }))) return;
    gravar(lista.filter(x => x.id !== s.id), true);
  }
  const termo = normalizar(busca);
  const visiveis = lista.filter(s => (verInativas || s.ativa !== false) && (!termo || normalizar(s.nome).includes(termo) || s.eventos.some(e => normalizar(e.nome).includes(termo))));
  const nInativas = lista.filter(s => s.ativa === false).length;
  const rotuloEstado = { salvo:"✓ Salvo", pendente:"● Salvando em instantes…", salvando:"Salvando…", erro:"⚠ Não consegui salvar — tente de novo" }[estado];

  return (
    <div style={{paddingTop:20}}>
      <div className="topbar">
        <div>
          <h2>🧩 Seções personalizadas</h2>

              aberto={abertas.has(s.id)} onAlternar={()=>alternar(s.id)}
              onUpdate={novo => atualizar(s.id, novo, false)} onDesdobrar={()=>{}}
              acoesExtras={<>
                <span className="badge badge-months" title="Cronogramas (qualquer ano) que têm uma cópia desta seção">{n ? "em uso em " + n + " cronograma(s)" : "sem uso"}</span>
                {podeEditar ? <>
                  <label className="muted chk" title="Inativa = não aparece em “+ Adicionar seção”; quem já usa continua igual">
                    <input type="checkbox" checked={s.ativa !== false} onChange={e=>atualizar(s.id, { ...s, ativa: e.target.checked }, true)} /> ativa p/ novos usos
                  </label>
                  <SeletorCategoria valor={s.categoria} onMudar={v => atualizar(s.id, { ...s, categoria: v }, true)} />
                  <button className="btn btn-sm btn-outline" onClick={()=>duplicar(s)}>Duplicar</button>
                  <button className="btn btn-sm btn-ghost" onClick={()=>remover(s)}>{n ? "Inativar…" : "Excluir"}</button>
                </> : s.ativa === false && <span className="badge badge-off">inativa</span>}
              </>} />
          </div>
        );
      })}
    </div>
  );
}

// Janela "+ Adicionar seção" do cronograma: da biblioteca (cópia) ou em branco.
function AdicionarSecaoModal({ secoes: todasSecoes, processosAtuais, ano, onAdicionar, onFechar }){
  const secoes = todasSecoes.filter(s => s.ativa !== false); // inativas não aparecem para novos usos
  const [escolha, setEscolha] = useState(secoes[0] ? secoes[0].id : "__branco");
  const [nome, setNome] = useState(secoes[0] ? secoes[0].nome : "");
  const base = secoes.find(s => s.id === escolha) || null;
  const jaUsadas = new Set(processosAtuais.map(p => p.origemSecaoId).filter(Boolean));
  function escolher(id){ setEscolha(id); const b = secoes.find(s => s.id === id); setNome(b ? b.nome : ""); }
  function confirmar(){
    if(!nome.trim()){ ui.alert("Dê um nome para a seção."); return; }
    const { ativa: _ativa, ...semFlag } = base || {};
    const proc = base
      ? { ...clonar(semFlag), id: novoId("sec"), origemSecaoId: base.id, nome: nome.trim(), ativo: true }
      : novaSecaoEmBranco(nome.trim());
    onAdicionar(proc);
  }
  return (
    <div className="modal-overlay" onMouseDown={fecharAoClicarFora(false, onFechar)}>
      <div className="modal-box" style={{width:620}}>
        <h3>Adicionar seção ao cronograma ({ano})</h3>
        <p className="muted" style={{marginTop:0}}>A seção entra como cópia só deste cronograma/ano. Para criar ou mudar seções da biblioteca, use o menu 🧩 Seções.</p>
        <div className="pick-list" style={{maxHeight:300}}>
          <table><tbody>
            {secoes.map(s => (
              <tr key={s.id} className="linha-clicavel" onClick={()=>escolher(s.id)}>
                <td style={{width:30}}><input type="radio" name="secao" checked={escolha === s.id} onChange={()=>escolher(s.id)} aria-label={s.nome} /></td>
                <td style={{whiteSpace:"normal"}}>
                  <span className="cat-dot" style={{background: infoCategoria(s.categoria || ("proc:" + s.id), s.nome).cor}} /><strong>{s.nome}</strong>
                  {jaUsadas.has(s.id) && <span className="badge badge-months" style={{marginLeft:6}}>já está neste cronograma</span>}
                  <div className="muted">{s.eventos.length} tarefa(s) · {s.frequencia.tipo === "mensal" ? "todo mês" : "meses: " + (s.frequencia.meses || []).map(m => MESES[m-1]).join(", ")}</div>
                </td>
              </tr>
            ))}
            <tr className="linha-clicavel" onClick={()=>escolher("__branco")}>
              <td><input type="radio" name="secao" checked={escolha === "__branco"} onChange={()=>escolher("__branco")} aria-label="Seção em branco" /></td>
              <td><strong>Seção em branco</strong><div className="muted">Começa com uma tarefa; você monta o resto no cronograma.</div></td>
            </tr>
          </tbody></table>
        </div>
        <div className="wizard-q" style={{marginTop:12}}><label>Nome da seção neste cronograma</label>
          <input type="text" style={{width:"100%"}} value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: Pró-labore" /></div>
        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onFechar}>Cancelar</button>
          <button className="btn btn-primary" onClick={confirmar}>Adicionar seção</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Grupos de acesso ----------
   Quem tem "Gerenciar grupos de acesso" define o que cada grupo pode fazer (e cria grupos novos).
   Os 4 grupos base são os do site autenticado; o Administrador/Diretor nunca perde o acesso a esta
   tela (evita ninguém conseguir mais entrar). Salvamento automático a cada mudança. */
const PERMISSOES = [
  ["edita",   "Editar cronogramas",                "Mexer em tarefas, prazos, clientes vinculados e status até “Aguardando aprovação”."],
  ["aprova",  "Aprovar cronogramas",               "Marcar como Aprovado (trava a edição) e usar a fila de Aprovações."],
  ["clientes","Editar a base de clientes",         "Importar planilha, adicionar, editar e remover CNPJs e responsáveis."],
  ["secoes",  "Seções personalizadas",             "Criar/editar a biblioteca de seções e adicionar seções nos cronogramas."],
  ["modelos", "Administrar Modelos (empresa)",     "Mudar os Modelos de toda a empresa (quem não é Administrador edita só os da própria gerência)."],
  ["modelos_gerencia","Modelos da própria gerência", "Criar e editar Modelos só da sua gerência (ex.: coordenadora cria para o gerente dela)."],
  ["encerra", "Encerrar/reabrir ano e ano vigente","Encerrar o ano, reabrir (com motivo) e trocar o ano vigente."],
  ["restaura","Restaurar versões",                 "Voltar um cronograma (ou um Modelo, junto com Administrar Modelos) para uma versão anterior."],
  ["lixeira", "Lixeira de cronogramas",            "Ver a lixeira, restaurar e excluir definitivamente (o que passa de 15 dias é apagado sozinho)."],
  ["acessos", "Gerenciar grupos de acesso",        "Abrir esta tela e mudar as permissões de todos os grupos."],
];
const GRUPOS_BASE = ["admin", "gerente", "coordenador", "analista"];

// Garante os 4 grupos base e que o Administrador/Diretor sempre gerencie acessos.
function normalizarGrupos(g){
  const out = { ...g };
  GRUPOS_BASE.forEach(id => { out[id] = { ...PERFIS_PADRAO[id], ...(out[id] || {}) }; });
  out.admin = { ...out.admin, acessos: true };
  return out;
}
function GruposTela({ grupos, onSalvar }){
  const [estado, setEstado] = useState("salvo");
  const ordem = [...GRUPOS_BASE.filter(id => grupos[id]), ...Object.keys(grupos).filter(id => !GRUPOS_BASE.includes(id))];
  async function gravar(novos){
    setEstado("salvando");
    setEstado((await onSalvar(novos)) ? "salvo" : "erro");
  }
  function alternar(id, perm, valor){
    if(id === "admin" && perm === "acessos") return; // travado
    gravar({ ...grupos, [id]: { ...grupos[id], [perm]: valor } });
  }
  async function novoGrupo(){
    const nome = await ui.prompt("Nome do novo grupo (ex.: Supervisor, Auditoria):", "", { titulo:"Novo grupo de acesso", okLabel:"Criar" });
    if(!nome || !nome.trim()) return;
    const id = "g_" + normalizar(nome).replace(/[^a-z0-9]+/g, "_").slice(0, 24) + "_" + Math.random().toString(36).slice(2, 6);
    gravar({ ...grupos, [id]: { label: nome.trim(), ...Object.fromEntries(PERMISSOES.map(([p]) => [p, p === "edita"])) } });
  }
  async function renomear(id){
    const nome = await ui.prompt("Novo nome do grupo:", grupos[id].label, { titulo:"Renomear grupo", okLabel:"Salvar" });
    if(!nome || !nome.trim()) return;
    gravar({ ...grupos, [id]: { ...grupos[id], label: nome.trim() } });
  }
  async function excluir(id){
    if(!(await ui.confirm('Excluir o grupo "' + grupos[id].label + '"? Quem estiver nele passa a ter as permissões de Analista.', { okLabel:"Excluir", perigo:true }))) return;
    const n = { ...grupos }; delete n[id]; gravar(n);
  }
  return (
    <div style={{paddingTop:20}}>
      <div className="topbar">
        <div>
          <h2>🔐 Grupos de acesso</h2>
          <div className="sub">Defina o que cada grupo pode fazer. As mudanças valem na hora e são salvas automaticamente. Enquanto o login do site não estiver integrado, cada pessoa escolhe o próprio grupo no menu (campo “Você”).</div>
        </div>
        <div className="toolbar" style={{alignItems:"center"}}>
          <span className={estado === "salvo" ? "muted" : estado === "erro" ? "alerta" : "dirty"}>{estado === "salvo" ? "✓ Salvo" : estado === "erro" ? "⚠ Não consegui salvar" : "Salvando…"}</span>
          <button className="btn btn-primary" onClick={novoGrupo}>+ Novo grupo</button>
        </div>
      </div>
      <div className="card">
        <div className="table-wrap"><table className="tabela-lista tabela-grupos">
          <thead><tr>
            <th>Grupo</th>
            {PERMISSOES.map(([p, rotulo, ajuda]) => <th key={p} title={ajuda} style={{textAlign:"center", whiteSpace:"normal", minWidth:96}}>{rotulo}</th>)}
            <th></th>
          </tr></thead>
          <tbody>
            {ordem.map(id => (
              <tr key={id}>
                <td><strong>{grupos[id].label}</strong>{GRUPOS_BASE.includes(id) && <span className="muted"> · base</span>}</td>
                {PERMISSOES.map(([p, rotulo]) => {
                  const travado = id === "admin" && p === "acessos";
                  return (
                    <td key={p} style={{textAlign:"center"}}>
                      <input type="checkbox" checked={!!grupos[id][p]} disabled={travado} title={travado ? "O Administrador/Diretor sempre gerencia os acessos" : rotulo}
                        onChange={e=>alternar(id, p, e.target.checked)} aria-label={grupos[id].label + ": " + rotulo} />
                    </td>
                  );
                })}
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="link-btn" onClick={()=>renomear(id)}>renomear</button>
                  {!GRUPOS_BASE.includes(id) && <> · <button className="link-btn perigo" onClick={()=>excluir(id)}>excluir</button></>}
                </td>
              </tr>
            ))}
          </tbody>
        </table></div>
        <p className="muted" style={{marginBottom:0}}>Passe o mouse no nome de cada permissão para ver o que ela libera.</p>
      </div>
    </div>
  );
}

function App({ sessao, gruposPainel, usuariosPainel, onSair } = {}){

  // O ano de trabalho vem da ROTA (#/2027/...) — é o ano que você está vendo e editando.

  ANO_DA_ROTA = ano;

  const [tema, setTema] = useState(() => temaSalvo(sessao && sessao.id));
  // Usuários/grupos do painel (gerências). Integrado: vêm do login; modo teste: lidos aqui (usuários falsos, se houver).
  const [pessoasLocais, setPessoasLocais] = useState(null);
  useEffect(() => {
    if(usuariosPainel) return;
    carregarUsuariosDoPainel().then(r => setPessoasLocais({ usuarios: (r.usuarios || []).filter(u => u && u.active !== false), grupos: r.grupos || [] })).catch(() => {});
  }, []);
  const pessoasPainel = usuariosPainel || (pessoasLocais && pessoasLocais.usuarios) || [];
  const gruposPainelEf = gruposPainel || (pessoasLocais && pessoasLocais.grupos) || [];
  const gerentes = useMemo(() => gerentesDoPainel(pessoasPainel, gruposPainelEf), [pessoasPainel, gruposPainelEf]);
  const usaGerencia = gerentes.length > 0;
  const meuUsuarioPainel = sessao ? (pessoasPainel.find(u => u.id === sessao.id) || { id: sessao.id, groupId: sessao.groupId }) : null;
  const escopo = usaGerencia && sessao ? escopoDoUsuario(meuUsuarioPainel, gruposPainelEf) : "all"; // "all" ou id do gerente
  const nomeGerente = id => (gerentes.find(g => g.id === id) || {}).nome || "";
  useEffect(() => { aplicarTema(tema); }, [tema]);
  function alternarTema(){ const t = tema === "claro" ? "escuro" : "claro"; setTema(t); salvarTema(t, sessao && sessao.id); }
  // Com login integrado, nome e grupo vêm do usuário do painel; sem ele (modo teste), do campo "Você".
  const usuario = sessao ? { nome: sessao.name, perfil: perfilDoGrupoPainel(sessao.groupId) } : usuarioLocal;
  const [recolhida, setRecolhida] = useState(() => lerLocal("cronograma_sidebar_recolhida", false));

  const [abertos, setAbertos] = useState({}); // cronogramaId -> [processoIds abertos]

  const [verAlertas, setVerAlertas] = useState(false);

  const [carteiraStatus, setCarteiraStatus] = useState(""); // filtro de status aplicado a partir do Painel
  const [anosEstado, setAnosEstado] = useState({}); // { "2026": { encerrado, por, em, historico } }
  const [anoVigenteCfg, setAnoVigenteCfg] = useState(null); // ano vigente salvo (Gerente/Administrador)
  const [secoes, setSecoes] = useState([]); // biblioteca de seções personalizadas
  const [secoesAtualizadoEm, setSecoesAtualizadoEm] = useState(null);
  const [modalSecao, setModalSecao] = useState(false);
  ANO_VIGENTE = anoVigenteCfg;
  const inputBackup = useRef(null);
  const toastTimer = useRef(null);
  const cacheRef = useRef({}); cacheRef.current = clientesCache;
  const baseRef = useRef([]); baseRef.current = baseClientes;
  const resumoRef = useRef([]); resumoRef.current = clientesResumo;

  const [gruposCfg, setGruposCfg] = useState(null); // grupos de acesso salvos
  const [renomesPendentes, setRenomesPendentes] = useState(null); // nomes corrigidos nos Modelos padrão (migração) a levar aos cronogramas
  PERFIS = gruposCfg || PERFIS_PADRAO;
  if(gruposPainel && gruposPainel.length){ // grupos criados no painel aparecem aqui com permissão de Analista até alguém ajustar
    const extras = {};
    gruposPainel.forEach(g => { const id = perfilDoGrupoPainel(g && g.id); if(id && !PERFIS[id]) extras[id] = { ...PERFIS_PADRAO.analista, label: (g && g.name) || id }; });
    if(Object.keys(extras).length) PERFIS = { ...PERFIS, ...extras };
  }
  const perfil = PERFIS[usuario.perfil] ? usuario.perfil : (PERFIS.analista ? "analista" : Object.keys(PERFIS)[0]); // desconhecido = o mais restrito
  const podeEditar = !consulta && PERFIS[perfil].edita;
  const podeAprovar = !consulta && PERFIS[perfil].aprova;
  const podeEncerrar = !consulta && PERFIS[perfil].encerra; // encerrar/reabrir ano: Gerente e Administrador/Diretor
  const podeModelos = !consulta && PERFIS[perfil].modelos;  // administrar Modelos: Gerente e Administrador/Diretor
  const podeModelosGerencia = !consulta && PERFIS[perfil].modelos_gerencia;
  const podeLixeira = !consulta && PERFIS[perfil].lixeira; // lixeira: Gerente e Administrador/Diretor // Modelos só da própria gerência
  const podeModelosTela = podeModelos || podeModelosGerencia;
  // Modelo da empresa (sem gerenteId): só quem administra Modelos e vê tudo. Modelo de gerência: Administrador,
  // ou quem é daquela gerência e tem uma das duas permissões.
  function podeEditarModelo(m){
    if(!usaGerencia) return !!podeModelos;
    if(m && m.gerenteId) return escopo === "all" ? !!podeModelos : (m.gerenteId === escopo && !!podeModelosTela);
    return !!podeModelos && escopo === "all";
  }
  const podeSecoes = !consulta && PERFIS[perfil].secoes;    // seções personalizadas: Diretor, Gerente e Coordenador
  const podeClientes = !consulta && PERFIS[perfil].clientes; // editar a base de clientes
  const podeAcessos = !consulta && PERFIS[perfil].acessos;   // gerenciar grupos de acesso
  const podeRestaurar = !consulta && PERFIS[perfil].restaura; // restaurar versões: Coordenador para cima

  function navegar(h){

  }
  // Troca o ano mantendo a tela (e o cronograma/aba) em que você está.
  function setAno(y){

    navegar(rota.tela === "cronograma" ? linkCronograma(rota.id, rota.aba, y) : linkTela(rota.tela, y));
  }

  async function restaurarBackup(e){
    const arq = e.target.files && e.target.files[0]; e.target.value = "";
    if(!arq) return;
    if(!(await ui.confirm("Importar este backup SUBSTITUI todos os dados de teste deste navegador. Continuar?", { okLabel:"Importar", perigo:true }))) return;
    try { await importarBackupLocal(arq); window.location.reload(); }
    catch(err){ ui.alert("Não consegui importar: " + err.message); }
  }
  const inputBackupBanco = useRef(null);
  async function exportarBackupBanco(){
    try { baixarJsonBackup(await lerTudoDoBanco(), "cronograma_backup_banco_"); showToast("Backup do banco baixado."); }
    catch(e){ ui.alert("Não consegui gerar o backup: " + e.message); }
  }
  async function importarBackupParaBanco(e){
    const arq = e.target.files && e.target.files[0]; e.target.value = "";
    if(!arq) return;
    if(!(podeAcessos || podeEncerrar)){ ui.alert("Seu grupo de acesso não importa backups (só Administrador/Diretor e Gerente)."); return; }
    let j; try { j = JSON.parse(await arq.text()); } catch(err){ ui.alert("O arquivo não é um JSON válido."); return; }
    if(!j || j.tipo !== "cronograma_backup" || !j.dados){ ui.alert("Esse arquivo não é um backup do cronograma."); return; }
    const chaves = Object.keys(j.dados).filter(k => k.startsWith("sinergy_cronograma_") && !k.includes("_presenca_"));

    setSalvando(true);
    try {
      const noServidor = await kvLoad(kvKeyCliente(cliente.id)).catch(()=>null);
      const conhecido = conhecidoServidor[cliente.id];
      if(noServidor && conhecido && noServidor.atualizadoEm && noServidor.atualizadoEm !== conhecido){
        const ok = await ui.confirm('"' + cliente.nome + '" foi salvo em outra sessão às ' + fmtHora(noServidor.atualizadoEm) + ", depois da última vez que você carregou.\n\nSalvar agora vai SOBRESCREVER essas mudanças.",
          { titulo:"Conflito de edição", okLabel:"Sobrescrever", perigo:true });
        if(!ok) return false;
      }
      const agora = new Date().toISOString();
      const anoV = cliente.ano || ano;
      const antesReg = snapshots[cliente.id] ? migrarParaVersoes(JSON.parse(snapshots[cliente.id]), anoTrabalhoPadrao()) : null;
      const antes = antesReg ? visaoDoAno(antesReg, anoV) : null;
      const mudancas = antes ? diffClientes(antes, cliente, nomeClienteBase) : [];
      const quem = usuario.nome || null;
      const visaoFinal = { ...cliente, acoes: [...(cliente.acoes||[]), ...mudancas.map(descricao => ({ tipo:"edicao", descricao, em: agora, quem }))] };
      // Gerência que veio dos clientes (cronogramas antigos) fica gravada no cronograma ao salvar.
      if(usaGerencia && !visaoFinal.gerenteId){ const g = gerenciaDoCronograma(null, visaoFinal.clientesIds, basePorId); if(g) visaoFinal.gerenteId = g; }
      const reg0 = cacheRef.current[cliente.id] || migrarParaVersoes(cliente, anoV);
      const paraSalvar = gravarVisao(reg0, anoV, visaoFinal);
      paraSalvar.atualizadoEm = agora;
      paraSalvar.versoes[anoV] = { ...paraSalvar.versoes[anoV], atualizadoEm: agora };
      await kvSave(kvKeyCliente(cliente.id), paraSalvar);
      cacheRef.current = { ...cacheRef.current, [cliente.id]: paraSalvar };
      setClientesCache(prev => ({ ...prev, [cliente.id]: paraSalvar }));
      marcarSalvo(paraSalvar);
      // Versão automática ao ENVIAR ao cliente e ao APROVAR (conteúdo igual = mesmo número, só mais um marco).
      const tipoFoto = antes && antes.status !== visaoFinal.status ? ({ aguardando_cliente:"envio", aprovado:"aprovacao" })[visaoFinal.status] : null;
      if(tipoFoto) await registrarFoto(cliente.id, anoV, visaoFinal, tipoFoto).catch(e => console.warn("Não consegui gravar a versão:", e.message));
      await atualizarIndice(lista => upsertResumo(lista, resumoDe(paraSalvar))).catch(()=>{});
      if(!silencioso) showToast('"' + paraSalvar.nome + '" salvo' + (mudancas.length ? " (" + mudancas.length + " alteração(ões) no histórico)." : "."));
      return true;
    } catch(e){ showToast("Erro ao salvar: " + e.message); return false; }
    finally { setSalvando(false); }
  }

  // Cria o cronograma com a versão do ano escolhido (anoAlvo) e abre nele.
  async function registrarNovoCliente(c, anoAlvo){
    const anoV = Number(anoAlvo || ano);
    if(anoEncerrado(anoV, anosEstado)){ ui.alert(anoV + " está encerrado — crie o cronograma num ano aberto."); return; }
    const { versoes: _v, ano: _a, ...plano } = c; // cópia de uma visão não leva as outras versões
    const agora = new Date().toISOString();
    // Analista do cronograma: o que veio preenchido, senão o da base de clientes (o mais frequente entre os CNPJs), senão quem criou.
    const paraSalvar = migrarParaVersoes({ ...plano, analista: c.analista || responsavelDosClientes(c.clientesIds, basePorId, "analista") || usuario.nome || "", atualizadoEm: agora }, anoV);
    cacheRef.current = { ...cacheRef.current, [c.id]: paraSalvar };
    setClientesCache(prev => ({ ...prev, [c.id]: paraSalvar }));
    setClientesResumo(prev => upsertResumo(prev, resumoDe(paraSalvar)));
    setModalNovo(null);
    if(anoV !== ano) gravarLocal("cronograma_ano", anoV);
    navegar(linkCronograma(c.id, "parametrizar", anoV));
    try {
      await kvSave(kvKeyCliente(c.id), paraSalvar);
      marcarSalvo(paraSalvar);
      await atualizarIndice(lista => upsertResumo(lista, resumoDe(paraSalvar)));
    } catch(e){ showToast("Cronograma criado localmente; falhou salvar: " + e.message); }
  }
  function novoClienteBase(dados, modelo, extra){
    return {
      id: novoId("cli"), nome: dados.nome,
      clientesIds: dados.clientesIds || [],
      gerenteId: dados.gerenteId || null,
      modeloBase: modelo ? modelo.nome : "Sem modelo", modeloId: modelo ? modelo.id : null,
      status: "em_desenvolvimento",
      historico: [{ status:"em_desenvolvimento", em: new Date().toISOString(), por: usuario.nome || "sistema" }],
      ...extra,
    };
  }
  function criarCliente(dados){
    const modelo = modelos.find(m=>m.id===dados.modeloId) || modelos[0];
    registrarNovoCliente(novoClienteBase(dados, modelo, {
      processos: modelo ? anexarPadrao(processosDoModelo(modelo), modelo) : seedProcessos(),
      acoes: [{ tipo:"criacao", descricao:'Cronograma criado a partir do modelo "' + (modelo?modelo.nome:"—") + '".', em: new Date().toISOString(), quem: usuario.nome || null }],
    }), dados.ano);
  }
  function criarClienteViaAssistente(processos){
    const dados = dadosCadastroPendente;
    const modelo = modelos.find(m=>m.id===dados.modeloId) || modelos[0];
    registrarNovoCliente(novoClienteBase(dados, modelo, {
      modeloBase: (modelo ? modelo.nome : "Padrão") + " (via assistente)",
      processos: modelo ? anexarPadrao(processos, modelo) : processos,
      acoes: [{ tipo:"criacao", descricao:'Cronograma criado via assistente de datas-chave, a partir do modelo "' + (modelo?modelo.nome:"—") + '".', em: new Date().toISOString(), quem: usuario.nome || null }],
    }), dados.ano);
  }
  function duplicarCliente(){
    if(!clienteAtual) return;
    const agora = new Date().toISOString();
    registrarNovoCliente({
      ...clonar(clienteAtual), id: novoId("cli"), nome: clienteAtual.nome + " (cópia)", arquivado: false,
      clientesIds: [],
      status: "em_desenvolvimento",
      historico: [{ status:"em_desenvolvimento", em: agora, por: usuario.nome || "sistema" }],
      acoes: [{ tipo:"criacao", descricao:'Cronograma criado como cópia de "' + clienteAtual.nome + '".', em: agora, quem: usuario.nome || null }],
    });
    showToast("Cópia criada (sem clientes vinculados).");
  }
  async function alternarArquivado(){
    if(!clienteAtual) return;
    const arquivar = !clienteAtual.arquivado;
    if(arquivar && !(await ui.confirm('Arquivar "' + clienteAtual.nome + '"? Ele sai da lista (dá pra ver marcando "Arquivados") e pode ser desarquivado a qualquer momento.', { okLabel:"Arquivar" }))) return;
    const novo = { ...clienteAtual, arquivado: arquivar };
    gravarNoCache(novo);
    await salvarCliente(novo);
  }
  // Excluir = mandar para a LIXEIRA (15 dias). Os CNPJs ficam livres para outro cronograma nesse meio-tempo.
  async function excluirCliente(){
    if(!clienteAtual) return;
    const alvo = clienteAtual;
    const ok = await ui.confirm('Mandar o cronograma "' + alvo.nome + '" (todos os anos) para a LIXEIRA?\n\n• Fica lá por ' + LIXEIRA_DIAS + " dias; depois é apagado de vez, sozinho.\n• Gerente ou Administrador/Diretor podem restaurar nesse prazo.\n• Os clientes continuam na base e ficam livres para outro cronograma." +
      (sujos.has(alvo.id) ? "\n• As alterações ainda não salvas serão descartadas." : "") + "\n\nSe só quiser tirar da lista, use Arquivar.", { titulo:"Excluir cronograma", okLabel:"Mandar para a lixeira", perigo:true });
    if(!ok) return;
    try {
      const reg0 = await kvLoad(kvKeyCliente(alvo.id));
      if(!reg0){ ui.alert("Não encontrei o cronograma salvo."); return; }
      const agora = new Date().toISOString(), quem = usuario.nome || perfil;
      const paraSalvar = { ...migrarParaVersoes(reg0, anoTrabalhoPadrao()), excluido: { em: agora, por: quem }, atualizadoEm: agora };
      await kvSave(kvKeyCliente(alvo.id), paraSalvar);
      await atualizarIndice(lista => upsertResumo(lista, resumoDe(paraSalvar)));
      kvDelete(kvKeyPresenca(alvo.id)).catch(()=>{});
      cacheRef.current = { ...cacheRef.current, [alvo.id]: paraSalvar };
      setClientesCache(prev => ({ ...prev, [alvo.id]: paraSalvar }));
      marcarSalvo(paraSalvar);
      navegar(linkTela("inicio"));
      showToast('"' + alvo.nome + '" foi para a lixeira (' + LIXEIRA_DIAS + " dias para restaurar).");
    } catch(e){ showToast("Erro ao excluir: " + e.message); }
  }
  async function restaurarDaLixeira(id){
    if(!podeLixeira){ ui.alert("Seu grupo de acesso não restaura da lixeira."); return; }
    try {
      const reg0 = await kvLoad(kvKeyCliente(id));
      if(!reg0 || !reg0.excluido){ ui.alert("Esse cronograma não está mais na lixeira."); return; }
      let reg = migrarParaVersoes(reg0, anoTrabalhoPadrao());
      // CNPJs que, enquanto estava na lixeira, foram para outro cronograma no mesmo ano: saem deste.
      const conflitos = [];
      const versoes = { ...reg.versoes };
      Object.keys(versoes).forEach(a => {
        const ocupados = new Set(clientesResumo.filter(r => r.id !== id && !r.excluido).flatMap(r => linhaDoAno(r, Number(a)).clientesIds || []));
        const ids = (versoes[a].clientesIds || []);
        const tirar = ids.filter(c => ocupados.has(c));
        if(tirar.length){ conflitos.push(a + ": " + tirar.map(nomeClienteBase).join(", ")); versoes[a] = { ...versoes[a], clientesIds: ids.filter(c => !ocupados.has(c)) }; }
      });
      if(!(await ui.confirm('Restaurar "' + reg.nome + '" da lixeira?' + (conflitos.length ? "\n\nEstes clientes foram para outro cronograma enquanto este estava na lixeira e vão ficar desvinculados daqui:\n• " + conflitos.join("\n• ") : ""), { titulo:"Restaurar da lixeira", okLabel:"Restaurar" }))) return;
      const agora = new Date().toISOString(), quem = usuario.nome || perfil;
      Object.keys(versoes).forEach(a => { versoes[a] = { ...versoes[a], acoes: [...(versoes[a].acoes || []), { tipo:"edicao", descricao: "Restaurado da lixeira (excluído em " + fmtHora(reg.excluido.em) + (reg.excluido.por ? " por " + reg.excluido.por : "") + ").", em: agora, quem }] }; });
      const { excluido, ...resto } = reg;
      const paraSalvar = { ...resto, versoes, atualizadoEm: agora };
      await kvSave(kvKeyCliente(id), paraSalvar);
      await atualizarIndice(lista => upsertResumo(lista, resumoDe(paraSalvar)));
      cacheRef.current = { ...cacheRef.current, [id]: paraSalvar };
      setClientesCache(prev => ({ ...prev, [id]: paraSalvar }));
      marcarSalvo(paraSalvar);
      showToast('"' + paraSalvar.nome + '" restaurado.');
    } catch(e){ showToast("Erro ao restaurar: " + e.message); }
  }
  async function apagarDeVez(id, silencioso){
    await kvDelete(kvKeyCliente(id)).catch(e => console.warn("Não consegui apagar a chave:", e.message));
    await kvDelete(kvKeyFotos(id)).catch(() => {});
    kvDelete(kvKeyPresenca(id)).catch(()=>{});
    setClientesCache(prev => { const n = { ...prev }; delete n[id]; return n; });
    setSnapshots(prev => { const n = { ...prev }; delete n[id]; return n; });
    if(!silencioso) showToast("Cronograma apagado definitivamente.");
  }
  async function excluirDefinitivo(ids){
    if(!podeLixeira){ ui.alert("Seu grupo de acesso não exclui definitivamente."); return; }
    const nomes = ids.map(id => (clientesResumo.find(r => r.id === id) || {}).nome || id);
    if(!(await ui.confirm("Excluir DEFINITIVAMENTE " + ids.length + " cronograma(s), inclusive histórico e versões? Não dá para desfazer.\n\n• " + nomes.slice(0, 10).join("\n• ") + (nomes.length > 10 ? "\n… e mais " + (nomes.length - 10) : ""), { titulo:"Excluir definitivamente", okLabel:"Excluir definitivamente", perigo:true }))) return;
    for(const id of ids) await apagarDeVez(id, true);
    await atualizarIndice(lista => lista.filter(c => !ids.includes(c.id))).catch(()=>{});
    showToast(ids.length + " cronograma(s) excluído(s) definitivamente.");
  }
  // Limpeza automática: o que está na lixeira há mais de 15 dias é apagado de vez (uma vez por abertura).
  const limpezaRef = useRef(false);
  useEffect(() => {
    if(carregando || consulta || limpezaRef.current) return;
    limpezaRef.current = true;
    const vencidos = clientesResumo.filter(r => r.excluido && diasRestantesLixeira(r.excluido) === 0).map(r => r.id);
    if(!vencidos.length) return;
    (async () => {
      for(const id of vencidos) await apagarDeVez(id, true);
      await atualizarIndice(lista => lista.filter(c => !vencidos.includes(c.id))).catch(()=>{});
    })();
  }, [carregando]);

  // Ações em massa (tela inicial)
  async function acaoMassa(tipo, ids){
    if(!ids.length) return false;
    const pendentes = ids.filter(id => sujos.has(id)).length;
    const avisoPendentes = pendentes ? "\n\n" + pendentes + " deles têm alterações não salvas — elas também serão salvas." : "";
    if(tipo === "exportar"){
      showToast("Preparando " + ids.length + " cronograma(s)…");
      const crs = await carregarVisoes(ids);
      await exportarVariosExcel(crs.map(c => ({ cronograma: visaoAtualDe(c.id) || c, vinculados: (c.clientesIds || []).map(id => basePorId[id]).filter(Boolean) })), ano).catch(e => showToast("Erro ao gerar o Excel: " + e.message));
      return false;
    }
    if(!podeEditar){ ui.alert("Seu perfil é só de consulta."); return false; }
    if(tipo === "abrirAno") return abrirAnoPara(ids);
    if(tipo === "status"){
      const opcoes = STATUS_FLOW.filter(s => s.id !== "aprovado" || podeAprovar).map((s, i) => (i + 1) + " = " + s.label).join("\n");
      const r = await ui.prompt("Mudar o status de " + ids.length + " cronograma(s) para qual etapa?\n\n" + opcoes + avisoPendentes, "", { titulo:"Mudar status em massa", okLabel:"Continuar" });
      if(r === null) return false;
      const lista = STATUS_FLOW.filter(s => s.id !== "aprovado" || podeAprovar);
      const alvo = lista[Number(r) - 1];
      if(!alvo){ ui.alert("Digite o número de uma das etapas."); return false; }
      if(!(await ui.confirm("Mudar " + ids.length + " cronograma(s) para \"" + alvo.label + "\"?", { okLabel:"Mudar status" }))) return false;
      const crs = await carregarVisoes(ids); let n = 0;
      for(const c0 of crs){ const c = visaoAtualDe(c0.id) || c0; if(c.status === alvo.id) continue; const novo = comNovoStatus(c, alvo.id); gravarNoCache(novo); if(await salvarCliente(novo, { silencioso:true })) n++; }
      showToast(n + " cronograma(s) movido(s) para \"" + alvo.label + "\".");
      return true;
    }
    if(tipo === "analista"){
      const nome = await ui.prompt("Analista responsável pelos " + ids.length + " cronograma(s) selecionados:" + avisoPendentes, usuario.nome || "", { titulo:"Definir analista", okLabel:"Aplicar" });
      if(nome === null) return false;
      const crs = await carregarVisoes(ids); let n = 0;
      for(const c0 of crs){ const c = visaoAtualDe(c0.id) || c0; const novo = { ...c, analista: nome.trim() }; gravarNoCache(novo); if(await salvarCliente(novo, { silencioso:true })) n++; }
      showToast("Analista definido em " + n + " cronograma(s).");
      return true;
    }
    if(tipo === "arquivar"){
      const crs = await carregarVisoes(ids);
      const arquivar = crs.some(c => !(visaoAtualDe(c.id) || c).arquivado);
      if(!(await ui.confirm((arquivar ? "Arquivar " : "Desarquivar ") + ids.length + " cronograma(s)?" + avisoPendentes, { okLabel: arquivar ? "Arquivar" : "Desarquivar" }))) return false;
      let n = 0;
      for(const c0 of crs){ const c = visaoAtualDe(c0.id) || c0; const novo = { ...c, arquivado: arquivar }; gravarNoCache(novo); if(await salvarCliente(novo, { silencioso:true })) n++; }
      showToast(n + " cronograma(s) " + (arquivar ? "arquivado(s)." : "desarquivado(s)."));
      return true;
    }
    if(tipo === "modelo"){
      const crs = await carregarVisoes(ids);
      const planos = crs.map(c0 => {
        const c = visaoAtualDe(c0.id) || c0;
        const mod = modelos.find(m => m.id === c.modeloId);
        if(!mod) return { c, motivo:"sem Modelo" };
        if(c.status === "aprovado") return { c, motivo:"aprovado (travado)" };
        return { c, ...aplicarModeloAtualizado(c, mod) };
      });
      const comMudanca = planos.filter(p => p.alteradas && p.alteradas.length);
      const tarefas = comMudanca.reduce((s, p) => s + p.alteradas.length, 0);
      const pulados = planos.filter(p => p.motivo).map(p => p.c.nome + " (" + p.motivo + ")");
      const semRef = planos.reduce((s, p) => s + (p.semReferencia || 0), 0), pers = planos.reduce((s, p) => s + (p.personalizadas || 0), 0);
      const resumoTxt = tarefas + " tarefa(s) em " + comMudanca.length + " cronograma(s) serão atualizadas com o Modelo atual." +
        (pers ? "\n" + pers + " campo(s) personalizado(s) nos cronogramas foram preservados." : "") +
        (semRef ? "\n" + semRef + " tarefa(s) de cronogramas criados antes da v4 não têm a referência de origem e não foram tocadas." : "") +
        (pulados.length ? "\nIgnorados: " + pulados.join(", ") + "." : "");
      if(!tarefas){ ui.alert("Nada a aplicar.\n\n" + resumoTxt, { titulo:"Aplicar Modelo atualizado" }); return false; }
      setLoteModal({ titulo:"Aplicar Modelo atualizado", okLabel:"Aplicar",
        descricao: resumoTxt + avisoPendentes + "\n\nMarque em quais cronogramas aplicar.",
        itens: comMudanca.map(p => ({ id: p.c.id, nome: p.c.nome, clientes: (p.c.clientesIds || []).map(nomeClienteBase).slice(0, 4).join(", "),
          detalhe: p.alteradas.length + " tarefa(s): " + p.alteradas.slice(0, 3).join("; ") + (p.alteradas.length > 3 ? "…" : "") })),
        onAplicar: async sel => {
          let n = 0; const itensLote = [];
          for(const p of comMudanca.filter(x => sel.has(x.c.id))){
            const f = await registrarFoto(p.c.id, ano, p.c, "antes_modelo", "antes de aplicar o Modelo atualizado").catch(() => null);
            const novo = { ...p.cronograma, acoes: [...(p.cronograma.acoes || []), { tipo:"edicao", descricao:"Modelo atualizado aplicado: " + p.alteradas.join("; ") + ".", em: new Date().toISOString(), quem: usuario.nome || null }] };
            gravarNoCache(novo);
            if(await salvarCliente(novo, { silencioso:true })){
              n++;
              if(f) itensLote.push({ cronogramaId: p.c.id, nome: p.c.nome, anos: [{ ano, fotoId: f.foto.id }], atualizadoEmDepois: (cacheRef.current[p.c.id] || {}).atualizadoEm });
            }
          }
          if(itensLote.length) await gravarLote({ tipo:"modelo", descricao: "Aplicar Modelo atualizado (" + ano + ")", itens: itensLote });
          showToast("Modelo atualizado aplicado em " + n + " cronograma(s). Dá para desfazer em Modelos → Aplicações recentes.");
        } });
      return false;
    }
    return false;
  }

  // Virada de ano: cria a versão do ano em que você está, copiando a versão anterior mais recente.
  async function abrirAnoPara(ids){
    if(anoEncerrado(ano, anosEstado)){ ui.alert(ano + " está encerrado — não dá pra abrir versão nele."); return false; }
    const regs = await carregarVarios(ids);
    const alvos = regs.map(r => cacheRef.current[r.id] || r).filter(r => !(r.versoes || {})[ano] && anosDoCronograma(r).length);
    const jaTem = regs.length - alvos.length;
    if(!alvos.length){ ui.alert("Todos os selecionados já têm versão " + ano + "."); return false; }
    const ok = await ui.confirm("Abrir a versão " + ano + " de " + alvos.length + " cronograma(s)?\n\nCada um copia a versão anterior mais recente (as regras que valiam em dezembro), com os mesmos clientes, e começa \"Em desenvolvimento\" — passa de novo pela aprovação." +
      (jaTem ? "\n\n" + jaTem + " já têm versão " + ano + " e ficam como estão." : ""), { titulo:"Abrir " + ano, okLabel:"Abrir " + ano });
    if(!ok) return false;
    let n = 0;
    for(const r of alvos){
      const { cronograma } = abrirAno(r, ano, usuario.nome || null);
      const agora = new Date().toISOString();
      const paraSalvar = { ...cronograma, atualizadoEm: agora };
      try {
        await kvSave(kvKeyCliente(r.id), paraSalvar);
        cacheRef.current = { ...cacheRef.current, [r.id]: paraSalvar };
        setClientesCache(prev => ({ ...prev, [r.id]: paraSalvar }));
        marcarSalvo(paraSalvar);
        await atualizarIndice(lista => upsertResumo(lista, resumoDe(paraSalvar)));
        n++;
      } catch(e){ showToast("Falhou abrir " + ano + " de \"" + r.nome + "\": " + e.message); }
    }
    showToast("Versão " + ano + " aberta em " + n + " cronograma(s).");
    return true;
  }

  // Encerrar o ano inteiro (todos os cronogramas): Gerente/Administrador, com conferência que AVISA (não bloqueia).
  async function encerrarAnoInteiro(){
    if(!podeEncerrar){ ui.alert("Seu grupo de acesso não encerra o ano."); return; }

    const ultima = ultimaTarefaDeDezembro(visoes, ano);

    const itens = [
      "• " + visoes.length + " cronograma(s) com versão " + ano + (semVersao ? " (" + semVersao + " sem versão " + ano + ")" : "") + ".",
      naoAprovados.length ? "⚠ " + naoAprovados.length + " não aprovado(s): " + nomes(naoAprovados) + "." : "✓ Todos aprovados.",
      comAlerta.length ? "⚠ " + comAlerta.length + " com alerta: " + nomes(comAlerta) + "." : "✓ Nenhum alerta.",
      ultima ? (ultima > new Date()
        ? "⚠ A última tarefa da competência de dezembro/" + ano + " ainda vai acontecer (" + fmtBR(ultima) + "). Encerrar agora trava ajustes nela."
        : "✓ A última tarefa de dezembro/" + ano + " já passou (" + fmtBR(ultima) + ").") : "",
    ].filter(Boolean);
    const ok = await ui.confirm("Encerrar " + ano + " para TODOS os cronogramas?\n\n" + itens.join("\n") +
      "\n\nDepois de encerrado, " + ano + " fica só para consulta. Gerente ou Administrador/Diretor podem reabrir o ano inteiro, ou a versão de um cronograma, com motivo.",
      { titulo:"Encerrar " + ano, okLabel:"Encerrar " + ano, perigo: naoAprovados.length > 0 || comAlerta.length > 0 });

    const quem = usuario.nome || perfil, em = new Date().toISOString();
    try {
      await salvarAnosEstado(e => ({ ...e, [ano]: { ...(e[ano] || {}), encerrado:true, por:quem, em,
        historico: [...((e[ano] && e[ano].historico) || []), { acao:"encerrado", por:quem, em, naoAprovados: naoAprovados.length, comAlerta: comAlerta.length }] } }));
      showToast(ano + " encerrado.");
      if(ano === anoVigente() && await ui.confirm(ano + " era o ano vigente. Passar o ano vigente para " + (ano + 1) + "?", { okLabel:"Passar para " + (ano + 1) })) await mudarAnoVigente(ano + 1);
    } catch(e){ showToast("Falhou encerrar: " + e.message); }

  // Troca o nome de tarefas em todos os cronogramas (todas as versões de anos não encerrados), só onde
  // a tarefa ainda está com o nome antigo. É só o nome (datas não mudam), então vale também para aprovados.
  // Cronogramas com alterações não salvas ficam de fora (pra não salvar edição pela metade de ninguém).
  async function renomearNosCronogramas(renomes, idsSelecionados){
    showToast("Renomeando nos cronogramas…");
    const regs = await carregarVarios(idsSelecionados ? [...idsSelecionados] : idsCronogramasVisiveis());
    const agora = new Date().toISOString(), quem = usuario.nome || null;
    const resumos = [], pulados = [], itensLote = []; let nTarefas = 0;
    for(const r0 of regs){
      const r = cacheRef.current[r0.id] || r0;
      const versoes = { ...(r.versoes || {}) }; let mudou = false, nAqui = 0;
      Object.keys(versoes).forEach(a => {
        if(anoEncerrado(Number(a), anosEstado)) return;
        const v = versoes[a];
        const res = renomearTarefas(v.processos, renomes);
        if(!res.mudou) return;
        mudou = true; nAqui += res.n;
        versoes[a] = { ...v, processos: res.processos, acoes: res.n ? [...(v.acoes || []), { tipo:"edicao", descricao:"Tarefa(s) renomeada(s) pelo Modelo: " + renomes.map(x => "\"" + x.de + "\" → \"" + x.para + "\"").join("; ") + ".", em: agora, quem }] : v.acoes };
      });
      if(!mudou) continue;
      if(sujos.has(r.id)){ pulados.push(r.nome); continue; }
      const paraSalvar = { ...r, versoes, atualizadoEm: agora };
      try {
        // Versão de segurança de cada ano alterado (para desfazer).
        const anosSeg = [];
        for(const a of Object.keys(versoes)){
          if(versoes[a] === r.versoes[a]) continue;
          const f = await registrarFoto(r.id, Number(a), visaoDoAno(r, a), "antes_modelo", "antes de renomear tarefa pelo Modelo");
          anosSeg.push({ ano: Number(a), fotoId: f.foto.id });
        }
        itensLote.push({ cronogramaId: r.id, nome: r.nome, anos: anosSeg, atualizadoEmDepois: agora });
        await kvSave(kvKeyCliente(r.id), paraSalvar);
        cacheRef.current = { ...cacheRef.current, [r.id]: paraSalvar };
        setClientesCache(prev => ({ ...prev, [r.id]: paraSalvar }));
        marcarSalvo(paraSalvar);
        resumos.push(resumoDe(paraSalvar)); nTarefas += nAqui;
      } catch(e){ showToast('Falhou renomear em "' + r.nome + '": ' + e.message); }
    }
    if(resumos.length) await atualizarIndice(lista => resumos.reduce((l, x) => upsertResumo(l, x), lista)).catch(()=>{});
    if(itensLote.length) await gravarLote({ tipo:"renomear", descricao: "Renomear tarefa: " + renomes.map(x => "\"" + x.de + "\" → \"" + x.para + "\"").join("; "), itens: itensLote });
    showToast(nTarefas + " tarefa(s) renomeada(s) em " + resumos.length + " cronograma(s). Dá para desfazer em Modelos → Aplicações recentes.");
    if(pulados.length) ui.alert("Ficaram de fora por terem alterações não salvas (salve e rode de novo, ou renomeie à mão):\n" + pulados.join(", "), { titulo:"Renomear nos cronogramas" });
  }

  async function restaurarFoto(foto){
    if(!podeRestaurar){ ui.alert("Seu grupo de acesso não restaura versões."); return; }
    if(travado){ ui.alert(ano + " está encerrado. Reabra o ano deste cronograma antes de restaurar."); return; }
    if(clienteAtual.status === "aprovado"){ ui.alert("O cronograma está aprovado. Volte o status (ex.: Em desenvolvimento) antes de restaurar uma versão."); return; }
    if(sujos.has(clienteId)){ ui.alert("Há alterações não salvas. Salve ou descarte antes de restaurar."); return; }
    const difs = diffClientes(clienteAtual, restaurarDaFoto(clienteAtual, foto), nomeClienteBase);
    if(!difs.length){ ui.alert("O cronograma já está igual à v" + foto.n + "."); return; }
    const ok = await ui.confirm("Restaurar a v" + foto.n + " (" + fmtHora(foto.em) + ")?\n\nOs blocos, tarefas e prazos voltam a ser como nessa versão (" + difs.length + " diferença(s)). Os clientes vinculados e o status continuam como estão.\n\nAntes, o estado atual é guardado como versão, então dá pra desfazer.",
      { titulo:"Restaurar versão", okLabel:"Restaurar v" + foto.n });
    if(!ok) return;
    await registrarFoto(clienteId, ano, clienteAtual, "antes_restaurar", "antes de restaurar a v" + foto.n).catch(()=>{});
    const agora = new Date().toISOString();
    const novo = { ...restaurarDaFoto(clienteAtual, foto), acoes: [...(clienteAtual.acoes || []), { tipo:"edicao", descricao:"Versão v" + foto.n + " (" + fmtHora(foto.em) + ") restaurada.", em: agora, quem: usuario.nome || null }] };
    gravarNoCache(novo);
    if(await salvarCliente(novo, { silencioso:true })) showToast("Versão v" + foto.n + " restaurada.");

  async function criarModeloDoCronograma(){
    if(!podeModelosTela){ ui.alert("Seu grupo de acesso não cria Modelos."); return; }
    if(!clienteAtual) return;
    const gerModelo = usaGerencia && escopo !== "all" ? escopo : null; // quem não é Administrador cria para a própria gerência
    const temVig = clienteAtual.processos.some(p => p.eventos.some(e => (e.vigencias || []).length));
    const temExc = clienteAtual.processos.some(p => p.eventos.some(e => e.excecoes && Object.keys(e.excecoes).length));
    const nome = await ui.prompt('Criar um Modelo novo a partir de "' + clienteAtual.nome + '" (' + ano + ").\n\n" +
      "Vão para o Modelo todos os blocos e tarefas como estão na tela" + (sujos.has(clienteId) ? " (inclusive alterações ainda não salvas)" : "") + ": prazos, responsáveis, travas 🔒, seções, ciclo semanal e vínculos." +
      (temVig ? "\n• Tarefas com regra \u201ca partir de\u201d levam a regra que vale em dezembro." : "") +
      (temExc ? "\n• Ajustes pontuais não vão (são só deste cronograma)." : "") +
      (usaGerencia ? "\n\nAbrangência: " + (gerModelo ? "Gerência " + nomeGerente(gerModelo) : "toda a empresa") + "." : "") +
      "\n\nO cronograma não muda. Nome do novo Modelo:", "Modelo — " + clienteAtual.nome, { titulo:"Salvar como Modelo", okLabel:"Criar Modelo" });
    if(nome === null) return;
    if(!nome.trim()){ ui.alert("Dê um nome para o Modelo."); return; }
    try {
      const noServidor = await kvLoad(KV_MODELOS_KEY).catch(()=>null);
      const atuais = (noServidor && noServidor.modelos) || modelos;
      if(atuais.some(m => normalizar(m.nome).trim() === normalizar(nome).trim())){ ui.alert('Já existe um Modelo chamado "' + nome.trim() + '". Escolha outro nome.'); return; }
      const novo = { ...modeloAPartirDoCronograma({ ...clienteAtual, ano }, nome.trim(), usuario.nome || perfil), gerenteId: gerModelo, ativo: true };
      const lista = [...atuais, novo], em = new Date().toISOString();
      await kvSave(KV_MODELOS_KEY, { modelos: lista, atualizadoEm: em });
      setModelos(lista); setModelosAtualizadoEm(em);
      await gravarVersoesModelos(atuais, lista, { [novo.id]: 'criado a partir do cronograma "' + clienteAtual.nome + '" (' + ano + ")" });
      showToast('Modelo "' + novo.nome + '" criado. Ele já aparece no Novo cronograma e em Administrar Modelos.');
