<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cronograma Operacional — Parametrização</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Cores e fonte padronizadas com o painel op2026 (tema claro): índigo #6366f1, fundo em degradê, Inter. */
  :root{ --bg:#13131f; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#6366f1; --accent-escuro:#4f46e5; --accent-claro:#818cf8; --accent2:#0891b2; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --surface:#ffffff; --surface2:#f8fafc; --surface3:#f1f5f9; --texto-sec:#475569; --card-borda:rgba(0,0,0,0.08);
    --campo-bg:#ffffff; --perigo-bg:#fef2f2; --perigo-borda:#fecaca; --perigo-txt:#991b1b; --aviso-bg:#fffbeb; --aviso-borda:#fcd34d; --link:#6366f1; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#f0f4ff,#f8fafc,#eef2ff) fixed;color:var(--ink);}
  #root{display:flex;min-height:100vh;}
  .sidebar{width:280px;background:linear-gradient(180deg,#13131f,#0f0f1e);color:#e2e8f0;padding:16px;flex-shrink:0;}
  .sidebar h1{font-size:15px;margin:0 0 4px;color:#fff;}
  .sidebar .sub{font-size:11px;color:#94a3b8;margin-bottom:16px;}
  .side-search{width:100%;margin-bottom:6px;background:#1e293b !important;border:1px solid #334155 !important;color:#e2e8f0;}
  .client-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;font-size:13px;display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:none;color:inherit;text-align:left;font-family:inherit;}
  .client-item:hover{background:#1e293b;}
  .client-item.active{background:var(--accent);color:#fff;}
  .client-item.arquivado{opacity:.55;}
  .client-item small{display:block;color:#94a3b8;font-size:10px;}
  .client-item.active small{color:#e0e7ff;}
  .client-item .dot{color:#fbbf24;font-size:16px;line-height:1;}
  .btn{border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--accent-escuro);}
  .btn-ghost{background:#1e293b;color:#e2e8f0;}
  .btn-outline{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  .btn-danger{background:var(--bad);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:11px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .link-btn{background:none;border:none;color:var(--link);cursor:pointer;font-size:12px;padding:0;text-decoration:underline;font-family:inherit;}
  .link-btn.perigo{color:var(--bad);}
  .main{flex:1;padding:0 32px 24px;overflow:auto;min-width:0;}
  .savebar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f4f6ff;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .dirty{color:var(--warn);font-weight:700;font-size:12.5px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .topbar h2{margin:0;font-size:19px;}
  .topbar .sub{font-size:12px;color:var(--muted);}
  .card{background:var(--panel);border:1px solid var(--card-borda);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:700;}
  .badge-on{background:#dcfce7;color:#166534;}
  .badge-off{background:#f1f5f9;color:#94a3b8;}
  .badge-months{background:#e0e7ff;color:#3730a3;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;}
  th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  .table-wrap{overflow-x:auto;}
  .resp-cliente{color:#0891b2;font-weight:600;}
  .resp-sinergy{color:#7c3aed;font-weight:600;}
  .resp-bpo{color:#0f766e;font-weight:600;}
  select,input[type=text],input[type=number],input[type=date],input[type=search]{font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-family:inherit;}
  .rule-editor{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .month-picker{display:flex;flex-wrap:wrap;gap:4px;}
  .month-chip{padding:3px 8px;border-radius:5px;border:1px solid var(--line);font-size:11px;cursor:pointer;background:#fff;font-family:inherit;color:inherit;}
  .month-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .muted{color:var(--muted);font-size:12px;}
  .alerta{color:var(--warn);cursor:help;}
  .grid-preview table{min-width:1200px;}
  .note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px;}
  .note-lock{background:#f0fdf4;border-color:#bbf7d0;color:#166534;}
  .note-info{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;}
  .status-pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
  .status-em_desenvolvimento{background:#f1f5f9;color:#475569;}
  .status-aguardando_cliente{background:#fef3c7;color:#92400e;}
  .status-aprovado_analista{background:#e0e7ff;color:#3730a3;}
  .status-aguardando_aprovacao_superior{background:#fde68a;color:#78350f;}
  .status-aprovado{background:#dcfce7;color:#166534;}
  .status-desfeito{background:#fee2e2;color:#991b1b;}
  .status-stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .status-step{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff;font-family:inherit;}
  button.status-step{cursor:pointer;}
  .status-step.done{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe;}
  .status-step.current{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
  .toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:1200;max-width:calc(100vw - 40px);}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .dialog-overlay{z-index:1100;}
  .modal-box{background:#fff;border-radius:12px;padding:22px 26px;width:560px;max-width:100%;max-height:86vh;overflow:auto;}
  .modal-box h3{margin-top:0;}
  .wizard-q{margin-bottom:16px;}
  .wizard-q label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;}
  .wizard-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
  /* Calendário mensal */
  .cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:4px;min-width:780px;}
  .cal-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px;}
  .cal-cell{background:#fff;border:1px solid var(--line);border-radius:6px;min-height:96px;padding:4px 5px;font-size:11px;}
  .cal-cell.vazio{background:transparent;border:none;}
  .cal-cell.off{background:#f1f5f9;}
  .cal-cell.feriado{background:#fef2f2;border-color:#fecaca;}
  .cal-dia{font-weight:700;font-size:12px;}
  .cal-feriado-nome{color:#991b1b;font-size:10px;}
  .cal-item{display:block;margin-top:3px;padding:2px 4px;border-radius:4px;line-height:1.25;}
  .cal-legenda{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;}
  .cal-leg-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink);}
  .cal-leg-item.off{opacity:.4;text-decoration:line-through;}
  .cal-leg-cor{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .cat-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;}
  .doc-invalido{color:var(--bad);font-weight:700;}
  .pick-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .pick-list table td,.pick-list table th{border-left:none;border-right:none;}
  .pick-list tr.bloq{opacity:.5;}
  textarea{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;}
  .testes td.ok{color:var(--ok);font-weight:700;}
  .testes td.falha{color:var(--bad);font-weight:700;}
  /* A página inteira é quem rola: sem overflow aqui, os "sticky" (barra de salvar,
     índice de processos, barra de ações em massa) funcionam. */
  .main{overflow:visible;}
  /* ===== v4: leitura (fonte maior, mais contraste) ===== */
  body{font-size:14px;}
  table{font-size:13px;}
  th{font-size:11.5px;color:#475569;}
  .muted{font-size:12.5px;color:#5b6b82;}
  select,input[type=text],input[type=number],input[type=date],input[type=search]{font-size:13px;padding:5px 7px;}
  .btn{font-size:13px;}
  .btn-sm{font-size:12px;padding:4px 9px;}
  .badge{font-size:11.5px;}
  .link-btn{font-size:13px;}
  .topbar h2{font-size:21px;}
  .card h3{font-size:15px;}
  /* ===== v4: menu lateral ===== */
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .sidebar.recolhida{width:64px;padding:12px 8px;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;background:transparent;border:none;color:#cbd5e1;font-size:14px;cursor:pointer;text-align:left;font-family:inherit;text-decoration:none;}
  .nav-item:hover{background:#1e293b;color:#fff;}
  .nav-item.active{background:var(--accent);color:#fff;}
  .nav-item:disabled{opacity:.45;cursor:not-allowed;}
  .nav-ic{width:20px;text-align:center;flex-shrink:0;}
  .nav-badge{margin-left:auto;background:#f59e0b;color:#111827;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:700;}
  .sidebar.recolhida .nav-badge{position:absolute;margin-left:22px;margin-top:-16px;font-size:10px;padding:0 5px;}
  .nav-secao{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin:14px 0 4px;}
  .nav-recente{font-size:13px;padding:6px 10px;}
  .nav-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .nav-item .dot{color:#fbbf24;}
  .caixa-local{background:#422006;border:1px solid #a16207;color:#fde68a;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:14px;}
  .caixa-erro{background:#450a0a;border:1px solid #dc2626;color:#fecaca;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px;}
  /* ===== v4: tela inicial ===== */
  .contadores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .contador{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);}
  .contador:hover{border-color:#93c5fd;}
  .contador.on{border-color:var(--accent);box-shadow:0 0 0 2px #bfdbfe;}
  .contador .n{font-size:24px;font-weight:700;line-height:1.1;}
  .contador .l{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;}
  .contador{min-width:0;}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .chk{display:flex;gap:5px;align-items:center;cursor:pointer;}
  .bulkbar{position:sticky;top:58px;z-index:40;background:#1e293b;color:#fff;border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .tabela-lista td{padding:8px 10px;} .tabela-lista th{padding:8px 10px;}
  .linha-clicavel{cursor:pointer;} .linha-clicavel:hover td{background:#f8fafc;} .linha-clicavel.sel td{background:#eff6ff;}
  .link-crono{color:var(--ink);font-weight:600;text-decoration:none;} .link-crono:hover{color:var(--accent);text-decoration:underline;}
  /* ===== v4: cronograma ===== */
  .migalha a{color:var(--muted);text-decoration:none;} .migalha a:hover{text-decoration:underline;}
  .barra-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;}
  .status-trilha{display:inline-flex;gap:4px;}
  .trilha-ponto{width:22px;height:5px;border-radius:3px;background:#e2e8f0;} .trilha-ponto.on{background:var(--accent);}
  .abas{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap;}
  .aba{background:none;border:none;padding:9px 14px;font-size:14px;font-family:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;}
  .aba:hover{color:var(--ink);} .aba.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
  .btn-alerta{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
  .layout-crono{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start;}
  .indice-proc{position:sticky;top:64px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:calc(100vh - 90px);overflow:auto;}
  .indice-item{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:13px;}
  .indice-item.inativo .indice-nome{color:#94a3b8;text-decoration:line-through;}
  .indice-nome{text-align:left;color:var(--ink);text-decoration:none;flex:1;font-size:13px;}
  .indice-nome:hover{color:var(--accent);text-decoration:underline;}
  .faixa-competencia{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;}
  .proc-toggle{background:#f1f5f9;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px;flex-shrink:0;}
  .login-wrap{flex:1;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f0f4ff,#f8fafc,#eef2ff);}
  .login-col{width:100%;max-width:360px;}
  .login-topo{text-align:center;margin-bottom:32px;}
  .login-selo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);margin-bottom:16px;font-size:24px;font-weight:700;color:#818cf8;}
  .login-marca{font-size:11px;font-weight:600;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .login-topo h1{margin:0;font-size:22px;font-weight:700;color:var(--ink);}
  .login-topo p{margin:6px 0 0;font-size:13px;color:var(--muted);}
  .login-box{background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.08);padding:24px;}
  .login-campo{display:block;margin-bottom:16px;}
  .login-campo span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .login-campo select,.login-campo input{width:100%;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid rgba(0,0,0,0.12);background:#f8fafc;color:var(--ink);font-family:inherit;}
  .login-erro{font-size:12px;color:#ef4444;margin-bottom:14px;text-align:center;padding:8px;background:rgba(239,68,68,0.08);border-radius:6px;}
  .login-entrar{width:100%;padding:10px;font-size:14px;border-radius:8px;}
  .usuario-logado{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#e2e8f0;font-size:13px;}
  .usuario-logado .muted-claro{color:#94a3b8;font-size:11px;}
  .nome-editavel{border:1px dashed transparent;border-radius:6px;background:transparent;color:var(--ink);font-family:inherit;}
  .nome-editavel:hover{border-color:var(--line);background:#f8fafc;}
  .nome-editavel:focus{border:1px solid var(--accent);background:#fff;outline:none;}
  .proc-titulo{background:none;border:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;padding:2px;text-align:left;}
  .proc-titulo:hover{color:var(--accent);}
  .proc-resumo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:#334155;margin-top:8px;padding-left:34px;}
  .badge-padrao{background:#fef3c7;color:#92400e;} .badge-extra{background:#ede9fe;color:#5b21b6;} .badge-alerta{background:#fef3c7;color:#b45309;}
  .regra-txt{display:inline-flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .linha-alerta{background:#fffbeb;color:#92400e;font-size:12.5px;white-space:normal;}
  .linha-destaque td{animation:piscar 2.4s ease;}
  @keyframes piscar{0%,40%{background:#fde68a;}100%{background:transparent;}}
  /* ===== v4: versões por ano ===== */
  .chip-ano{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:.8em;font-weight:700;vertical-align:middle;margin-right:4px;text-decoration:none;}
  .chip-link{background:#e0e7ff;color:#3730a3;}
  .chip-link:hover{background:#c7d2fe;}
  .chip-link.on{background:var(--accent);color:#fff;}
  .anos-crono{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px;}
  .editando-ano{font-size:13px;color:#3730a3;background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:2px 8px;margin-right:4px;}
  .sem-versao{border:1px dashed #93c5fd;background:#f8fbff;}
  .kpi-botao{cursor:pointer;text-align:left;font-family:inherit;border:1px dashed #93c5fd;}
  .kpi-botao:hover{background:#eff6ff;}
  .vig-rotulo{font-weight:700;color:#3730a3;margin-right:4px;}
  .vig-linha{margin-top:4px;padding-top:4px;border-top:1px dotted var(--line);}
  .vig-nova{margin-top:6px;}
  .vig-nova select{font-size:12px;padding:2px 6px;color:var(--accent);border-color:#bfdbfe;}
  .encerramento{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;}
  .secao-inativa .card{opacity:.6;border-style:dashed;}
  .tabela-grupos th{font-size:11px;vertical-align:bottom;}
  .tabela-grupos td input{width:18px;height:18px;}
  /* ===== v4: painel ===== */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .kpi-n{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink);}
  .kpi-de{font-size:16px;font-weight:600;color:var(--muted);}
  .kpi-l{font-size:13px;color:#475569;margin-top:4px;}
  .painel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;}
  .painel-grid-4{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  .painel-grid > .card{margin-bottom:16px;}
  .serie-linha{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;padding:5px 0;}
  .serie-rotulo{font-size:13px;color:var(--ink);}
  .serie-trilho{background:#f1f5f9;border-radius:4px;height:12px;overflow:hidden;}
  .serie-barra{background:#2a78d6;height:100%;border-radius:0 4px 4px 0;}
  .serie-valor{font-size:13px;white-space:nowrap;}
  .progresso{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;}
  .empilhada{display:flex;gap:2px;height:22px;border-radius:4px;overflow:hidden;margin:6px 0 10px;background:#fff;}
  .empilhada-seg{min-width:4px;}

<div id="root"></div>

<!-- =========================================================================
     PERSISTÊNCIA (Supabase, tabela kv)
     Mesmas credenciais do painel op2026. A segurança de verdade (autenticação,
     RLS) virá da integração com o site autenticado — por enquanto é protótipo.
     ========================================================================= -->
<script>
  const SUPABASE_URL = "https://slmbgwpnegzvnxkllorh.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsbWJnd3BuZWd6dm54a2xsb3JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNTMxNDMsImV4cCI6MjA5NzcyOTE0M30.Fs_Th99bpkfAlHEgxPJiL26XGYtIb-R1H-XQ6Qx5tqU";
  const CRONOGRAMA_KV_KEY = "sinergy_cronograma_draft"; // chave legada (Rodada 1, um blob só) — lida uma única vez pra migração
  const KV_INDEX_KEY = "sinergy_cronograma_index"; // lista leve de clientes (id/nome/status/arquivado)
  const KV_MODELOS_KEY = "sinergy_cronograma_modelos"; // catálogo de Modelos — nunca entra na chave de um cliente
  const KV_BASE_CLIENTES_KEY = "sinergy_cronograma_base_clientes"; // base de clientes (CNPJ/CPF), separada dos cronogramas
  const KV_ANOS_KEY = "sinergy_cronograma_anos"; // encerramento de cada ano (manual, Gerente/Administrador)
  const KV_SECOES_KEY = "sinergy_cronograma_secoes"; // biblioteca de seções personalizadas (Diretor/Gerente/Coordenador)
  const KV_GRUPOS_KEY = "sinergy_cronograma_grupos"; // grupos de acesso e permissões
  const KV_MODELOS_VERSOES_KEY = "sinergy_cronograma_modelos_versoes"; // histórico de versões dos Modelos
  const KV_LOTES_KEY = "sinergy_cronograma_lotes"; // aplicações de Modelo em vários cronogramas (para desfazer)
  const KV_EXPORT_KEY = "sinergy_cronograma_exportacoes"; // histórico (resumo) das exportações de tarefas p/ o painel
  const PREF_EXPL = "sinergy_cronograma_expl_"; // linhas de cada exportação (baixar de novo, comparar mudanças)
  const KV_TIMES_KEY = "sinergy_cronograma_times"; // times (responsáveis por categoria) + de/para de categorias do importador
  // Obs.: por compatibilidade, cada CRONOGRAMA continua gravado em "sinergy_cronograma_cliente_<id>".
  function kvKeyCliente(id){ return "sinergy_cronograma_cliente_" + id; }
  function kvKeyFotos(id){ return "sinergy_cronograma_fotos_" + id; } // versões ("fotos") de um cronograma, separadas pra não pesar na abertura
  function kvKeyPresenca(id){ return "sinergy_cronograma_presenca_" + id; }

  /* ===== ONDE OS DADOS FICAM =====
     "local"    → modo de teste: tudo no próprio navegador (localStorage), sem
                  tocar no Supabase. Os dados ficam só nesta máquina/navegador —
                  use "Exportar backup" pra guardar ou passar pra outra pessoa.
     "supabase" → tabela própria "cronograma_kv" (criar antes com o arquivo
                  supabase_cronograma_kv.sql). NÃO usa a tabela "kv" do painel op2026.
     Padrão: publicado no GitHub Pages (junto do painel) → "supabase"; arquivo aberto no computador → "local".
     Dá pra forçar pela URL: ?banco=local ou ?banco=supabase */
  const MODO_ARMAZENAMENTO_PADRAO = /github\.io$/.test(window.location.hostname) ? "supabase" : "local";
  const KV_TABELA = "cronograma_kv";
  const MODO_ARMAZENAMENTO = (() => {
    const p = new URLSearchParams(window.location.search).get("banco");
    return p === "supabase" || p === "local" ? p : MODO_ARMAZENAMENTO_PADRAO;
  })();
  const LOCAL_PREFIXO = "cronograma_local::";

  const KV_HEADERS = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
  async function kvErro(res, acao){
    let detalhe = "";
    try { const j = await res.json(); detalhe = j.message || j.hint || JSON.stringify(j); } catch(e){}
    return new Error("Falha ao " + acao + " (" + res.status + (detalhe ? ": " + detalhe : "") + ")");
  }
  async function kvLoad(key){
    if(MODO_ARMAZENAMENTO === "local"){
      const s = localStorage.getItem(LOCAL_PREFIXO + key);
      return s == null ? null : JSON.parse(s);
    }
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + KV_TABELA + "?id=eq." + encodeURIComponent(key) + "&select=value", { headers: KV_HEADERS, cache: "no-store" });
    if(!res.ok) throw await kvErro(res, "carregar");
    const rows = await res.json();
    if(!rows.length || rows[0].value == null) return null;
    const v = rows[0].value;
    if(typeof v !== "string") return v;
    try { return JSON.parse(v); } catch(e){ return v; }
  }
  async function kvSave(key, value){
    if(MODO_ARMAZENAMENTO === "local"){
      try { localStorage.setItem(LOCAL_PREFIXO + key, JSON.stringify(value)); }
      catch(e){ throw new Error("Falha ao salvar no navegador (" + e.message + ") — o espaço local pode ter acabado; exporte um backup."); }
      return;
    }
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + KV_TABELA, {
      method: "POST",
      headers: { ...KV_HEADERS, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ id: key, value })
    });
    if(!res.ok) throw await kvErro(res, "salvar");
  }
  async function kvDelete(key){
    if(MODO_ARMAZENAMENTO === "local"){ localStorage.removeItem(LOCAL_PREFIXO + key); return; }
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + KV_TABELA + "?id=eq." + encodeURIComponent(key), { method: "DELETE", headers: KV_HEADERS });
    if(!res.ok) throw await kvErro(res, "excluir");
  }

  /* ===== LOGIN — usuários e grupos do painel op2026 =====
     O cronograma usa os MESMOS usuários/PIN e grupos do painel, guardados na tabela "kv" do painel
     (chaves sinergy_auth_v1 e sinergy_groups_v1). O cronograma SÓ LÊ essas duas chaves — nunca grava na kv.
     Liga sozinho no modo "supabase" (produção). Para testar no computador: ?login=1, com usuários falsos
     em localStorage "painel_teste::sinergy_auth_v1" / "painel_teste::sinergy_groups_v1".
     Vindo do painel (botão "📅 Cronograma"), o painel deixa em localStorage quem está logado
     (HANDOFF_KEY, vale 2 min) e o cronograma entra direto, conferindo se o usuário existe e está ativo. */
  // Com o banco de verdade (supabase) o login é SEMPRE obrigatório — ?login=0 só vale no modo teste local
  // (revisão de 29/09/2026: ?login=0 no site publicado entrava sem PIN, como Gerente/Administrador).
  const LOGIN_INTEGRADO = (() => {
    if(MODO_ARMAZENAMENTO === "supabase") return true;
    return new URLSearchParams(window.location.search).get("login") === "1";
  })();
  const HANDOFF_KEY = "sinergy_cronograma_handoff";
  const SESSAO_KEY = "sinergy_cronograma_sessao";
  const SESSAO_HORAS = 12;
  function parseTalvezDuplo(v){ let x = v; for(let i = 0; i < 3 && typeof x === "string"; i++){ try { x = JSON.parse(x); } catch(e){ break; } } return x; }
  async function carregarUsuariosDoPainel(){
    if(MODO_ARMAZENAMENTO === "local"){
      const ler = k => parseTalvezDuplo(localStorage.getItem("painel_teste::" + k));
      return { usuarios: ler("sinergy_auth_v1") || [], grupos: ler("sinergy_groups_v1") || [] };
    }
    // SÓ LEITURA da tabela kv do painel.
    const res = await fetch(SUPABASE_URL + "/rest/v1/kv?id=in.(sinergy_auth_v1,sinergy_groups_v1)&select=id,value", { headers: KV_HEADERS, cache: "no-store" });
    if(!res.ok) throw await kvErro(res, "carregar os usuários do painel");
    const por = Object.fromEntries((await res.json()).map(r => [r.id, parseTalvezDuplo(r.value)]));
    return { usuarios: Array.isArray(por.sinergy_auth_v1) ? por.sinergy_auth_v1 : [], grupos: Array.isArray(por.sinergy_groups_v1) ? por.sinergy_groups_v1 : [] };
  }
  function lerSessao(){
    try { const s = JSON.parse(sessionStorage.getItem(SESSAO_KEY) || "null"); return s && Date.now() - s.em < SESSAO_HORAS * 3600000 ? s : null; } catch(e){ return null; }
  }
  function gravarSessao(s){ try { sessionStorage.setItem(SESSAO_KEY, JSON.stringify(s)); } catch(e){} }
  function encerrarSessao(){ try { sessionStorage.removeItem(SESSAO_KEY); } catch(e){} }
  function consumirHandoff(){
    try { const h = JSON.parse(localStorage.getItem(HANDOFF_KEY) || "null"); localStorage.removeItem(HANDOFF_KEY); return h && Date.now() - h.em < 120000 ? h : null; } catch(e){ return null; }
  }
  // Tema claro/escuro: MESMAS chaves do painel (mesmo endereço = mesmo localStorage), então a escolha vale nos dois.
  // Sem nada salvo, escuro — igual ao painel.
  function temaSalvo(uid){
    try { const v = (uid && localStorage.getItem("sinergy_theme_" + uid)) || localStorage.getItem("sinergy_theme_default"); return v === "light" ? "claro" : "escuro"; }
    catch(e){ return "escuro"; }
  }
  function aplicarTema(t){ document.documentElement.setAttribute("data-tema", t === "claro" ? "claro" : "escuro"); }
  function salvarTema(t, uid){
    const v = t === "claro" ? "light" : "dark";
    try { if(uid) localStorage.setItem("sinergy_theme_" + uid, v); localStorage.setItem("sinergy_theme_default", v); } catch(e){}
  }
  aplicarTema(temaSalvo((lerSessao() || {}).id)); // antes de desenhar a tela, sem piscar
  // Grupos do painel → grupos do cronograma (os 4 base têm o mesmo papel; "coord" no painel = "coordenador" aqui).
  const MAPA_GRUPOS_PAINEL = { coord: "coordenador" };
  function perfilDoGrupoPainel(groupId){ return MAPA_GRUPOS_PAINEL[groupId] || groupId || "analista"; }

  // Lê TODAS as linhas de uma consulta, página a página. O Supabase corta a resposta no "Max rows" do projeto
  // (padrão 1000) SEM erro — por isso pede a contagem (Content-Range) e continua até ter tudo.
  async function kvBuscarTudo(filtro, acao){
    const todas = [];
    for(let volta = 0; volta < 200; volta++){
      const res = await fetch(SUPABASE_URL + "/rest/v1/" + KV_TABELA + "?" + filtro + "&select=id,value&order=id&offset=" + todas.length,
        { headers: { ...KV_HEADERS, Prefer: "count=exact" }, cache: "no-store" });
      if(!res.ok) throw await kvErro(res, acao);
      const linhas = await res.json();
      todas.push(...linhas);
      const total = Number(((res.headers.get("content-range") || "").split("/")[1]) || NaN);
      if(!linhas.length || !(total > todas.length)) break;
    }
    return todas;
  }
  // Backup do BANCO (modo supabase): baixa tudo da tabela cronograma_kv no mesmo formato do backup local.
  async function lerTudoDoBanco(){
    const dados = {};
    (await kvBuscarTudo("id=not.like.*_presenca_*", "ler o banco")).forEach(r => { if(!r.id.includes("_presenca_")) dados[r.id] = r.value; });
    return dados;
  }
  function baixarJsonBackup(dados, prefixo){
    const blob = new Blob([JSON.stringify({ tipo:"cronograma_backup", versao:1, geradoEm:new Date().toISOString(), dados }, null, 1)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = prefixo + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /* ===== Listas em REGISTROS INDIVIDUAIS (edição simultânea) =====
     A base de clientes e o índice de cronogramas eram um registro único cada — com muita gente salvando ao mesmo tempo,
     uma gravação podia passar por cima da outra. Agora: 1 registro por cliente e 1 resumo por cronograma; cada
     gravação só escreve o que mudou. Os prefixos evitam colisão com o LIKE do PostgREST ("_" vale 1 caractere). */
  const PREF_BASE = "sinergy_cronograma_basecli_";
  const PREF_RESUMO = "sinergy_cronograma_resumo_";
  async function kvListar(prefixo){
    if(MODO_ARMAZENAMENTO === "local"){
      const out = [];
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(LOCAL_PREFIXO + prefixo)) out.push({ id: k.slice(LOCAL_PREFIXO.length), value: JSON.parse(localStorage.getItem(k)) });
      }
      return out;
    }
    return (await kvBuscarTudo("id=like." + encodeURIComponent(prefixo) + "*", "listar")).map(r => ({ id: r.id, value: typeof r.value === "string" ? parseTalvezDuplo(r.value) : r.value }));
  }
  // Grava só o que mudou entre duas listas de objetos com "id" (e apaga os que saíram).
  async function kvSincronizarLista(prefixo, antes, depois){
    const porId = Object.fromEntries((antes || []).map(x => [x.id, JSON.stringify(x)]));
    const ids = new Set((depois || []).map(x => x.id));
    const salvar = (depois || []).filter(x => x && x.id && porId[x.id] !== JSON.stringify(x));
    const apagar = (antes || []).filter(x => x && x.id && !ids.has(x.id));
    for(let i = 0; i < salvar.length; i += 10) await Promise.all(salvar.slice(i, i + 10).map(x => kvSave(prefixo + x.id, x)));
    for(let i = 0; i < apagar.length; i += 10) await Promise.all(apagar.slice(i, i + 10).map(x => kvDelete(prefixo + x.id)));
    return { salvos: salvar.length, apagados: apagar.length };
  }
  // Lê a lista em registros. Na 1ª vez, migra do registro único antigo (que fica guardado como cópia, marcado).
  async function kvCarregarLista(prefixo, chaveAntiga){
    const partes = (await kvListar(prefixo)).map(p => p.value).filter(Boolean);
    const antigo = await kvLoad(chaveAntiga).catch(() => null);
    if(!antigo || antigo.migradoParaRegistros || !Array.isArray(antigo.clientes) || !antigo.clientes.length) return partes;
    // Migra o que ainda não existe como registro (o que já existe como registro é mais novo e prevalece).
    const tem = new Set(partes.map(x => x.id));
    const faltam = antigo.clientes.filter(x => x && x.id && !tem.has(x.id));
    await kvSincronizarLista(prefixo, [], faltam);
    await kvSave(chaveAntiga, { ...antigo, migradoParaRegistros: new Date().toISOString() });
    return [...partes, ...faltam];
  }

  // Backup (modo local): tudo o que o cronograma guardou, num arquivo JSON.
  function localChaves(){
    const out = [];
    for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith(LOCAL_PREFIXO)) out.push(k); }
    return out;
  }
  function exportarBackupLocal(){
    const dados = {};
    localChaves().forEach(k => { if(!k.includes("_presenca_")) dados[k.slice(LOCAL_PREFIXO.length)] = JSON.parse(localStorage.getItem(k)); });
    const blob = new Blob([JSON.stringify({ tipo:"cronograma_backup", versao:1, geradoEm:new Date().toISOString(), dados }, null, 1)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "cronograma_backup_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function importarBackupLocal(arquivo){
    const j = JSON.parse(await arquivo.text());
    if(!j || j.tipo !== "cronograma_backup" || !j.dados) throw new Error("Arquivo não é um backup do cronograma.");
    localChaves().forEach(k => localStorage.removeItem(k));
    Object.entries(j.dados).forEach(([k, v]) => localStorage.setItem(LOCAL_PREFIXO + k, JSON.stringify(v)));
  }
  function limparDadosLocais(){ localChaves().forEach(k => localStorage.removeItem(k)); }
</script>

     MOTOR DE CALENDÁRIO E REGRAS — JS puro, sem React/Babel.
