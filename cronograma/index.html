// Coordenador(es)/analista(s) de vários clientes de uma vez (mesma gerência, para as pessoas serem válidas).
function ResponsaveisLoteModal({ clientes, opcoesPorCampo, rotuloGerencia, onAplicar, onFechar }){
  const CAMPOS = [["coordenador", "Coordenador(es)"], ["analista", "Analista(s)"]];
  const [cfg, setCfg] = useState({ coordenador: { acao: "manter", nomes: "" }, analista: { acao: "manter", nomes: "" } });
  const set = (campo, patch) => setCfg(c => ({ ...c, [campo]: { ...c[campo], ...patch } }));
  const mudancas = clientes.map(c => {
    const novo = {}; CAMPOS.forEach(([k]) => { novo[k] = aplicarAcaoNomes(c[k], cfg[k].acao, cfg[k].nomes); });
    return { c, novo, muda: CAMPOS.some(([k]) => juntarNomes(nomesDoCampo(c[k])) !== novo[k]) };
  });
  const nMuda = mudancas.filter(m => m.muda).length;
  const precisaNomes = CAMPOS.some(([k]) => ["substituir", "adicionar", "remover"].includes(cfg[k].acao) && !nomesDoCampo(cfg[k].nomes).length);
  async function aplicar(){
    if(precisaNomes){ ui.alert("Escolha a(s) pessoa(s) para a ação selecionada."); return; }
    if(!nMuda){ ui.alert("Nada muda nos clientes selecionados com essas opções."); return; }
    const ex = mudancas.filter(m => m.muda).slice(0, 8).map(m => "• " + (m.c.razaoSocial || fmtDocumento(m.c.documento)) + ": " + CAMPOS.map(([k, l]) => l.replace("(es)", "").replace("(s)", "") + ' "' + (m.novo[k] || "—") + '"').join(" · ")).join("\n");
    if(!(await ui.confirm("Alterar os responsáveis de " + nMuda + " cliente(s)?\n\n" + ex + (nMuda > 8 ? "\n… e mais " + (nMuda - 8) : ""), { titulo:"Coordenador/analista em lote", okLabel:"Alterar " + nMuda }))) return;
    onAplicar(mudancas.filter(m => m.muda).map(m => ({ id: m.c.id, ...m.novo })));
  }
  return (
    <div className="modal-overlay dialog-overlay" style={{zIndex:1050}} onMouseDown={fecharAoClicarFora(false, onFechar)}>
      <div className="modal-box" style={{width:600}}>
        <h3>Coordenador e analista — {clientes.length} cliente(s)</h3>
        <p className="muted" style={{marginTop:0}}>{rotuloGerencia} Os campos servem para os filtros “Meus clientes/cronogramas”; o acesso continua sendo pela gerência.</p>
        {CAMPOS.map(([campo, label]) => (
          <div className="wizard-q" key={campo}>
            <label>{label}</label>
            <div style={{display:"flex", gap:8, alignItems:"flex-start", flexWrap:"wrap"}}>
              <select value={cfg[campo].acao} onChange={e=>set(campo, { acao: e.target.value })} aria-label={"Ação para " + label}>
                <option value="manter">Manter como está</option>
                <option value="substituir">Substituir por…</option>
                <option value="adicionar">Adicionar…</option>
                <option value="remover">Remover…</option>
                <option value="limpar">Limpar (deixar vazio)</option>
              </select>
              {["substituir", "adicionar", "remover"].includes(cfg[campo].acao) && (
                <div style={{flex:1, minWidth:240}}>
                  <SeletorPessoas valor={cfg[campo].nomes} onChange={v => set(campo, { nomes: v })}
                    opcoes={cfg[campo].acao === "remover" ? [...new Set(clientes.flatMap(c => nomesDoCampo(c[campo])))].sort((a,b) => a.localeCompare(b, "pt-BR")) : opcoesPorCampo[campo]}
                    rotuloVazio="ninguém disponível" />
                </div>
              )}
            </div>
          </div>
        ))}
        <p className="muted" style={{marginBottom:0}}>{nMuda} de {clientes.length} cliente(s) vão mudar com essas opções.</p>
        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onFechar}>Cancelar</button>
          <button className="btn btn-primary" disabled={!nMuda || precisaNomes} onClick={aplicar}>Aplicar…</button>
        </div>
      </div>
    </div>
  );
}
// Vários nomes (chips) escolhidos de uma lista; nomes antigos fora da lista continuam e podem ser removidos.
function SeletorPessoas({ valor, opcoes, onChange, rotuloVazio }){
  const escolhidos = nomesDoCampo(valor);
  const livres = (opcoes || []).filter(o => !escolhidos.some(e => normalizar(e) === normalizar(o)));
  return (
    <div className="seletor-pessoas">
      {escolhidos.map(n => {
        const valido = (opcoes || []).some(o => normalizar(o) === normalizar(n));
        return <span key={n} className={"chip-pessoa" + (valido ? "" : " invalido")} title={valido ? "" : "Não é usuário desta gerência no painel — remova ou troque"}>{valido ? "" : "⚠ "}{n}<button type="button" aria-label={"Tirar " + n} onClick={()=>onChange(juntarNomes(escolhidos.filter(x => x !== n)))}>×</button></span>;
      })}
      <select value="" onChange={e=>{ if(e.target.value) onChange(juntarNomes([...escolhidos, e.target.value])); }} aria-label="Adicionar pessoa">
        <option value="">{livres.length ? "+ adicionar…" : (rotuloVazio || "ninguém disponível")}</option>
        {livres.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}
function ClienteBaseForm({ inicial, base, onSalvar, onFechar, gerentes = [], usuariosPainel = [], gruposPainel = [], escopo = "all", vinculado = false }){
  const [f, setF] = useState(() => ({ razaoSocial: inicial?.razaoSocial || "", documento: inicial ? fmtDocumento(inicial.documento) : "", codigo: inicial?.codigo || "", grupo: inicial?.grupo || "",
    gerente: inicial?.gerente || "", coordenador: inicial?.coordenador || "", analista: inicial?.analista || "",
    gerenteId: inicial?.gerenteId || (escopo !== "all" ? escopo : "") }));
  const usaGerencia = gerentes.length > 0;
  const nomeGer = id => (gerentes.find(g => g.id === id) || {}).nome || "";
  const original = useRef(JSON.stringify(f));
  const n = normalizarDocumento(f.documento);
  const duplicado = n.valido && base.find(c => c.documento === n.doc && c.id !== inicial?.id);
  const idRepetido = f.codigo.trim() && base.find(c => c.id !== inicial?.id && normalizar(c.codigo).trim() === normalizar(f.codigo).trim());
  const nomesDe = campo => [...new Set(base.map(c => c[campo]).filter(Boolean))].sort((a,b) => a.localeCompare(b, "pt-BR"));
  function salvar(){
    if(!n.valido){ ui.alert("CNPJ/CPF inválido — confira os dígitos."); return; }
    if(duplicado){ ui.alert('Esse documento já está na base: "' + (duplicado.razaoSocial || fmtDocumento(duplicado.documento)) + '".'); return; }
    if(idRepetido){ ui.alert('O ID "' + f.codigo.trim() + '" já é de ' + (idRepetido.razaoSocial || fmtDocumento(idRepetido.documento)) + ". Cada cliente precisa de um ID diferente."); return; }
    if(usaGerencia && !f.gerenteId){ ui.alert("Escolha a gerência do cliente — é obrigatória."); return; }
    // Coordenador e analista são opcionais, mas se informados têm de ser usuários do painel dessa gerência.
    if(usaGerencia){
      const invalidos = ["coordenador", "analista"].flatMap(campo => {
        const validos = pessoasDaGerencia(usuariosPainel, gruposPainel, f.gerenteId, campo).map(normalizar);
        return nomesDoCampo(f[campo]).filter(n => !validos.includes(normalizar(n))).map(n => (campo === "coordenador" ? "Coordenador" : "Analista") + ' "' + n + '"');
      });
      if(invalidos.length){ ui.alert("Estes nomes não são usuários da gerência " + nomeGer(f.gerenteId) + " no painel. Remova (×) ou troque pela pessoa certa:\n\n• " + invalidos.join("\n• "), { titulo:"Responsável inválido" }); return; }
    }
    if(usaGerencia && vinculado && inicial?.gerenteId && f.gerenteId !== inicial.gerenteId){ ui.alert("Este cliente está vinculado a um cronograma da gerência " + nomeGer(inicial.gerenteId) + ". Desvincule antes de trocar a gerência."); return; }
    onSalvar({ ...(inicial || {}), razaoSocial: f.razaoSocial.trim(), documento: n.doc, tipoDocumento: n.tipo, codigo: f.codigo.trim(), grupo: f.grupo.trim(),
      gerente: usaGerencia ? nomeGer(f.gerenteId) : f.gerente.trim(), gerenteId: usaGerencia ? f.gerenteId : (inicial?.gerenteId || null),
      coordenador: juntarNomes(nomesDoCampo(f.coordenador)), analista: juntarNomes(nomesDoCampo(f.analista)) });
  }
  return (
    <div className="modal-overlay dialog-overlay" style={{zIndex:1050}} onMouseDown={fecharAoClicarFora(() => JSON.stringify(f) !== original.current, onFechar, "Descartar as alterações deste cliente?")}>
      <div className="modal-box" style={{width:480}}>
        <h3>{inicial ? "Editar cliente" : "Adicionar cliente"}</h3>
        <div className="wizard-q"><label>Razão social</label><input type="text" autoFocus style={{width:"100%"}} value={f.razaoSocial} onChange={e=>setF({...f, razaoSocial:e.target.value})} /></div>
        <div className="wizard-q"><label>CNPJ/CPF</label><input type="text" style={{width:"100%"}} value={f.documento} onChange={e=>setF({...f, documento:e.target.value})} />
          {f.documento && !n.valido && <div className="doc-invalido" style={{fontSize:11, marginTop:3}}>Documento inválido</div>}</div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
          <div className="wizard-q"><label>ID</label><input type="text" style={{width:"100%"}} value={f.codigo} onChange={e=>setF({...f, codigo:e.target.value})} />
            {idRepetido && <div className="doc-invalido" style={{fontSize:11, marginTop:3}}>ID já usado por {idRepetido.razaoSocial || fmtDocumento(idRepetido.documento)}</div>}</div>
          <div className="wizard-q"><label>Grupo (opcional)</label><input type="text" style={{width:"100%"}} value={f.grupo} onChange={e=>setF({...f, grupo:e.target.value})} /></div>
        </div>
        <div className="nav-secao" style={{color:"var(--muted)", marginTop:0}}>Responsáveis</div>
        {usaGerencia ? <>
          <div className="wizard-q"><label>Gerência (gerente) *</label>
            <select style={{width:"100%"}} value={f.gerenteId} disabled={escopo !== "all"} onChange={e=>setF({ ...f, gerenteId: e.target.value })} aria-label="Gerência">
              <option value="">Selecione…</option>
              {gerentes.map(g => <option key={g.id} value={g.id}>{g.nome}</option>)}
            </select>
            {escopo !== "all" && <div className="muted" style={{fontSize:11, marginTop:3}}>Clientes novos entram na sua gerência.</div>}
          </div>
          {[["coordenador", "Coordenador(es)"], ["analista", "Analista(s) responsável(is)"]].map(([campo, label]) => (
            <div className="wizard-q" key={campo}><label>{label}</label>
              <SeletorPessoas valor={f[campo]} onChange={v => setF({ ...f, [campo]: v })}
                opcoes={f.gerenteId ? pessoasDaGerencia(usuariosPainel, gruposPainel, f.gerenteId, campo) : []}
                rotuloVazio={f.gerenteId ? "ninguém disponível nesta gerência" : "escolha a gerência primeiro"} />
            </div>
          ))}
        </> : RESPONSAVEIS.map(([campo, label]) => (
          <div className="wizard-q" key={campo}><label>{label}</label>
            <input type="text" list={"lista-" + campo} style={{width:"100%"}} value={f[campo]} onChange={e=>setF({...f, [campo]:e.target.value})} placeholder={campo === "gerente" ? "" : "vários: separe por vírgula"} />
            <datalist id={"lista-" + campo}>{nomesDe(campo).map(x => <option key={x} value={x} />)}</datalist>
          </div>
        ))}
        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onFechar}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

function ClientesBaseTela({ base, baseCompleta, problemasCliente = {}, vinculoDe, vinculoTodosAnos = {}, onAtualizarBase, onAbrirCronograma, podeEditar = true, gerentes = [], usuariosPainel = [], gruposPainel = [], escopo = "all", usuarioNome = "" }){
  const baseTodos = baseCompleta || base; // para checar duplicidade de CNPJ em qualquer gerência
  const usaGerencia = gerentes.length > 0;
  const nomeGer = id => (gerentes.find(g => g.id === id) || {}).nome || "";
  const [fGer, setFGer] = useState(""); // "" | id do gerente | "__sem"
  const [soMeus, setSoMeus] = useState(false);
  const [gerLote, setGerLote] = useState("");
  const [respLote, setRespLote] = useState(null); // clientes selecionados para editar coordenador/analista
  const [busca, setBusca] = useState("");
  const [selecionados, setSelecionados] = useState(() => new Set());
  const [fAtivo, setFAtivo] = useState("ativos"); // ativos | inativos | todos
  const [filtro, setFiltro] = useState("todos");
  const [analise, setAnalise] = useState(null);
  const [colarAberto, setColarAberto] = useState(false);
  const [txt, setTxt] = useState("");
  const [editando, setEditando] = useState(null); // null | "novo" | registro
  const [fResp, setFResp] = useState(""); // "campo|nome" ou "semAnalista"
  const inputArquivo = useRef(null);
  const termo = normalizar(busca), termoDigitos = soDigitos(busca);
  const nomesPorPapel = RESPONSAVEIS.map(([campo, label]) => [campo, label, [...new Set(base.flatMap(c => nomesDoCampo(c[campo])))].sort((a,b) => a.localeCompare(b, "pt-BR"))]);
  const casaResp = c => {
    if(!fResp) return true;
    if(fResp === "semAnalista") return !c.analista;
    if(fResp === "semUsuario") return !!(problemasCliente[c.id] || []).length;
    const [campo, nome] = fResp.split("|"); return temNome(c[campo], nome);
  };
  const ehMeu = c => !!usuarioNome && RESPONSAVEIS.some(([k]) => temNome(c[k], usuarioNome));
  const lista = base
    .filter(c => fAtivo === "todos" || (fAtivo === "ativos" ? c.ativo !== false : c.ativo === false))
    .filter(c => filtro === "todos" || (filtro === "sem" ? !(vinculoDe[c.id] || []).length : (vinculoDe[c.id] || []).length))
    .filter(casaResp)
    .filter(c => !soMeus || ehMeu(c))
    .filter(c => !fGer || (fGer === "__sem" ? !c.gerenteId : c.gerenteId === fGer))
    .filter(c => !termo || [c.razaoSocial, c.codigo, c.grupo, c.gerente, c.coordenador, c.analista].some(v => normalizar(v).includes(termo)) || (termoDigitos.length >= 3 && c.documento.includes(termoDigitos)))
    .sort((a,b) => (a.razaoSocial||"").localeCompare(b.razaoSocial||"", "pt-BR"));
  const nInativos = base.filter(c => c.ativo === false).length;
  const semCronograma = base.filter(c => c.ativo !== false && !(vinculoDe[c.id] || []).length).length;

  function analisarLinhas(rows){
    let itens = mapearLinhasClientes(rows).map((x, i) => ({ ...x, _linha: i + 1 }));
    if(!itens.length){ ui.alert("Não encontrei nenhuma linha com CNPJ/CPF nessa tabela."); return; }
    let extra = { avisos: [], rejeitados: [] };
    if(usaGerencia){ extra = validarResponsaveisImportacao(itens, { gerentes, usuarios: usuariosPainel, grupos: gruposPainel, escopo }); itens = extra.itens; }
    const a = analisarImportacao(baseTodos, itens);
    if(usaGerencia){
      // Cliente novo precisa de gerente; CNPJ que já existe em OUTRA gerência não pode ser mexido por quem não é Administrador.
      const semGer = a.novos.filter(r => !r.gerente);
      const deOutra = x => escopo !== "all" && x.gerenteId && x.gerenteId !== escopo;
      const bloqAtual = a.atualizados.filter(x => deOutra(x.existente)), bloqIgual = a.iguais.filter(deOutra);
      a.novos = a.novos.filter(r => r.gerente);
      a.atualizados = a.atualizados.filter(x => !bloqAtual.includes(x));
      a.iguais = a.iguais.filter(x => !bloqIgual.includes(x));
      a.invalidos = [...a.invalidos, ...extra.rejeitados,
        ...semGer.map(r => ({ razaoSocial: r.razaoSocial, documentoBruto: fmtDocumento(r.documento), linha: "—", motivo: "Sem gerente — obrigatório para cliente novo" })),
        ...[...bloqAtual.map(x => x.existente), ...bloqIgual].map(c => ({ razaoSocial: c.razaoSocial, documentoBruto: fmtDocumento(c.documento), linha: "—", motivo: "CNPJ já cadastrado em outra gerência" }))];
    }
    setAnalise({ ...a, avisos: extra.avisos });
  }
  async function escolherArquivo(e){
    const arq = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!arq) return;
    try { analisarLinhas(await lerArquivoTabela(arq)); }
    catch(err){ ui.alert("Não consegui ler o arquivo: " + err.message); }
  }
  async function confirmarImportacao(){
    const a = analise; setAnalise(null);
    // Gerência: pelo nome da coluna "Gerente" (casado com os gerentes do painel); quem não é Administrador importa na própria gerência.
    const padrao = escopo !== "all" ? escopo : null;
    const comGerencia = lista => !usaGerencia ? lista : lista.map(c => {
      const gid = (padrao && !c.gerenteId) ? padrao : gerenciaDoCliente(c, gerentes);
      return gid ? { ...c, gerenteId: gid, gerente: nomeGer(gid) } : c;
    });
    const semGer = usaGerencia && !padrao ? a.novos.filter(r => !gerentePorNome(r.gerente, gerentes)).length : 0;
    await onAtualizarBase(b => comGerencia(aplicarImportacao(b, analisarImportacao(b, [...a.novos, ...a.atualizados.map(x => x.novo)].map(r => ({ documentoBruto:r.documento, razaoSocial:r.razaoSocial, codigo:r.codigo, grupo:r.grupo, gerente:r.gerente, coordenador:r.coordenador, analista:r.analista }))))),
      a.novos.length + " cliente(s) importado(s)" + (a.atualizados.length ? ", " + a.atualizados.length + " atualizado(s)" : "") + (semGer ? " · " + semGer + " sem gerência reconhecida (use o filtro \u201cSem gerência\u201d)" : "") + ".");
    setColarAberto(false); setTxt("");
  }
  async function salvarRegistro(reg){
    setEditando(null);
    if(usaGerencia && !reg.gerenteId && escopo !== "all") reg = { ...reg, gerenteId: escopo, gerente: nomeGer(escopo) };
    if(reg.id) await onAtualizarBase(b => b.map(c => c.id === reg.id ? { ...reg, atualizadoEm: new Date().toISOString() } : c), "Cliente atualizado.");
    else await onAtualizarBase(b => [...b, { ...reg, id: novoId("emp"), criadoEm: new Date().toISOString() }], "Cliente adicionado.");
  }
  const nomeCli = c => c.razaoSocial || fmtDocumento(c.documento);
  const descVinculos = l => l.map(x => '"' + x.nome + '" (' + x.ano + ")").join(", ");
  async function remover(c){
    const v = vinculoTodosAnos[c.id] || vinculoDe[c.id] || [];
    if(v.length){
      if(c.ativo === false){ ui.alert('"' + nomeCli(c) + '" tem cronograma vinculado (' + descVinculos(v) + ") e não pode ser excluído. Ele já está inativo — o histórico fica preservado."); return; }
      if(await ui.confirm('"' + nomeCli(c) + '" tem cronograma vinculado (' + descVinculos(v) + ") e não pode ser excluído, para não perder o histórico.\n\nQuer INATIVAR? Ele some da escolha de novos vínculos, mas continua nos cronogramas que já o usam.", { titulo:"Cliente com cronograma", okLabel:"Inativar" }))
        await alterarAtivo([c], false);
      return;
    }
    if(!(await ui.confirm('Remover "' + (c.razaoSocial || fmtDocumento(c.documento)) + '" da base de clientes?', { okLabel:"Remover", perigo:true }))) return;
    await onAtualizarBase(b => b.filter(x => x.id !== c.id), "Cliente removido da base.");
    setSelecionados(s => { const n = new Set(s); n.delete(c.id); return n; });
  }
  // Ativar/inativar (um ou vários). Inativo não aparece para novos vínculos; os vínculos atuais continuam.
  async function alterarAtivo(lista, ativo){
    const ids = new Set(lista.map(c => c.id));
    const agora = new Date().toISOString();
    await onAtualizarBase(b => b.map(c => ids.has(c.id) ? { ...c, ativo, atualizadoEm: agora, ...(ativo ? { inativadoEm: null } : { inativadoEm: agora }) } : c),
      lista.length + " cliente(s) " + (ativo ? "reativado(s)." : "inativado(s)."));
    setSelecionados(new Set());
  }
  // Gerência em lote (Administrador): acerta quem está sem gerência; quem já tem gerência E cronograma não muda.
  async function definirGerenciaLote(){
    if(!gerLote){ ui.alert("Escolha a gerência."); return; }
    const alvo = base.filter(c => selecionados.has(c.id));
    const presos = alvo.filter(c => c.gerenteId && c.gerenteId !== gerLote && (vinculoTodosAnos[c.id] || []).length);
    const ok = alvo.filter(c => !presos.includes(c));
    if(!ok.length){ ui.alert("Nenhum pode mudar: todos já têm gerência e estão vinculados a cronograma. Desvincule antes.", { titulo:"Definir gerência" }); return; }
    if(!(await ui.confirm("Definir a gerência " + nomeGer(gerLote) + " para " + ok.length + " cliente(s)?" + (presos.length ? "\n\n" + presos.length + " ficam como estão (já têm outra gerência e cronograma vinculado)." : ""), { titulo:"Definir gerência", okLabel:"Definir" }))) return;
    const ids = new Set(ok.map(c => c.id));
    await onAtualizarBase(b => b.map(c => ids.has(c.id) ? { ...c, gerenteId: gerLote, gerente: nomeGer(gerLote), atualizadoEm: new Date().toISOString() } : c), "Gerência definida em " + ok.length + " cliente(s).");
    setSelecionados(new Set());
  }
  function abrirResponsaveisLote(){
    const alvo = base.filter(c => selecionados.has(c.id));
    if(usaGerencia){
      if(alvo.some(c => !c.gerenteId)){ ui.alert("Há cliente(s) sem gerência na seleção. Defina a gerência antes (as pessoas vêm da lista da gerência)."); return; }
      const gs = [...new Set(alvo.map(c => c.gerenteId))];
      if(gs.length > 1){ ui.alert("Selecione clientes de uma gerência só (" + gs.map(nomeGer).join(" e ") + " estão misturadas) — as pessoas disponíveis dependem da gerência."); return; }
    }
    setRespLote(alvo);
  }
  async function aplicarResponsaveisLote(mudancas){
    const por = Object.fromEntries(mudancas.map(m => [m.id, m]));
    const agora = new Date().toISOString();
    setRespLote(null);
    await onAtualizarBase(b => b.map(c => por[c.id] ? { ...c, coordenador: por[c.id].coordenador, analista: por[c.id].analista, atualizadoEm: agora } : c),
      "Responsáveis alterados em " + mudancas.length + " cliente(s).");
    setSelecionados(new Set());
  }
  // Excluir em lote: só os que não estão em nenhum cronograma (qualquer ano); os vinculados são listados e ficam.
  async function removerSelecionados(){
    const alvo = base.filter(c => selecionados.has(c.id));
    if(!alvo.length) return;
    const vinculados = alvo.filter(c => (vinculoTodosAnos[c.id] || vinculoDe[c.id] || []).length);
    const livres = alvo.filter(c => !vinculados.includes(c));
    if(!livres.length){
      const paraInativar = vinculados.filter(c => c.ativo !== false);
      if(paraInativar.length && await ui.confirm("Nenhum dos " + alvo.length + " selecionado(s) pode ser excluído: todos têm cronograma vinculado (o histórico seria perdido).\n\nQuer INATIVAR os " + paraInativar.length + " que ainda estão ativos?", { titulo:"Excluir em lote", okLabel:"Inativar " + paraInativar.length }))
        await alterarAtivo(paraInativar, false);
      else if(!paraInativar.length) ui.alert("Nenhum dos selecionados pode ser excluído: todos têm cronograma vinculado (e já estão inativos).", { titulo:"Excluir em lote" });
      return;
    }
    const lista = l => l.slice(0, 8).map(c => "• " + nomeCli(c)).join("\n") + (l.length > 8 ? "\n… e mais " + (l.length - 8) : "");
    const ok = await ui.confirm("Remover " + livres.length + " cliente(s) da base?\n\n" + lista(livres) +
      (vinculados.length ? "\n\n" + vinculados.length + " ficam (têm cronograma — se quiser, use \u201cInativar selecionados\u201d):\n" + vinculados.slice(0, 8).map(c => "• " + nomeCli(c) + " → " + descVinculos(vinculoTodosAnos[c.id] || vinculoDe[c.id])).join("\n") + (vinculados.length > 8 ? "\n… e mais " + (vinculados.length - 8) : "") : ""),
      { titulo:"Excluir em lote", okLabel:"Remover " + livres.length, perigo:true });
    if(!ok) return;
    const ids = new Set(livres.map(c => c.id));
    await onAtualizarBase(b => b.filter(x => !ids.has(x.id)), livres.length + " cliente(s) removido(s) da base.");
    setSelecionados(new Set());
  }

  return (
    <div style={{paddingTop:24}}>
      <div className="topbar">
        <div>
          <h2>🏢 Base de clientes</h2>
          <div className="sub">{base.length - nInativos} cliente(s) ativo(s){nInativos ? " · " + nInativos + " inativo(s)" : ""} · {semCronograma} ativo(s) sem cronograma. Um CNPJ pertence a um cronograma só; o vínculo é feito no cronograma.</div>
        </div>
        {podeEditar ? <div className="toolbar">
          <input ref={inputArquivo} type="file" accept=".xlsx,.csv,.txt" style={{display:"none"}} onChange={escolherArquivo} />
          <button className="btn btn-primary" onClick={()=>inputArquivo.current.click()}>⬆ Importar planilha (.xlsx / .csv)</button>
          <button className="btn btn-outline" onClick={()=>setColarAberto(!colarAberto)}>Colar do Excel</button>
          <button className="btn btn-outline" onClick={()=>setEditando("novo")}>+ Adicionar</button>
          <button className="btn btn-outline" onClick={()=>baixarModeloPlanilha().catch(e=>ui.alert(e.message))}>Baixar planilha modelo</button>
        </div> : <span className="muted">Somente leitura — seu grupo não edita a base de clientes.</span>}
      </div>

      {colarAberto && (
        <div className="card">
          <h3>Colar do Excel</h3>
          <p className="muted" style={{marginTop:0}}>Selecione as colunas no Excel (de preferência com o cabeçalho: ID, Razão social, CNPJ, Grupo, Gerente, Coordenador, Analista), copie e cole aqui. Sem cabeçalho também funciona: a coluna do CNPJ é detectada pelo conteúdo. Célula vazia não apaga o que já está na base.</p>
          <textarea rows={8} value={txt} onChange={e=>setTxt(e.target.value)} placeholder={"ID\tRazão social\tCNPJ\tGerente\tCoordenador\tAnalista\n1001\tEmpresa A Ltda\t11.222.333/0001-81\tMaria\tJoão\tAna"} />
          <div style={{marginTop:8}}><button className="btn btn-primary" disabled={!txt.trim()} onClick={()=>analisarLinhas(parseTabelaTexto(txt))}>Conferir antes de importar</button></div>
        </div>
      )}

      <div className="card">
        <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginBottom:10}}>
          <input type="search" placeholder="Buscar por nome, CNPJ, ID, grupo ou responsável…" value={busca} onChange={e=>setBusca(e.target.value)} style={{flex:1, minWidth:220}} />
          <select value={fAtivo} onChange={e=>setFAtivo(e.target.value)} aria-label="Ativos ou inativos">
            <option value="ativos">Ativos</option>
            <option value="inativos">Inativos ({nInativos})</option>
            <option value="todos">Ativos e inativos</option>
          </select>
          <select value={filtro} onChange={e=>setFiltro(e.target.value)} aria-label="Filtrar por cronograma">
            <option value="todos">Todos</option>
            <option value="sem">Sem cronograma</option>
            <option value="com">Com cronograma</option>
          </select>
          {usaGerencia && escopo === "all" && <select value={fGer} onChange={e=>setFGer(e.target.value)} aria-label="Filtrar por gerência">
            <option value="">Todas as gerências</option>
            {gerentes.map(g => <option key={g.id} value={g.id}>Gerência {g.nome}</option>)}
            <option value="__sem">⚠ Sem gerência ({base.filter(c => !c.gerenteId).length})</option>
          </select>}
          <label className="muted chk" title="Clientes em que você é gerente, coordenador ou analista"><input type="checkbox" checked={soMeus} disabled={!usuarioNome} onChange={e=>setSoMeus(e.target.checked)} /> Meus clientes</label>
          <select value={fResp} onChange={e=>setFResp(e.target.value)} aria-label="Filtrar por responsável">
            <option value="">Todos os responsáveis</option>
            <option value="semAnalista">Sem analista definido</option>
            {usaGerencia && <option value="semUsuario">⚠ Responsável sem usuário ({base.filter(c => (problemasCliente[c.id] || []).length).length})</option>}
            {nomesPorPapel.map(([campo, label, nomes]) => nomes.length > 0 && (
              <optgroup key={campo} label={label}>{nomes.map(n => <option key={n} value={campo + "|" + n}>{n}</option>)}</optgroup>
            ))}
          </select>
          <span className="muted">{lista.length} na lista</span>
        </div>
        {podeEditar && selecionados.size > 0 && (
          <div className="note" style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap", marginBottom:10}}>
            <strong>{selecionados.size} selecionado(s)</strong>
            <button className="btn btn-sm btn-outline" onClick={()=>alterarAtivo(base.filter(c => selecionados.has(c.id) && c.ativo !== false), false)} disabled={!base.some(c => selecionados.has(c.id) && c.ativo !== false)}>⏸ Inativar selecionados</button>
            <button className="btn btn-sm btn-outline" onClick={()=>alterarAtivo(base.filter(c => selecionados.has(c.id) && c.ativo === false), true)} disabled={!base.some(c => selecionados.has(c.id) && c.ativo === false)}>▶ Reativar selecionados</button>
            {usaGerencia && escopo === "all" && <span style={{display:"inline-flex", gap:4, alignItems:"center"}}>
              <select value={gerLote} onChange={e=>setGerLote(e.target.value)} aria-label="Gerência para os selecionados">
                <option value="">Gerência…</option>
                {gerentes.map(g => <option key={g.id} value={g.id}>{g.nome}</option>)}
              </select>
              <button className="btn btn-sm btn-outline" onClick={definirGerenciaLote}>Definir gerência</button>
            </span>}
            <button className="btn btn-sm btn-outline" onClick={abrirResponsaveisLote}>✎ Coordenador/analista</button>
            <button className="btn btn-sm btn-danger" onClick={removerSelecionados}>🗑 Excluir selecionados</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>setSelecionados(new Set())}>Limpar seleção</button>
            <span className="muted">Quem tem cronograma (qualquer ano) não é excluído — use Inativar para manter o histórico.</span>
          </div>
        )}
        {!base.length ? (
          <div className="muted" style={{padding:"20px 0"}}>A base está vazia. Importe a planilha com seus CNPJs (botão acima) — dá pra usar a <button className="link-btn" onClick={()=>baixarModeloPlanilha()}>planilha modelo</button> ou a sua própria, desde que tenha uma coluna de CNPJ.</div>
        ) : (
          <div className="table-wrap"><table>
            <thead><tr>{podeEditar && <th style={{width:34}}>
              <input type="checkbox" aria-label="Selecionar todos da lista" checked={lista.length > 0 && lista.every(c => selecionados.has(c.id))}
                onChange={e => setSelecionados(s => { const n = new Set(s); lista.forEach(c => e.target.checked ? n.add(c.id) : n.delete(c.id)); return n; })} />
            </th>}<th>Razão social</th><th>CNPJ/CPF</th><th>ID</th><th>Grupo</th><th>Responsáveis</th><th>Cronograma</th><th style={{width:120}}></th></tr></thead>
            <tbody>
              {lista.map(c => {
                const v = vinculoDe[c.id] || [];
                const valido = normalizarDocumento(c.documento).valido;
                return (
                  <tr key={c.id}>
                    {podeEditar && <td><input type="checkbox" aria-label={"Selecionar " + nomeCli(c)} checked={selecionados.has(c.id)}
                      onChange={e => setSelecionados(s => { const n = new Set(s); e.target.checked ? n.add(c.id) : n.delete(c.id); return n; })} /></td>}
                    <td style={{whiteSpace:"normal"}}>{c.razaoSocial || "—"}{c.ativo === false && <> <span className="badge badge-off" title={c.inativadoEm ? "Inativado em " + fmtHora(c.inativadoEm) : "Inativo"}>inativo</span></>}</td>
                    <td className={valido ? "" : "doc-invalido"} title={valido ? "" : "Documento inválido"}>{fmtDocumento(c.documento)}</td>
                    <td>{c.codigo || "—"}</td>
                    <td>{c.grupo || "—"}</td>
                    <td style={{whiteSpace:"normal", fontSize:12.5, lineHeight:1.45}}>
                      {(problemasCliente[c.id] || []).length > 0 && <div><span className="badge badge-alerta" style={{whiteSpace:"normal"}} title="Não bate com nenhum usuário do painel — edite o cliente">⚠ {problemasCliente[c.id].join("; ")}</span></div>}
                      {RESPONSAVEIS.some(([k]) => c[k]) ? RESPONSAVEIS.map(([k, label]) => c[k] && <div key={k}><span className="muted">{label.replace(" responsável", "")}:</span> {c[k]}</div>) : (!usaGerencia || c.gerenteId) && <span className="muted">—</span>}
                    </td>
                    <td>{v.length ? v.map(x => <button key={x.id} className="link-btn" onClick={()=>onAbrirCronograma(x.id)}>{x.nome}</button>) : <span className="muted">—</span>}
                      {v.length > 1 && <span className="alerta" title="Vinculado a mais de um cronograma"> ⚠</span>}</td>
                    <td>{podeEditar && <>
                      <button className="btn btn-sm btn-ghost" onClick={()=>setEditando(c)} aria-label="Editar" title="Editar">✎</button>{" "}
                      <button className="btn btn-sm btn-ghost" onClick={()=>alterarAtivo([c], c.ativo === false)} aria-label={c.ativo === false ? "Reativar" : "Inativar"} title={c.ativo === false ? "Reativar" : "Inativar (mantém o histórico)"}>{c.ativo === false ? "▶" : "⏸"}</button>{" "}
                      <button className="btn btn-sm btn-ghost" onClick={()=>remover(c)} aria-label="Remover" title="Excluir da base">🗑</button>
                    </>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table></div>
        )}
      </div>

      {analise && <ImportarClientesModal analise={analise} onFechar={()=>setAnalise(null)} onConfirmar={confirmarImportacao} />}
      {respLote && (() => {
        const gid = usaGerencia ? respLote[0].gerenteId : null;
        const nomesBase = campo => [...new Set(baseTodos.flatMap(c => nomesDoCampo(c[campo])))].sort((a,b) => a.localeCompare(b, "pt-BR"));
        return <ResponsaveisLoteModal clientes={respLote}
          opcoesPorCampo={{ coordenador: gid ? pessoasDaGerencia(usuariosPainel, gruposPainel, gid, "coordenador") : nomesBase("coordenador"),
                            analista: gid ? pessoasDaGerencia(usuariosPainel, gruposPainel, gid, "analista") : nomesBase("analista") }}
          rotuloGerencia={gid ? "Gerência " + nomeGer(gid) + " — só pessoas desta gerência no painel." : ""}
          onAplicar={aplicarResponsaveisLote} onFechar={()=>setRespLote(null)} />;
      })()}
      {editando && <ClienteBaseForm inicial={editando === "novo" ? null : editando} base={baseTodos} onFechar={()=>setEditando(null)} onSalvar={salvarRegistro}
        gerentes={gerentes} usuariosPainel={usuariosPainel} gruposPainel={gruposPainel} escopo={escopo} vinculado={editando !== "novo" && !!(vinculoTodosAnos[editando.id] || []).length} />}
    </div>
  );
}

/* ---------- Administração de Modelos ---------- */
// Página "⚙ Modelos" (#/<ano>/modelos). Edita um rascunho; nada grava até "Salvar Modelos" (revisão + confirmação).
// Modelo de TODA A EMPRESA (gerenteId vazio) ou de UMA GERÊNCIA (gerenteId = gerente do painel). Quem não é
// Administrador edita só os da própria gerência; os da empresa ficam só leitura (dá para Duplicar para a gerência).
// Modelo em uso em algum cronograma não é removido — só inativado (some do "Novo cronograma").
function ModeloAdmin({ modelos, versoes, podeRestaurar, onSalvar, ano: anoTrabalho, podeEditarModelo = () => true, gerentes = [], escopo = "all", usoModelos = {}, lotes = [], onDesfazerLote }){
  const usaGerencia = gerentes.length > 0;
  const nomeGer = id => (gerentes.find(g => g.id === id) || {}).nome || "";
  const visivel = m => !usaGerencia || escopo === "all" || !m.gerenteId || m.gerenteId === escopo;
  const rotuloAbr = m => !usaGerencia ? "" : (m.gerenteId ? "Gerência " + nomeGer(m.gerenteId) : "Toda a empresa");
  const [verVersoes, setVerVersoes] = useState(false);
  const [restaurados, setRestaurados] = useState({}); // modeloId → motivo (vai para o histórico ao salvar)
  const [original, setOriginal] = useState(() => JSON.stringify(modelos));
  const [rascunho, setRascunho] = useState(() => clonar(modelos));
  const primeiroVisivel = lista => (lista.find(visivel) || {}).id || "";
  const [modeloId, setModeloId] = useState(() => primeiroVisivel(modelos));
  const [revisao, setRevisao] = useState(null); // passo 1 da gravação
  const ano = anoTrabalho || new Date().getFullYear() + 1;
  const [mesReferencia, setMesReferencia] = useState(1);
  const modelo = rascunho.find(m => m.id === modeloId);
  const podeEditarEste = !!modelo && podeEditarModelo(modelo);
  const sujo = JSON.stringify(rascunho) !== original;
  const visiveis = rascunho.filter(visivel);

  // Modelos gravados (depois de salvar, ou carregados depois de abrir a página): vira o novo ponto de partida.
  useEffect(() => {
    setOriginal(JSON.stringify(modelos)); setRascunho(clonar(modelos)); setRestaurados({});
    setModeloId(id => modelos.some(m => m.id === id && visivel(m)) ? id : primeiroVisivel(modelos));
  }, [modelos]);
  // Sair da página com alterações não salvas pede confirmação (links do menu e fechar/recarregar a aba).
  useEffect(() => {
    if(!sujo) return;
    const aoClicar = async e => {
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if(!a) return;
      e.preventDefault(); e.stopPropagation();
      if(await ui.confirm("Você tem alterações não salvas nos Modelos. Sair sem salvar?", { okLabel:"Sair sem salvar", perigo:true })) window.location.hash = a.getAttribute("href");
    };
    const aoSair = e => { e.preventDefault(); e.returnValue = ""; };
    document.addEventListener("click", aoClicar, true);
    window.addEventListener("beforeunload", aoSair);
    return () => { document.removeEventListener("click", aoClicar, true); window.removeEventListener("beforeunload", aoSair); };
  }, [sujo]);
  async function descartar(){
    if(!(await ui.confirm("Descartar todas as alterações ainda não salvas nos Modelos?", { okLabel:"Descartar", perigo:true }))) return;
    const o = JSON.parse(original);
    setRascunho(o); setRestaurados({});
    setModeloId(id => o.some(m => m.id === id && visivel(m)) ? id : primeiroVisivel(o));
  }
  function updateModelo(patch){ if(!podeEditarEste) return; setRascunho(r => r.map(m => m.id===modeloId ? {...m, ...patch} : m)); }
  function updateProcesso(processoId, novoProcesso){
    if(!podeEditarEste) return;
    setRascunho(r => r.map(m => m.id===modeloId ? { ...m, processos: m.processos.map(p=>p.id===processoId?novoProcesso:p) } : m));
  }
  const gerenciaNova = () => escopo !== "all" ? escopo : null;
  async function novoModelo(){
    const m0 = { id:novoId("modelo"), nome:"", processos: [], gerenteId: gerenciaNova(), ativo: true };
    if(!podeEditarModelo(m0)){ ui.alert("Seu grupo de acesso não cria Modelos."); return; }
    const nome = await ui.prompt("Nome do novo Modelo" + (usaGerencia ? " (" + rotuloAbr(m0) + ")" : "") + ":", "", { titulo:"Novo Modelo" }); if(!nome) return;
    const m = { ...m0, nome: nome.trim() };
    setRascunho([...rascunho, m]); setModeloId(m.id);
  }
  function duplicarModelo(){
    if(!modelo) return;
    const { versaoPadrao, criadoDe, ...resto } = clonar(modelo);
    const copia = { ...resto, id:novoId("modelo"), nome: modelo.nome + " (cópia)", gerenteId: escopo !== "all" ? escopo : (modelo.gerenteId || null), ativo: true };
    if(!podeEditarModelo(copia)){ ui.alert("Seu grupo de acesso não cria Modelos."); return; }
    setRascunho([...rascunho, copia]); setModeloId(copia.id);
  }
  async function removerModelo(){
    if(!podeEditarEste) return;
    const n = usoModelos[modelo.id] || 0;
    if(n > 0){
      if(modelo.ativo === false){ ui.alert('"' + modelo.nome + '" está em uso em ' + n + " cronograma(s) e já está inativo. Modelo usado não pode ser removido."); return; }
      if(await ui.confirm('"' + modelo.nome + '" já foi usado em ' + n + " cronograma(s), por isso não pode ser removido.\n\nQuer INATIVAR? Ele some das opções do Novo cronograma; os cronogramas que já o usam continuam iguais.", { titulo:"Modelo em uso", okLabel:"Inativar" }))
        updateModelo({ ativo: false });
      return;
    }
    if(visiveis.filter(m => m.ativo !== false).length <= 1){ ui.alert("Precisa existir ao menos um Modelo ativo."); return; }
    if(!(await ui.confirm('Remover o Modelo "' + modelo.nome + '"? Ele não está em uso em nenhum cronograma.', { okLabel:"Remover", perigo:true }))) return;
    const restante = rascunho.filter(m => m.id !== modeloId);
    setRascunho(restante); setModeloId(primeiroVisivel(restante));
  }
  async function adicionarProcesso(){
    const nome = await ui.prompt("Nome do novo processo:", "", { titulo:"Novo processo" }); if(!nome) return;
    const novo = { id:novoId("proc"), nome, ativo:true, frequencia:{tipo:"mensal"},
      eventos:[{ id:novoId("ev"), nome:"Nova tarefa", responsavel:"SINERGY", ativo:true, bloqueada:false, excecoes:{}, regra:{tipo:"dia_fixo", dia:10, ajuste:"next"} }] };
    updateModelo({ processos:[...modelo.processos, novo] });
  }
  async function removerProcesso(pid){
    if(!(await ui.confirm("Remover este processo inteiro do Modelo?", { okLabel:"Remover", perigo:true }))) return;
    updateModelo({ processos: modelo.processos.filter(p=>p.id!==pid) });
  }
  // Gravar — passo 1: revisar tudo o que mudou (e o que está em uso). Passo 2: confirmação final.
  async function salvar(){
    const orig = JSON.parse(original);
    // Só vai para a gravação o que esta pessoa pode editar; o resto fica exatamente como estava.
    let lista = rascunho.map(m => podeEditarModelo(m) ? m : (orig.find(o => o.id === m.id) || m))
      .concat(orig.filter(o => !podeEditarModelo(o) && !rascunho.some(m => m.id === o.id)));
    const renomes = renomesEntreModelos(orig, lista);
    if(renomes.length){
      const outros = lista.filter(podeEditarModelo);
      const r = renomearTarefas([].concat(...outros.map(m => m.processos)), renomes);
      if(r.n){
        const txt = renomes.map(x => "• \"" + x.de + "\" → \"" + x.para + "\"").join("\n");
        if(await ui.confirm("Você renomeou tarefa(s):\n" + txt + "\n\nAplicar o mesmo nome nos outros Modelos que você pode editar e que ainda têm essa tarefa com o nome antigo (" + r.n + " tarefa(s))?", { titulo:"Renomear nos Modelos", okLabel:"Aplicar nos Modelos", cancelLabel:"Só neste" }))
          lista = lista.map(m => podeEditarModelo(m) ? { ...m, processos: renomearTarefas(m.processos, renomes).processos } : m);
      }
    }
    const itens = [];
    lista.forEach(m => {
      const o = orig.find(x => x.id === m.id);
      if(!o){ itens.push({ nome: m.nome, linhas: ["Modelo novo" + (usaGerencia ? " (" + rotuloAbr(m) + ")" : "") + " com " + m.processos.length + " processo(s)."], uso: 0 }); return; }
      const linhas = diffClientes(o, m).map(l => l.replace(/^Nome do cronograma/, "Nome do Modelo"));
      if((o.ativo !== false) !== (m.ativo !== false)) linhas.push(m.ativo === false ? "Inativado (some do Novo cronograma)." : "Reativado.");
      if((o.gerenteId || null) !== (m.gerenteId || null)) linhas.push("Abrangência: " + rotuloAbr(o) + " → " + rotuloAbr(m) + ".");
      if(linhas.length) itens.push({ nome: m.nome, linhas, uso: usoModelos[m.id] || 0 });
    });
    orig.filter(o => !lista.some(m => m.id === o.id)).forEach(o => itens.push({ nome: o.nome, linhas: ["Modelo removido."], uso: 0 }));
    if(!itens.length){ ui.alert("Nada mudou nos Modelos que você pode editar."); return; }
    setRevisao({ lista, renomes, itens });
  }
  async function confirmarGravacao(){
    const r = revisao;
    const emUso = r.itens.filter(i => i.uso > 0);
    if(!(await ui.confirm("Gravar as alterações em " + r.itens.length + " Modelo(s)?" +
      (emUso.length ? "\n\n" + emUso.length + " deles estão em uso em cronogramas — esses cronogramas NÃO mudam agora. Para levar as mudanças a eles, use “Aplicar Modelo atualizado” (você escolhe quais, e dá para desfazer)." : "") +
      "\n\nCada Modelo alterado ganha uma versão no histórico (🕘 Versões).", { titulo:"Confirmar gravação (2 de 2)", okLabel:"Gravar Modelos", perigo:true }))) return;
    setRevisao(null);
    onSalvar(r.lista, r.renomes, restaurados);
  }

  const acoes = <>
    {sujo ? <span className="dirty">● alterações não salvas</span> : <span className="muted">✓ tudo salvo</span>}
    <button className="btn btn-ghost" onClick={descartar} disabled={!sujo}>Descartar alterações</button>
    <button className="btn btn-primary" onClick={salvar} disabled={!sujo}>Salvar Modelos…</button>
  </>;
  const uso = modelo ? (usoModelos[modelo.id] || 0) : 0;
  return (
    <div style={{paddingTop:20}}>
      <div className="topbar">
        <div>
          <h2>⚙ Modelos</h2>
          <div className="sub">Tarefas-padrão usadas nos cronogramas novos. Tarefas marcadas como <strong>🔒 padrão</strong> não podem ser renomeadas nem excluídas dentro do cronograma de um cliente — só o prazo continua livre. Nada é gravado até você clicar em <strong>Salvar Modelos</strong> (com revisão e confirmação).{usaGerencia && escopo !== "all" ? " Você edita os Modelos da sua gerência; os de toda a empresa ficam só para consulta (dá para Duplicar)." : ""}</div>
        </div>
        <div className="toolbar" style={{alignItems:"center"}}>{acoes}</div>
      </div>
      <div className="card">
        <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
          <select value={modeloId} onChange={e=>setModeloId(e.target.value)} aria-label="Modelo">
            {visiveis.map(m => <option key={m.id} value={m.id}>{m.nome}{m.ativo === false ? " (inativo)" : ""}{usaGerencia ? " · " + rotuloAbr(m) : ""}</option>)}
          </select>
          <input type="text" style={{width:220}} value={modelo?.nome||""} disabled={!podeEditarEste} onChange={e=>updateModelo({nome:e.target.value})} aria-label="Nome do Modelo" />
          <button className="btn btn-sm btn-outline" onClick={novoModelo}>+ Novo Modelo</button>
          <button className="btn btn-sm btn-outline" onClick={duplicarModelo} title={usaGerencia && escopo !== "all" ? "Cria uma cópia na sua gerência" : ""}>Duplicar</button>
          {podeEditarEste && <button className="btn btn-sm btn-ghost" onClick={removerModelo}>{uso ? "Inativar…" : "Remover Modelo"}</button>}
          <button className="btn btn-sm btn-outline" onClick={()=>setVerVersoes(v => !v)} aria-expanded={verVersoes}>🕘 Versões ({(versoes || []).filter(v => v.modeloId === modeloId).length})</button>
          <span style={{marginLeft:"auto"}} className="muted">Competência da prévia:</span>
          <select value={mesReferencia} onChange={e=>setMesReferencia(Number(e.target.value))}>
            {MESES_LONGOS.map((m,i) => <option key={m} value={i+1}>{m}/{ano}</option>)}
          </select>
        </div>
        {modelo && <div style={{display:"flex", gap:12, alignItems:"center", flexWrap:"wrap", marginTop:10}}>
          <span className="badge badge-months" title="Versões de cronogramas (qualquer ano) criadas a partir deste Modelo">{uso ? "em uso em " + uso + " cronograma(s)" : "sem uso"}</span>
          {usaGerencia && (escopo === "all" && podeEditarEste
            ? <label className="muted" style={{display:"flex", gap:6, alignItems:"center"}}>Abrangência:
                <select value={modelo.gerenteId || ""} onChange={e=>updateModelo({ gerenteId: e.target.value || null })} aria-label="Abrangência do Modelo">
                  <option value="">Toda a empresa</option>
                  {gerentes.map(g => <option key={g.id} value={g.id}>Gerência {g.nome}</option>)}
                </select></label>
            : <span className="muted">{rotuloAbr(modelo)}</span>)}
          {podeEditarEste && <label className="muted chk" title="Inativo = não aparece no Novo cronograma; quem já usa continua igual">
            <input type="checkbox" checked={modelo.ativo !== false} onChange={e=>updateModelo({ ativo: e.target.checked })} /> ativo para novos cronogramas</label>}
          {!podeEditarEste && <span className="note-info" style={{padding:"4px 10px", borderRadius:8, fontSize:12.5}}>Só leitura para você{usaGerencia && !modelo.gerenteId ? " (Modelo de toda a empresa)" : ""} — use <strong>Duplicar</strong> para criar um da sua gerência.</span>}
        </div>}
      </div>

      {lotes.length > 0 && (
        <details className="card">
          <summary style={{cursor:"pointer", fontWeight:700}}>Aplicações recentes em cronogramas ({lotes.length}) — dá para desfazer</summary>
          <div className="table-wrap" style={{marginTop:10}}><table><thead><tr><th>Quando</th><th>Quem</th><th>O que</th><th>Cronogramas</th><th></th></tr></thead>
            <tbody>{lotes.map(l => (
              <tr key={l.id}>
                <td>{fmtHora(l.em)}</td><td>{l.por || "—"}</td><td style={{whiteSpace:"normal"}}>{l.descricao}</td>
                <td style={{whiteSpace:"normal"}} title={l.itens.map(i => i.nome).join("\n")}>{l.itens.length}: {l.itens.slice(0, 3).map(i => i.nome).join(", ")}{l.itens.length > 3 ? "…" : ""}</td>
                <td>{l.desfeitoEm ? <span className="muted">desfeito em {fmtHora(l.desfeitoEm)}</span> : podeRestaurar ? <button className="link-btn perigo" onClick={()=>onDesfazerLote(l)}>desfazer</button> : <span className="muted">—</span>}</td>
              </tr>
            ))}</tbody></table></div>
        </details>
      )}

        {verVersoes && modelo && (() => {
          const lista = (versoes || []).filter(v => v.modeloId === modeloId).sort((a,b) => b.n - a.n);
          return (
            <div className="card" style={{background:"var(--surface2)"}}>
              <h3 style={{marginTop:0}}>Versões de "{modelo.nome}"</h3>
              <p className="muted" style={{marginTop:0}}>Cada “Salvar Modelos” guarda uma versão de cada Modelo que mudou (últimas {MAX_VERSOES_POR_MODELO}). Restaurar carrega a versão aqui na tela — confira e clique em <strong>Salvar Modelos</strong> para gravar.{podeRestaurar ? "" : " Restaurar é só para Coordenador para cima."}</p>
              {!lista.length ? <div className="muted">Nenhuma versão ainda — a primeira é criada no próximo salvamento.</div> : (
                <div className="table-wrap"><table><tbody>{lista.map(v => (
                  <tr key={v.id}>
                    <td style={{width:50}}><strong>v{v.n}</strong></td>
                    <td style={{whiteSpace:"normal"}}>{v.em ? fmtHora(v.em) : "antes do histórico"}{v.por ? " · " + v.por : ""}{v.motivo ? " — " + v.motivo : ""}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      <button className="link-btn" onClick={()=>{
                        const d = diffClientes(v.modelo, modelo);
                        ui.alert(d.length ? "Da v" + v.n + " para o que está na tela:\n\n• " + d.slice(0, 40).join("\n• ") + (d.length > 40 ? "\n… e mais " + (d.length - 40) : "") : "O que está na tela é igual à v" + v.n + ".", { titulo:"Comparar com a v" + v.n });
                      }}>comparar com a tela</button>
                      {podeRestaurar && podeEditarEste && <>{" · "}<button className="link-btn perigo" onClick={async ()=>{
                        if(!(await ui.confirm("Carregar a v" + v.n + ' de "' + modelo.nome + '" na tela? Nada é gravado até você clicar em Salvar Modelos.', { okLabel:"Carregar v" + v.n }))) return;
                        setRascunho(r => r.map(m => m.id === modeloId ? { ...clonar(v.modelo), id: modeloId } : m));
                        setRestaurados(x => ({ ...x, [modeloId]: "restaurada a v" + v.n }));
                      }}>restaurar</button></>}
                    </td>
                  </tr>
                ))}</tbody></table></div>
              )}
            </div>
          );
        })()}
        {modelo && modelo.processos.map(processo => (
          <ProcessoCard key={modelo.id + ":" + processo.id} processo={processo} todosProcessos={modelo.processos} modo="modelo" ano={ano} mesReferencia={mesReferencia}
            somenteLeitura={!podeEditarEste}
            onUpdate={(novo)=>updateProcesso(processo.id, novo)} onDesdobrar={()=>{}}
            acoesExtras={podeEditarEste ? <button className="btn btn-sm btn-ghost" onClick={()=>removerProcesso(processo.id)}>Remover processo</button> : null} />
        ))}
        {modelo && podeEditarEste && <button className="btn btn-sm btn-outline" onClick={adicionarProcesso}>+ Novo processo no Modelo</button>}

        <div className="wizard-actions" style={{alignItems:"center"}}>{acoes}</div>

      {revisao && (
        <div className="modal-overlay dialog-overlay" onMouseDown={fecharAoClicarFora(false, () => setRevisao(null))}>
          <div className="modal-box" style={{width:720}}>
            <h3>Revisar alterações nos Modelos (1 de 2)</h3>
            <p className="muted" style={{marginTop:0}}>Confira o que vai ser gravado. Os cronogramas que já existem não mudam nesta etapa.</p>
            <div className="pick-list" style={{padding:"8px 12px"}}>
              {revisao.itens.map((it, i) => (
                <div key={i} style={{marginBottom:12}}>
                  <strong>{it.nome}</strong>{it.uso > 0 && <span className="badge badge-alerta" style={{marginLeft:8}}>em uso em {it.uso} cronograma(s)</span>}
                  <ul style={{margin:"4px 0 0", paddingLeft:18}}>{it.linhas.slice(0, 30).map((l, j) => <li key={j} style={{fontSize:13}}>{l}</li>)}{it.linhas.length > 30 && <li className="muted">… e mais {it.linhas.length - 30}</li>}</ul>
                </div>
              ))}
            </div>
            <div className="wizard-actions">
              <button className="btn btn-ghost" onClick={()=>setRevisao(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={confirmarGravacao}>Continuar →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Lixeira de cronogramas (15 dias). Restaurar e excluir definitivamente: permissão "lixeira".
function LixeiraTela({ itens, nomeGerente, usaGerencia, onRestaurar, onExcluir }){
  const [sel, setSel] = useState(() => new Set());
  const ordenados = itens.slice().sort((a,b) => (a.excluido.em < b.excluido.em ? 1 : -1));
  const alternar = id => setSel(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  return (
    <div style={{paddingTop:20}}>
      <div className="topbar">
        <div>
          <h2>🗑 Lixeira</h2>
          <div className="sub">Cronogramas excluídos ficam aqui por {LIXEIRA_DIAS} dias e depois são apagados de vez, sozinhos. Enquanto estão aqui, os clientes deles ficam livres para outro cronograma.</div>
        </div>
        {sel.size > 0 && <div className="toolbar">
          <button className="btn btn-danger" onClick={async ()=>{ await onExcluir([...sel]); setSel(new Set()); }}>Excluir definitivamente ({sel.size})</button>
        </div>}
      </div>
      <div className="card">
        {!ordenados.length ? <div className="muted">A lixeira está vazia.</div> : (
          <div className="table-wrap"><table className="tabela-lista">
            <thead><tr><th style={{width:34}}><input type="checkbox" aria-label="Selecionar todos" checked={ordenados.every(c => sel.has(c.id))} onChange={e => setSel(e.target.checked ? new Set(ordenados.map(c => c.id)) : new Set())} /></th>
              <th>Cronograma</th>{usaGerencia && <th>Gerência</th>}<th>Anos</th><th>Excluído</th><th>Apagado de vez em</th><th></th></tr></thead>
            <tbody>{ordenados.map(c => {
              const dias = diasRestantesLixeira(c.excluido);
              return (
                <tr key={c.id}>
                  <td><input type="checkbox" checked={sel.has(c.id)} onChange={()=>alternar(c.id)} aria-label={"Selecionar " + c.nome} /></td>
                  <td style={{whiteSpace:"normal"}}><strong>{c.nome}</strong></td>
                  {usaGerencia && <td>{nomeGerente(c.gerenteId) || "—"}</td>}
                  <td>{(c.anos || []).join(", ") || "—"}</td>
                  <td>{fmtHora(c.excluido.em)}{c.excluido.por ? " · " + c.excluido.por : ""}</td>
                  <td><span className={dias <= 3 ? "alerta" : ""}>{dias} dia(s)</span></td>
                  <td style={{whiteSpace:"nowrap"}}>
                    <button className="btn btn-sm btn-primary" onClick={()=>onRestaurar(c.id)}>Restaurar</button>{" "}
                    <button className="btn btn-sm btn-ghost" onClick={()=>onExcluir([c.id])}>Excluir de vez</button>
                  </td>
                </tr>
              );
            })}</tbody>
          </table></div>
        )}
      </div>
    </div>
  );
}
// Escolher em quais cronogramas aplicar uma mudança vinda do Modelo (renomear / aplicar Modelo atualizado).
// Passo 1: marcar; passo 2: confirmação final. Antes de mudar, cada um ganha uma versão de segurança e a
// operação fica em Modelos → "Aplicações recentes" (com Desfazer).
function LoteCronogramasModal({ titulo, descricao, itens, okLabel, onAplicar, onCancelar }){
  const [sel, setSel] = useState(() => new Set(itens.filter(i => !i.bloqueado).map(i => i.id)));
  const livres = itens.filter(i => !i.bloqueado);
  const alternar = id => setSel(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  async function aplicar(){
    const escolhidos = itens.filter(i => sel.has(i.id));
    if(!escolhidos.length){ ui.alert("Marque ao menos um cronograma."); return; }
    const ok = await ui.confirm("Confirmar? Vai alterar " + escolhidos.length + " cronograma(s):\n\n" + escolhidos.slice(0, 10).map(i => "• " + i.nome + (i.clientes ? " — " + i.clientes : "")).join("\n") + (escolhidos.length > 10 ? "\n… e mais " + (escolhidos.length - 10) : "") +
      "\n\nAntes, cada um ganha uma versão de segurança. A operação fica em Modelos → “Aplicações recentes”, com Desfazer.", { titulo: titulo + " (2 de 2)", okLabel:"Confirmar", perigo:true });
    if(!ok) return;
    onAplicar(new Set(escolhidos.map(i => i.id)));
  }
  return (
    <div className="modal-overlay dialog-overlay" onMouseDown={fecharAoClicarFora(false, onCancelar)}>
      <div className="modal-box" style={{width:780}}>
        <h3>{titulo} (1 de 2)</h3>
        <p style={{whiteSpace:"pre-line", fontSize:13, marginTop:0}}>{descricao}</p>
        <div style={{display:"flex", gap:10, alignItems:"center", marginBottom:6, flexWrap:"wrap"}}>
          <button className="link-btn" onClick={()=>setSel(new Set(livres.map(i => i.id)))}>Marcar todos ({livres.length})</button>
          <button className="link-btn" onClick={()=>setSel(new Set())}>Desmarcar todos</button>
          <span className="muted" style={{marginLeft:"auto"}}><strong>{sel.size}</strong> de {itens.length} selecionado(s)</span>
        </div>
        <div className="pick-list">
          <table>
            <thead><tr><th style={{width:30}}></th><th>Cronograma</th><th>Clientes afetados</th><th>O que muda</th></tr></thead>
            <tbody>{itens.map(i => (
              <tr key={i.id} className={i.bloqueado ? "bloq" : ""} onClick={()=>{ if(!i.bloqueado) alternar(i.id); }} style={{cursor: i.bloqueado ? "default" : "pointer"}}>
                <td><input type="checkbox" checked={sel.has(i.id)} disabled={!!i.bloqueado} onChange={()=>alternar(i.id)} onClick={e=>e.stopPropagation()} aria-label={"Selecionar " + i.nome} /></td>
                <td style={{whiteSpace:"normal"}}><strong>{i.nome}</strong>{i.bloqueado && <div className="alerta" style={{fontSize:12}}>fica de fora: {i.bloqueado}</div>}</td>
                <td style={{whiteSpace:"normal", fontSize:12.5}}>{i.clientes || "—"}</td>
                <td style={{whiteSpace:"normal", fontSize:12.5}}>{i.detalhe}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onCancelar}>Cancelar</button>
          <button className="btn btn-primary" disabled={!sel.size} onClick={aplicar}>{okLabel || "Aplicar"} nos {sel.size} selecionado(s)…</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Abas ---------- */
function ClientesVinculadosTab({ cliente, base, vinculoDe, ano, mesReferencia, somenteLeitura, onEditar, onAlterarVinculos }){
  const [escolhendo, setEscolhendo] = useState(false);
  const [busca, setBusca] = useState("");
  const porId = Object.fromEntries(base.map(c => [c.id, c]));
  const vinculados = (cliente.clientesIds || []).map(id => porId[id]).filter(Boolean)
    .sort((a,b) => (a.razaoSocial||"").localeCompare(b.razaoSocial||"", "pt-BR"));
  const termo = normalizar(busca), termoDigitos = soDigitos(busca);
  const lista = vinculados.filter(c => !termo || normalizar(c.razaoSocial).includes(termo) || normalizar(c.codigo).includes(termo) || (termoDigitos.length >= 3 && c.documento.includes(termoDigitos)));
  function desvincular(id){ onAlterarVinculos((cliente.clientesIds || []).filter(x => x !== id)); }
  // Datas-chave = tarefas de crédito/contábil de cada processo, na competência de referência.
  const datas = [];
  cliente.processos.filter(p => p.ativo && mesesDoProcesso(p).includes(mesReferencia)).forEach(p => {
    const calc = resolveProcesso(p, ano, mesReferencia, cliente.processos);
    p.eventos.forEach((ev, idx) => {
      if(ev.ativo === false || !(/credito|contabil|pagamento$|gfd|esocial/.test(normalizar(ev.nome)))) return;
      datas.push({ processo: p.nome, evento: ev.nome, data: calc[idx] && calc[idx].data ? fmtBR(calc[idx].data) : "—", regra: descreverRegra(ev.regra, p.eventos) });
    });
  });

  return (
    <>
    <div className="card">
      <h3>
        <span>Clientes vinculados ({vinculados.length})</span>
        {!somenteLeitura && <button className="btn btn-sm btn-primary" onClick={()=>setEscolhendo(true)}>Vincular / desvincular clientes…</button>}
      </h3>
      {!vinculados.length ? (
        <p className="muted">Nenhum cliente vinculado ainda. {!somenteLeitura && <>Use o botão acima — dá pra marcar vários de uma vez ou colar uma lista de CNPJs.</>}</p>
      ) : <>
        {vinculados.length > 8 && <input type="search" placeholder="Filtrar vinculados…" value={busca} onChange={e=>setBusca(e.target.value)} style={{width:"100%", maxWidth:320, marginBottom:8}} />}
        <div className="table-wrap" style={{maxHeight:360, overflow:"auto"}}><table>
          <thead><tr><th>Razão social</th><th>CNPJ/CPF</th><th>ID</th><th>Grupo</th><th>Gerente</th><th>Coordenador</th><th>Analista</th>{!somenteLeitura && <th style={{width:40}}></th>}</tr></thead>
          <tbody>{lista.map(c => (
            <tr key={c.id}>
              <td style={{whiteSpace:"normal"}}>{c.razaoSocial || "—"}{c.ativo === false && <> <span className="badge badge-off" title="Inativo na base de clientes">inativo</span></>}</td><td>{fmtDocumento(c.documento)}</td><td>{c.codigo || "—"}</td><td>{c.grupo || "—"}</td>
              <td>{c.gerente || "—"}</td><td>{c.coordenador || "—"}</td><td>{c.analista || "—"}</td>
              {!somenteLeitura && <td><button className="btn btn-sm btn-ghost" title="Desvincular" aria-label="Desvincular" onClick={()=>desvincular(c.id)}>✕</button></td>}
            </tr>
          ))}</tbody>
        </table></div>
      </>}
    </div>
    <div className="card">
      <h3>Datas-chave (competência {MESES_LONGOS[mesReferencia-1]}/{ano}) — somente leitura</h3>
      <p className="muted">Vêm direto da regra de cada tarefa. Pra mudar, edite a tarefa na aba Parametrização.</p>
      <div className="table-wrap"><table><tbody>
        {datas.map((d,i) => (
          <tr key={i}>
            <th style={{width:300, whiteSpace:"normal"}}>{d.evento}<div className="muted" style={{textTransform:"none", letterSpacing:0, fontWeight:400}}>{d.processo}</div></th>
            <td>{d.data}</td><td className="muted">{d.regra}</td>
            <td>{!somenteLeitura && <button className="link-btn" onClick={onEditar}>editar regra →</button>}</td>
          </tr>
        ))}
        {!datas.length && <tr><td className="muted">Nenhuma data-chave nesta competência.</td></tr>}
      </tbody></table></div>
    </div>
    {escolhendo && (
      <VincularClientesModal base={base} selecionadosIniciais={cliente.clientesIds || []} cronogramaId={cliente.id} vinculoDe={vinculoDe}
        onFechar={()=>setEscolhendo(false)} onConfirmar={ids => { onAlterarVinculos(ids); setEscolhendo(false); }} />
    )}
    </>
  );
}

const TIPO_ACAO_LABEL = { status:"Status", edicao:"Edição", criacao:"Criação" };
function VersoesCard({ fotos, ano, podeEditar, podeRestaurar, onSalvar, onVer, onComparar, onExcel, onRestaurar }){
  const doAno = (fotos || []).filter(f => f.ano === ano).sort((a,b) => b.n - a.n);
  const marcoTxt = m => TIPOS_FOTO[m.tipo] + " em " + fmtHora(m.em) + (m.por ? " por " + m.por : "") + (m.motivo ? " — " + m.motivo : "");
  return (
    <div className="card">
      <h3>
        <span>Versões de {ano}</span>
        {podeEditar && <button className="btn btn-sm btn-outline" onClick={onSalvar}>+ Salvar versão</button>}
      </h3>
      <p className="muted" style={{marginTop:0}}>Uma versão é criada sozinha quando o cronograma é <strong>enviado ao cliente</strong> e quando é <strong>aprovado</strong>. Se nada mudou entre um e outro, continua a mesma versão (só ganha o marco). {podeRestaurar ? "" : "Restaurar é só para Coordenador para cima."}</p>
      {!doAno.length ? <div className="muted">Nenhuma versão ainda.</div> : (
        <div className="table-wrap"><table><thead><tr><th style={{width:60}}>Versão</th><th>Marcos</th><th style={{width:330}}></th></tr></thead>
        <tbody>{doAno.map((f, i) => (
          <tr key={f.id}>
            <td><strong>v{f.n}</strong>{i === 0 && <div className="muted" style={{fontSize:11}}>mais recente</div>}</td>
            <td style={{whiteSpace:"normal"}}>{(f.marcos || []).map((m, j) => <div key={j}>• {marcoTxt(m)}</div>)}</td>
            <td style={{whiteSpace:"nowrap"}}>
              <button className="link-btn" onClick={()=>onVer(f)}>ver</button>{" · "}

/* ---------- App (v4) ---------- */
// Preferências deste navegador (usuário provisório até o login, menu recolhido, recentes).
function lerLocal(chave, padrao){ try { const v = localStorage.getItem(chave); return v == null ? padrao : JSON.parse(v); } catch(e){ return padrao; } }
function gravarLocal(chave, valor){ try { localStorage.setItem(chave, JSON.stringify(valor)); } catch(e){} }
// Grupos de acesso: os 4 base são os do site autenticado da Sinergy (provisórios aqui até integrar o
// login). As permissões de cada grupo são configuráveis no menu "🔐 Grupos de acesso" (quem tem "acessos").
const PERFIS_PADRAO = {
  admin:       { label:"Administrador / Diretor", edita:true, aprova:true,  clientes:true,  secoes:true,  modelos:true,  modelos_gerencia:true,  encerra:true,  restaura:true,  lixeira:true,  acessos:true  },
  gerente:     { label:"Gerente",                 edita:true, aprova:true,  clientes:true,  secoes:true,  modelos:true,  modelos_gerencia:true,  encerra:true,  restaura:true,  lixeira:true,  acessos:false },
  coordenador: { label:"Coordenador",             edita:true, aprova:true,  clientes:true,  secoes:true,  modelos:false, modelos_gerencia:true,  encerra:false, restaura:true,  lixeira:false, acessos:false },
  analista:    { label:"Analista",                edita:true, aprova:false, clientes:false, secoes:false, modelos:false, modelos_gerencia:false, encerra:false, restaura:false, lixeira:false, acessos:false },
};
let PERFIS = PERFIS_PADRAO; // substituído pela configuração salva (sinergy_cronograma_grupos) a cada render do App
const STATUS_EM_APROVACAO = ["aprovado_analista", "aguardando_aprovacao_superior"];

// Rotas no endereço (#/...) — cada cronograma tem link próprio, dá pra mandar pra um colega.
// Endereço: #/<ano>/<tela>/<id>/<aba> — o ano faz parte do link, então um link
// mandado pra um colega abre o MESMO ano. Sem ano no link = ano de trabalho padrão.
function lerRota(){
  let h = (window.location.hash || "").replace(/^#\/?/, "");
  let ano = null;
  const mAno = h.match(/^(\d{4})(\/|$)/);
  if(mAno){ ano = Number(mAno[1]); h = h.slice(mAno[0].length); }
  const [tela, id, aba] = h.split("/").map(s => decodeURIComponent(s || ""));
  const anoFinal = ano || lerLocal("cronograma_ano", anoTrabalhoPadrao());
  if(tela === "cronograma" && id) return { tela, id, aba: aba || "parametrizar", ano: anoFinal };
  if(["inicio","aprovacoes","painel","clientes","secoes","acessos","modelos","lixeira"].includes(tela)) return { tela, ano: anoFinal };
  return { tela:"inicio", ano: anoFinal };
}
let ANO_DA_ROTA = anoTrabalhoPadrao(); // atualizado pelo App a cada render (usado nos links)
function linkTela(tela, ano){ return "#/" + (ano || ANO_DA_ROTA) + "/" + tela; }
function linkCronograma(id, aba, ano){ return "#/" + (ano || ANO_DA_ROTA) + "/cronograma/" + encodeURIComponent(id) + (aba && aba !== "parametrizar" ? "/" + aba : ""); }

function ContadorStatus({ n, label, on, onClick, cor }){
  return (
    <button type="button" className={"contador" + (on ? " on" : "")} onClick={onClick}>
      <div className="n" style={cor ? {color:cor} : undefined}>{n}</div>
      <div className="l">{label}</div>
    </button>
  );
}

/* ---------- Tela inicial: carteira de cronogramas ---------- */
function CarteiraTela({ linhas, problemasResp = {}, ano, modelos, usuario, analistas, sujos, basePorId, atualizandoResumo, onAbrir, onNovo, onAcaoMassa, statusInicial }){
  const [busca, setBusca] = useState("");
  const [fStatus, setFStatus] = useState(statusInicial === "__semVersao" ? "" : (statusInicial || ""));
  const [soSemVersao, setSoSemVersao] = useState(statusInicial === "__semVersao");
  const [fModelo, setFModelo] = useState("");
  const [fAnalista, setFAnalista] = useState("");
  const [soMeus, setSoMeus] = useState(false);
  const [soAlerta, setSoAlerta] = useState(false);
  const [soSemClientes, setSoSemClientes] = useState(false);
  const [soRespInvalido, setSoRespInvalido] = useState(false);
  const [arquivados, setArquivados] = useState(false);
  const [ordem, setOrdem] = useState({ col:"nome", dir:1 });
  const [sel, setSel] = useState(() => new Set());

  const termo = normalizar(busca), dig = soDigitos(busca);
  const casaBusca = c => {
    if(!termo) return true;
    if(normalizar(c.nome).includes(termo) || normalizar(c.analista).includes(termo)) return true;
    return (c.clientesIds || []).some(id => { const b = basePorId[id]; return b && (normalizar(b.razaoSocial).includes(termo) || normalizar(b.codigo) === termo || (dig.length >= 4 && b.documento.includes(dig))); });
  };
  const base = linhas.filter(c => arquivados || !c.arquivado);
  const filtradas = base
    .filter(c => !fStatus || c.status === fStatus)
    .filter(c => !fModelo || c.modeloId === fModelo)
    .filter(c => !fAnalista || c.analista === fAnalista)
    .filter(c => !soMeus || (usuario.nome && (temNome(c.analista, usuario.nome) || (c.clientesIds || []).some(id => { const b = basePorId[id]; return b && RESPONSAVEIS.some(([k]) => temNome(b[k], usuario.nome)); }))))
    .filter(c => !soAlerta || c.alertas > 0)
    .filter(c => !soSemClientes || (c.temVersao && !(c.clientesIds || []).length))
    .filter(c => !soSemVersao || !c.temVersao)
    .filter(c => !soRespInvalido || (problemasResp[c.id] || []).length)
    .filter(casaBusca);
  const valor = (c, col) => col === "clientes" ? (c.clientesIds || []).length : col === "status" ? statusIndex(c.status) : col === "atualizadoEm" ? (c.atualizadoEm || "") : col === "alertas" ? (c.alertas || 0) : normalizar(c[col] || "");
  const ordenadas = filtradas.slice().sort((a,b) => { const x = valor(a, ordem.col), y = valor(b, ordem.col); return (x < y ? -1 : x > y ? 1 : 0) * ordem.dir; });
  const th = (col, label, estilo) => (
    <th style={{cursor:"pointer", ...estilo}} onClick={()=>setOrdem(o => ({ col, dir: o.col === col ? -o.dir : 1 }))} aria-sort={ordem.col === col ? (ordem.dir > 0 ? "ascending" : "descending") : "none"}>
      {label}{ordem.col === col ? (ordem.dir > 0 ? " ▲" : " ▼") : ""}
    </th>
  );
  const todosMarcados = ordenadas.length > 0 && ordenadas.every(c => sel.has(c.id));
  function alternar(id){ setSel(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); }
  function marcarTodos(){ setSel(prev => { const n = new Set(prev); todosMarcados ? ordenadas.forEach(c => n.delete(c.id)) : ordenadas.forEach(c => n.add(c.id)); return n; }); }
  const selecionados = [...sel].filter(id => linhas.some(l => l.id === id));
  async function acao(tipo){ const ok = await onAcaoMassa(tipo, selecionados); if(ok) setSel(new Set()); }

  const conta = f => base.filter(f).length;
  return (
    <div style={{paddingTop:20}}>
      <div className="topbar">
        <div>
          <h2>Cronogramas <span className="chip-ano">{ano}</span></h2>
          <div className="sub">{base.filter(c => c.temVersao).length} com versão {ano} · {base.filter(c => !c.temVersao).length} sem versão {ano}{atualizandoResumo ? " · atualizando o resumo…" : ""}</div>
        </div>
        <div className="toolbar">
          <button className="btn btn-primary" onClick={onNovo}>+ Novo cronograma</button>
        </div>
      </div>

      <div className="contadores">
        <ContadorStatus n={base.length} label="Todos" on={!fStatus && !soAlerta && !soSemClientes && !soSemVersao && !soRespInvalido} onClick={()=>{ setFStatus(""); setSoAlerta(false); setSoSemClientes(false); setSoSemVersao(false); setSoRespInvalido(false); }} />
        <ContadorStatus n={conta(c => !c.temVersao)} label={"Sem versão " + ano} on={soSemVersao} onClick={()=>setSoSemVersao(!soSemVersao)} />
        {STATUS_FLOW.map(s => <ContadorStatus key={s.id} n={conta(c => c.status === s.id)} label={s.label.replace(" — pronto para gerar tarefas", "")} on={fStatus === s.id} onClick={()=>setFStatus(fStatus === s.id ? "" : s.id)} />)}
        <ContadorStatus n={conta(c => c.alertas > 0)} label="Com alerta ⚠" cor="var(--warn)" on={soAlerta} onClick={()=>setSoAlerta(!soAlerta)} />
        <ContadorStatus n={conta(c => c.temVersao && !(c.clientesIds || []).length)} label="Sem clientes" on={soSemClientes} onClick={()=>setSoSemClientes(!soSemClientes)} />
        {Object.keys(problemasResp).length > 0 && <ContadorStatus n={conta(c => (problemasResp[c.id] || []).length)} label="⚠ Responsável sem usuário" on={soRespInvalido} onClick={()=>setSoRespInvalido(!soRespInvalido)} />}
      </div>

      <div className="card">
        <div className="filtros">
          <input type="search" placeholder="Buscar por cronograma, cliente, CNPJ, ID ou analista…" value={busca} onChange={e=>setBusca(e.target.value)} style={{flex:1, minWidth:240}} aria-label="Buscar" />
          <select value={fModelo} onChange={e=>setFModelo(e.target.value)} aria-label="Filtrar por Modelo">
            <option value="">Todos os Modelos</option>
            {modelos.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
          </select>
          <select value={fAnalista} onChange={e=>setFAnalista(e.target.value)} aria-label="Filtrar por analista">
            <option value="">Todos os analistas</option>
            {analistas.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <label className="muted chk"><input type="checkbox" checked={soMeus} disabled={!usuario.nome} onChange={e=>setSoMeus(e.target.checked)} /> <span title="Cronogramas em que você é o analista, ou gerente/coordenador/analista de algum cliente vinculado">Meus cronogramas</span>{!usuario.nome ? " (defina seu nome no menu)" : ""}</label>
          <label className="muted chk"><input type="checkbox" checked={arquivados} onChange={e=>setArquivados(e.target.checked)} /> Arquivados</label>
        </div>

        {selecionados.length > 0 && (
          <div className="bulkbar">
            <strong>{selecionados.length} selecionado(s)</strong>
            <button className="btn btn-sm btn-primary" onClick={()=>acao("abrirAno")}>Abrir {ano}</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>acao("exportar")}>⬇ Exportar Excel</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>acao("status")}>Mudar status…</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>acao("analista")}>Definir analista…</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>acao("modelo")}>Aplicar Modelo atualizado</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>acao("arquivar")}>Arquivar / desarquivar</button>
            <button className="link-btn" style={{color:"#cbd5e1", marginLeft:"auto"}} onClick={()=>setSel(new Set())}>limpar seleção</button>
          </div>
        )}

        <div className="table-wrap">
          <table className="tabela-lista">
            <thead><tr>
              <th style={{width:34}}><input type="checkbox" checked={todosMarcados} onChange={marcarTodos} aria-label="Selecionar todos da lista" /></th>
              {th("nome", "Cronograma")}{th("modeloBase", "Modelo")}{th("clientes", "CNPJs", {width:70})}{th("status", "Status")}{th("analista", "Analista")}{th("atualizadoEm", "Última edição")}{th("alertas", "⚠", {width:56})}
            </tr></thead>
            <tbody>
              {ordenadas.map(c => (
                <tr key={c.id} className={"linha-clicavel" + (sel.has(c.id) ? " sel" : "")} onClick={()=>onAbrir(c.id)}>
                  <td onClick={e=>e.stopPropagation()}><input type="checkbox" checked={sel.has(c.id)} onChange={()=>alternar(c.id)} aria-label={"Selecionar " + c.nome} /></td>
                  <td style={{whiteSpace:"normal"}}>
                    <a href={linkCronograma(c.id)} onClick={e=>e.stopPropagation()} className="link-crono">{c.nome}</a>
                    {(problemasResp[c.id] || []).length > 0 && <span className="badge badge-alerta" style={{marginLeft:6}} title={problemasResp[c.id].join("\n")}>⚠ responsável</span>}
                    {sujos.has(c.id) && <span className="dirty" title="Alterações não salvas"> ●</span>}
                    {c.arquivado && <span className="badge badge-off" style={{marginLeft:6}}>arquivado</span>}
                  </td>
                  <td className="muted" style={{whiteSpace:"normal", maxWidth:260}}>{c.modeloBase || "—"}</td>
                  <td>{(c.clientesIds || []).length}</td>
                  <td>{c.temVersao
                    ? <span className={"status-pill status-" + c.status}>{statusLabel(c.status).replace(" — pronto para gerar tarefas", "")}</span>
                    : <span className="badge badge-off" title={c.anos.length ? "Versões existentes: " + c.anos.join(", ") : ""}>sem versão {ano}{c.anos.length ? " (tem " + c.anos.join(", ") + ")" : ""}</span>}</td>
                  <td>{c.analista || <span className="muted">—</span>}</td>
                  <td className="muted">{c.atualizadoEm ? fmtHora(c.atualizadoEm) : "—"}</td>
                  <td>{c.alertas > 0 ? <span className="alerta">⚠ {c.alertas}</span> : c.alertas === 0 ? <span className="muted">0</span> : <span className="muted">?</span>}</td>
                </tr>
              ))}
              {!ordenadas.length && <tr><td colSpan={8} className="muted" style={{padding:20}}>{linhas.length ? "Nenhum cronograma nesse filtro." : "Nenhum cronograma ainda — clique em “+ Novo cronograma”."}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ---------- Fila de aprovação ---------- */

              <tbody>{g.itens.map(c => (

                  <td>{(c.clientesIds || []).length}</td>

                    </>}

                </tr>
              ))}</tbody>
            </table></div>
          )}
        </div>
      ))}
    </div>
  );

/* ---------- Painel: situação dos clientes e dos cronogramas ----------
