// modo "cliente" (para validação do cliente) ou "interno" (com modelo base, status e responsáveis da Sinergy).
async function exportarExcel(cliente, ano, clientesVinculados, modo){
  modo = modo === "cliente" ? "cliente" : "interno";
  const wb = novoWorkbook();
  adicionarAbaCronograma(wb, "Cronograma " + ano, cliente, ano, clientesVinculados, modo);
  adicionarAbaClientes(wb, "Clientes", clientesVinculados || [], modo);
  adicionarAbaFeriados(wb, ano);
  await baixarWorkbook(wb, "Sinergy_Cronograma_" + ano + "_" + cliente.nome.replace(/[^\w]+/g,"_") + (modo === "cliente" ? "_cliente" : "_interno") + ".xlsx");
}
// Vários cronogramas num arquivo só: aba de resumo + uma aba por cronograma + clientes + feriados.
async function exportarVariosExcel(itens, ano){
  const wb = novoWorkbook();
  const ws = wb.addWorksheet("Resumo", { views:[{ state:"frozen", ySplit:1 }] });
  ws.columns = [{ width:40 }, { width:34 }, { width:12 }, { width:30 }, { width:20 }, { width:12 }];
  ws.getRow(1).values = ["Cronograma", "Modelo", "CNPJs", "Status", "Analista", "Alertas"];
  estiloCabecalho(ws.getRow(1));
  itens.forEach(({ cronograma, vinculados }) => ws.addRow([cronograma.nome, cronograma.modeloBase || "", (vinculados || []).length, statusLabel(cronograma.status), cronograma.analista || "", alertasDoAno(cronograma, ano).length]));
  itens.forEach(({ cronograma, vinculados }) => adicionarAbaCronograma(wb, cronograma.nome, cronograma, ano, vinculados));
  adicionarAbaClientes(wb, "Clientes (todos)", itens.flatMap(({ cronograma, vinculados }) => (vinculados || []).map(v => ({ ...v, cronograma: cronograma.nome }))));
  adicionarAbaFeriados(wb, ano);
  await baixarWorkbook(wb, "Cronogramas_" + ano + "_" + itens.length + "_selecionados.xlsx");
}

/* ---------- Assistente de cliente novo ---------- */
// Revisor das datas da Folha Mensal de um conjunto de processos (Modelo ou
// assistente), numa competência escolhível, em ordem de data e com os alertas
// do motor (folha depois do contábil/crédito etc.).
function PreviaFolha({ processos, ano, titulo }){
  const [mes, setMes] = useState(1);
  const folha = (processos || []).find(p => p.id === "folha_mensal");
  const linhas = useMemo(() => {
    if(!folha) return [];
    return resolveProcesso(folha, ano, mes, processos).filter(c => c.ativo !== false && c.data)
      .sort((a,b) => a.data - b.data).map(c => ({ ...c, categoria: categoriaDoEvento(folha, c) }));
  }, [folha, ano, mes]);
  if(!folha) return <div className="muted">Este Modelo não tem Folha de Pagamento Mensal.</div>;
  const dias = ["dom","seg","ter","qua","qui","sex","sáb"];
  const nomeDe = id => (folha.eventos.find(e => e.id === id) || {}).nome || "";
  const totalAlertas = linhas.reduce((n, c) => n + c.alertas.length, 0);
  return (
    <div>
      <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
        <label style={{fontSize:12.5, fontWeight:700}}>{titulo || "Prévia das datas da folha"} — competência</label>
        <select value={mes} onChange={e=>setMes(Number(e.target.value))} aria-label="Competência da prévia">
          {MESES_LONGOS.map((m,i) => <option key={m} value={i+1}>{m}/{ano}</option>)}
        </select>
        {totalAlertas > 0 && <span className="alerta" style={{fontSize:12}}>⚠ {totalAlertas} alerta(s)</span>}
      </div>
      <div className="table-wrap" style={{marginTop:6, maxHeight:320, overflow:"auto"}}><table>
        <tbody>{linhas.map(c => (
          <tr key={c.id} style={c.categoria === "contabil" || /credito/.test(normalizar(c.nome)) ? {fontWeight:700} : undefined}>
            <td style={{width:120}}>{fmtBR(c.data)} <span className="muted">{dias[c.data.getDay()]}</span></td>
            <td style={{whiteSpace:"normal"}}>
              <span className="cat-dot" style={{background: infoCategoria(c.categoria).cor}} />{c.nome}
              {c.limitadoPor && <span className="muted" style={{fontSize:11}}> · puxado por "{nomeDe(c.limitadoPor)}"</span>}
              {c.alertas.length > 0 && <div className="alerta" style={{fontSize:11}}>⚠ {c.alertas.join(" ")}</div>}
            </td>
            <td style={{width:100}} className={classeResponsavel(c.responsavel)}>{c.responsavel}</td>
          </tr>
        ))}</tbody>
      </table></div>
    </div>
  );
}

// Prévia ao vivo: mostra a data que a regra gera numa competência de exemplo,
// com os mesmos alertas do motor (ex.: crédito da folha um mês à frente).
function PreviaRegra({ regra, previa }){
  if(!previa) return null;
  const dias = ["dom","seg","ter","qua","qui","sex","sáb"];
  const calc = resolveProcesso({ id: previa.processoId || "x", eventos: [{ id:"x", nome: previa.nomeEvento || "", regra }] }, previa.ano, previa.mes)[0];
  const alertas = calc.alertas || [];
  return (
    <div style={{fontSize:12, marginTop:4, color: alertas.length ? "var(--warn)" : "var(--muted)"}}>
      → competência <strong>{MESES[previa.mes-1]}/{previa.ano}</strong>: {calc.data ? <strong>{fmtBR(calc.data)} ({dias[calc.data.getDay()]})</strong> : "—"}
      {alertas.map((a,i) => <div key={i}>⚠ {a}</div>)}
    </div>
  );
}
function CamposDiaSemana({ regra, onChange }){
  return <>
    <select value={regra.n} onChange={e=>onChange({...regra, n:Number(e.target.value)})} aria-label="Qual ocorrência">
      {[1,2,3,4,5,-1].map(n => <option key={n} value={n}>{ORDINAIS_SEMANA[n]}</option>)}
    </select>
    <select value={regra.diaSemana} onChange={e=>onChange({...regra, diaSemana:Number(e.target.value)})} aria-label="Dia da semana">
      {DIAS_SEMANA_NOMES.map((d,i) => <option key={i} value={i}>{d}</option>)}
    </select>
    <span className="muted">se não for dia útil:</span>
    <select value={regra.ajuste || ""} onChange={e=>onChange({...regra, ajuste:e.target.value})} aria-label="Se não for dia útil">
      <option value="">manter a data</option>
      <option value="prev">dia útil anterior</option>
      <option value="next">dia útil posterior</option>
    </select>
  </>;
}
function AncoraSelect({ regra, onChange, previa }){
  function setTipo(t){
    const mesOffset = regra.mesOffset || 0;
    if(t === "dia_fixo") onChange({ tipo:"dia_fixo", dia:25, ajuste:"prev", mesOffset });
    else if(t === "nth_util") onChange({ tipo:"nth_util", n:5, mesOffset });
    else if(t === "ultimo_util") onChange({ tipo:"ultimo_util", mesOffset });
    else if(t === "penultimo_util") onChange({ tipo:"penultimo_util", mesOffset });
    else if(t === "nth_semana") onChange({ tipo:"nth_semana", n:1, diaSemana:1, ajuste:"next", mesOffset });
  }
  return (
    <div className="rule-editor">
      <select value={regra.tipo} onChange={e=>setTipo(e.target.value)}>
        {ANCORA_TIPOS.filter(t=>t!=="nth_util_fim").map(k => <option key={k} value={k}>{RULE_LABELS[k]}</option>)}
      </select>
      {regra.tipo === "dia_fixo" && <>
        <span className="muted">dia</span>
        <input type="number" min="1" max="31" style={{width:52}} value={regra.dia}
          onChange={e=>onChange({...regra, dia:Math.min(31, Math.max(1, Number(e.target.value)||1))})} />
        <span className="muted">ou dia útil</span>
        <select value={regra.ajuste} onChange={e=>onChange({...regra, ajuste:e.target.value})}>
          <option value="prev">anterior</option>
          <option value="next">posterior</option>
        </select>
      </>}
      {regra.tipo === "nth_util" && <>
        <input type="number" min="1" max="23" style={{width:52}} value={regra.n}
          onChange={e=>onChange({...regra, n:Math.min(23, Math.max(1, Number(e.target.value)||1))})} />
        <span className="muted">º dia útil do mês</span>
      </>}
      {regra.tipo === "nth_semana" && <CamposDiaSemana regra={regra} onChange={onChange} />}
      <select value={regra.mesOffset || 0} onChange={e=>onChange({...regra, mesOffset:Number(e.target.value)})}>
        <option value={0}>do mês da competência</option>
        <option value={1}>do mês seguinte à competência</option>
        <option value={-1}>do mês anterior à competência</option>
      </select>
      <div style={{flexBasis:"100%"}}><PreviaRegra regra={regra} previa={previa} /></div>
    </div>
  );
}

// Parte do Modelo escolhido no cadastro (com as travas 🔒 dele) e só troca as
// datas-chave. Cada pergunta muda a tarefa de CRÉDITO do processo; se a
// cadeia era calculada de cima pra baixo (ex.: Benefícios, onde o input tinha
// data fixa), ela é reancorada no crédito, mantendo os mesmos intervalos.
function AssistenteWizard({ dadosCadastro, modelo, ano, onCancelar, onCriar }){
  // Competência de exemplo usada na prévia ao vivo de cada data-chave.
  const previa = (processoId, nomeEvento) => ({ ano: ano || new Date().getFullYear() + 1, mes: 1, processoId, nomeEvento });
  const base = useMemo(() => modelo ? processosDoModelo(modelo) : seedProcessos(), [modelo]);
  const acharProcs = pred => base.filter(pred);
  const procsFolha = acharProcs(p => p.id === "folha_mensal");
  const procsAdiant = acharProcs(p => p.id === "adiantamento");
  const procsBenef = acharProcs(p => p.familia === "beneficios");
  const procFerias = base.find(p => p.id === "ferias");
  const regraAtual = (procs, fallback) => {
    const ev = procs[0] && acharEventoCredito(procs[0]);
    return ev && ANCORA_TIPOS.includes(ev.regra.tipo) && ev.regra.tipo !== "nth_util_fim" ? clonar(ev.regra) : fallback;
  };
  const [folhaRegra, setFolhaRegra] = useState(() => regraAtual(procsFolha, { tipo:"dia_fixo", dia:6, ajuste:"prev", mesOffset:1 }));
  const [adiantRegra, setAdiantRegra] = useState(() => regraAtual(procsAdiant, { tipo:"dia_fixo", dia:20, ajuste:"next", mesOffset:0 }));
  const [benefRegra, setBenefRegra] = useState(() => regraAtual(procsBenef, { tipo:"dia_fixo", dia:30, ajuste:"prev", mesOffset:0 }));
  // Padrões da casa pra GFD/FGTS e eSocial (valem mesmo se o Modelo salvo ainda tiver a regra antiga, relativa).
  const [gfdRegra, setGfdRegra] = useState({ tipo:"dia_fixo", dia:7, ajuste:"prev", mesOffset:1 });
  const [esocialRegra, setEsocialRegra] = useState({ tipo:"dia_fixo", dia:10, ajuste:"prev", mesOffset:1 });
  // Folha amarrada ao contábil: parte do que o Modelo já tem (se o contábil for âncora), senão do padrão.
  const eventoFolha = re => procsFolha[0] && procsFolha[0].eventos.find(e => re.test(normalizar(e.nome)));
  const [contabilRegra, setContabilRegra] = useState(() => {
    const c = eventoFolha(/contabil/);
    return c && ANCORA_TIPOS.includes(c.regra.tipo) && c.regra.tipo !== "nth_util_fim" ? clonar(c.regra) : clonar(CONTABIL_PADRAO.regra);
  });
  const diasAntesDe = (re, reRef, padrao) => {
    const ref = eventoFolha(reRef), e = eventoFolha(re);
    return ref && e && e.regra.tipo === "deslocamento" && e.regra.ref === ref.id && e.regra.direcao === "antes" ? e.regra.dias : padrao;
  };
  const [diasEncargos, setDiasEncargos] = useState(() => diasAntesDe(/conferencia de encargos/, /contabil/, CONTABIL_PADRAO.diasEncargos));
  const [diasRelatorios, setDiasRelatorios] = useState(() => diasAntesDe(/relatorios finais/, /conferencia de encargos/, CONTABIL_PADRAO.diasRelatorios));
  // Cliente tem prévia da folha? Vem conforme o Modelo escolhido (com/sem prévia); dá pra trocar aqui.
  const [possuiPrevia, setPossuiPrevia] = useState(() => temPreviaFolha(base));
  const [diasCredito, setDiasCredito] = useState(() => {
    const rel = eventoFolha(/relatorios finais/), cred = procsFolha[0] && acharEventoCredito(procsFolha[0]);
    const lim = rel && cred && (rel.regra.ou || []).find(o => o.ref === cred.id);
    return lim ? lim.dias : CONTABIL_PADRAO.diasCredito;
  });
  const [feriasModo, setFeriasModo] = useState("mensal");
  const eventoKits = p => p.eventos.find(e => /kit/i.test(e.nome)) || p.eventos[p.eventos.length - 1];
  const [feriasDia, setFeriasDia] = useState(() => { const k = procFerias && eventoKits(procFerias); return k && k.regra.tipo === "dia_fixo" ? k.regra.dia : 10; });
  const [feriasDiaSemana, setFeriasDiaSemana] = useState(3);
  const [feriasIntervalo, setFeriasIntervalo] = useState(15);
  const [feriasSla, setFeriasSla] = useState(2);

  // Monta os processos com as respostas atuais — usado tanto pra criar quanto
  // pra prévia ao vivo da cadeia da folha.
  function montarProcessos(){
    let processos = clonar(base);
    const aplicarCredito = (pred, regra) => {
      processos = processos.map(p => {
        if(!pred(p)) return p;
        const ev = acharEventoCredito(p);
        return ev ? reancorarCadeia(p, ev.id, clonar(regra)) : p;
      });
    };
    aplicarCredito(p => p.id === "folha_mensal", folhaRegra);
    aplicarCredito(p => p.id === "adiantamento", adiantRegra);
    aplicarCredito(p => p.familia === "beneficios", benefRegra);
    processos = processos.map(p => {
      if(p.id !== "folha_mensal") return p;
      const gfd = acharEventoGfd(p), esocial = acharEventoEsocial(p);
      return { ...p, eventos: p.eventos.map(ev =>
        gfd && ev.id === gfd.id ? { ...ev, nome:"GFD Mensal - Envio FGTS", regra:clonar(gfdRegra) } :
        esocial && ev.id === esocial.id ? { ...ev, nome:"Fechamento eSocial com DIRF", regra:clonar(esocialRegra) } : ev) };
    });
    processos = amarrarFolhaAoContabil(processos, contabilRegra, diasRelatorios, diasEncargos, diasCredito);
    processos = possuiPrevia ? aplicarPreviaFolha(processos) : removerPreviaFolha(processos);

    const ferias = processos.find(p => p.id === "ferias");
    if(ferias){
      if(feriasModo === "mensal"){
        // A âncora é o envio dos kits; as tarefas anteriores contam pra trás a partir dele.
        const k = eventoKits(ferias);
        Object.assign(ferias, reancorarCadeia(ferias, k.id, { tipo:"dia_fixo", dia:feriasDia, ajuste:"prev", mesOffset:0 }));
      } else {
        ferias.eventos = [{ id:novoId("fer_rec"), nome:"Envio dos kits de férias", responsavel:"SINERGY", ativo:true, bloqueada:false, excecoes:{},
          regra: feriasModo === "semanal"
            ? { tipo:"recorrencia", modo:"semanal", diaSemana:feriasDiaSemana, slaDias:feriasSla }
            : { tipo:"recorrencia", modo:"intervalo", intervaloDias:feriasIntervalo, slaDias:feriasSla } }];
      }
    }
    return processos;
  }
  function criar(){ onCriar(montarProcessos()); }

  // Processos com as respostas atuais, pra prévia ao vivo da Folha Mensal.
  const processosMontados = useMemo(() => montarProcessos(),
    [folhaRegra, gfdRegra, esocialRegra, contabilRegra, diasRelatorios, diasEncargos, diasCredito, possuiPrevia]);

  const semProcesso = <span className="muted">Este Modelo não tem esse processo — pergunta ignorada.</span>;
  return (
    <div className="modal-overlay" onMouseDown={fecharAoClicarFora(true, onCancelar, "Fechar o assistente e descartar este novo cronograma?")}>
      <div className="modal-box">
        <h3>Novo cronograma — assistente de datas-chave</h3>
        <p className="muted">Cronograma: <strong>{dadosCadastro?.nome}</strong> ({(dadosCadastro?.clientesIds || []).length} cliente(s)) · Modelo: <strong>{modelo ? modelo.nome : "padrão"}</strong>. Responda só as datas-chave; o resto da cadeia vem do Modelo, com os mesmos intervalos, e dá pra ajustar depois.</p>

        {procsFolha.length > 0 && (
          <div className="card" style={{background:"var(--surface2)", padding:"12px 14px"}}>
            <h3 style={{fontSize:13}}>Folha de Pagamento Mensal — amarrada ao Contábil</h3>
            <p className="muted" style={{marginTop:0}}>O contábil é a âncora: a folha é calculada pra trás a partir dele e nenhuma etapa de folha pode cair depois dele.</p>
            <div className="wizard-q">
              <label style={{display:"flex", gap:6, alignItems:"center", cursor:"pointer"}}>
                <input type="checkbox" checked={possuiPrevia} onChange={e=>setPossuiPrevia(e.target.checked)} />
                O cliente possui prévia da folha de pagamento
              </label>
              <div className="muted" style={{fontSize:11}}>
                {possuiPrevia
                  ? <>"Fechamento definitivo da folha" vira <strong>"Liberação da prévia para validação"</strong> e entra a tarefa do cliente <strong>"Validação da prévia da folha de pagamento"</strong>. O início da folha antecipa 1 d.u.</>
                  : <>Sem prévia: fica o "Fechamento definitivo da folha", sem validação do cliente.</>}
              </div>
            </div>
            <div className="wizard-q">
              <label>Liberação do processo contábil</label>
              {eventoFolha(/contabil/) ? <AncoraSelect regra={contabilRegra} onChange={setContabilRegra} previa={previa()} /> : semProcesso}
            </div>
            <div className="wizard-q">
              <label>Sequência: relatórios oficiais → conferência de encargos → contábil</label>
              <div className="rule-editor">
                <span className="muted">Conferência de encargos</span>
                <input type="number" min="0" max="15" style={{width:48}} value={diasEncargos} onChange={e=>setDiasEncargos(Math.max(0, Number(e.target.value)||0))} aria-label="Dias úteis entre encargos e contábil" />
                <span className="muted">d.u. antes do <strong>contábil</strong></span>
              </div>
              <div className="rule-editor" style={{marginTop:6}}>
                <span className="muted">Relatórios oficiais</span>
                <input type="number" min="0" max="15" style={{width:48}} value={diasRelatorios} onChange={e=>setDiasRelatorios(Math.max(0, Number(e.target.value)||0))} aria-label="Dias úteis entre relatórios e encargos" />
                <span className="muted">d.u. antes da <strong>conferência de encargos</strong></span>
              </div>
              <div className="rule-editor" style={{marginTop:6}}>
                <span className="muted">…e o arquivo bancário / relatórios no mínimo</span>
                <input type="number" min="1" max="15" style={{width:48}} value={diasCredito} onChange={e=>setDiasCredito(Math.max(1, Number(e.target.value)||1))} aria-label="Dias úteis mínimos antes do crédito" />
                <span className="muted">d.u. antes do <strong>crédito da folha</strong> (vale o que vier primeiro)</span>
              </div>
              {(diasEncargos === 0 || diasRelatorios === 0) && <div className="alerta" style={{fontSize:11, marginTop:4}}>⚠ Com 0 d.u., as duas etapas caem no mesmo dia.</div>}
              <div className="muted" style={{fontSize:11, marginTop:4}}>Fechamento, processamento, bloqueio do portal e inputs contam pra trás a partir dos relatórios oficiais (mesmos intervalos do Modelo).</div>
            </div>
            <div className="wizard-q">
              <label>Crédito da folha</label>
              <AncoraSelect regra={folhaRegra} onChange={setFolhaRegra} previa={previa("folha_mensal", "Data do crédito")} />
            </div>
            <PreviaFolha processos={processosMontados} ano={previa().ano} titulo="Prévia da folha" />
          </div>
        )}
        {!procsFolha.length && <div className="wizard-q"><label>Folha de Pagamento Mensal</label>{semProcesso}</div>}
        <div className="wizard-q">
          <label>GFD Mensal - Envio FGTS</label>
          {procsFolha.length && acharEventoGfd(procsFolha[0]) ? <AncoraSelect regra={gfdRegra} onChange={setGfdRegra} previa={previa()} /> : semProcesso}
        </div>
        <div className="wizard-q">
          <label>Fechamento eSocial com DIRF</label>
          {procsFolha.length && acharEventoEsocial(procsFolha[0]) ? <AncoraSelect regra={esocialRegra} onChange={setEsocialRegra} previa={previa()} /> : semProcesso}
        </div>
        <div className="wizard-q">
          <label>Qual o crédito do Adiantamento?</label>
          {procsAdiant.length ? <AncoraSelect regra={adiantRegra} onChange={setAdiantRegra} previa={previa()} /> : semProcesso}
        </div>
        <div className="wizard-q">
          <label>Qual o crédito de Benefícios?</label>
          {procsBenef.length ? <AncoraSelect regra={benefRegra} onChange={setBenefRegra} previa={previa()} /> : semProcesso}
        </div>
        <div className="wizard-q">
          <label>Qual a frequência de envio dos kits de Férias?</label>
          {!procFerias ? semProcesso : <>
            <div className="rule-editor" style={{marginBottom:6}}>
              <select value={feriasModo} onChange={e=>setFeriasModo(e.target.value)}>
                <option value="mensal">Mensal (dia fixo do mês)</option>
                <option value="semanal">Semanal</option>
                <option value="quinzenal">Quinzenal / a cada N dias</option>

            </div>
            {feriasModo === "mensal" && <div className="rule-editor">
              <span className="muted">envio dos kits até o dia</span>
              <input type="number" min="1" max="31" style={{width:52}} value={feriasDia} onChange={e=>setFeriasDia(Math.min(31, Math.max(1, Number(e.target.value)||1)))} />
              <span className="muted">(ou dia útil anterior)</span>
              <div style={{flexBasis:"100%"}}><PreviaRegra regra={{ tipo:"dia_fixo", dia:feriasDia, ajuste:"prev", mesOffset:0 }} previa={previa()} /></div>
            </div>}
            {feriasModo === "semanal" && <div className="rule-editor">
              <span className="muted">toda</span>
              <select value={feriasDiaSemana} onChange={e=>setFeriasDiaSemana(Number(e.target.value))}>
                {["domingo","segunda","terça","quarta","quinta","sexta","sábado"].map((d,i)=><option key={i} value={i}>{d}</option>)}
              </select>
              <span className="muted">· SLA</span>
              <input type="number" min="0" style={{width:48}} value={feriasSla} onChange={e=>setFeriasSla(Math.max(0, Number(e.target.value)||0))} />
              <span className="muted">dias úteis</span>
            </div>}
            {feriasModo === "quinzenal" && <div className="rule-editor">
              <span className="muted">a cada</span>
              <input type="number" min="1" style={{width:48}} value={feriasIntervalo} onChange={e=>setFeriasIntervalo(Math.max(1, Number(e.target.value)||15))} />
              <span className="muted">dias · SLA</span>
              <input type="number" min="0" style={{width:48}} value={feriasSla} onChange={e=>setFeriasSla(Math.max(0, Number(e.target.value)||0))} />
              <span className="muted">dias úteis</span>
            </div>}
          </>}
        </div>

        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onCancelar}>Cancelar</button>
          <button className="btn btn-primary" onClick={criar}>Criar e ver prévia</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Seletor de clientes (vínculo em massa) ----------
   Um CNPJ pertence a um cronograma só. Os já vinculados a outro cronograma
   aparecem travados (com o nome de onde estão). Dá pra marcar tudo que o
   filtro mostra, ou colar uma lista de CNPJs/códigos direto do Excel. */
function VincularClientesModal({ base, selecionadosIniciais, cronogramaId, vinculoDe, onConfirmar, onFechar }){
  const [sel, setSel] = useState(() => new Set(selecionadosIniciais || []));
  const [busca, setBusca] = useState("");
  const [soLivres, setSoLivres] = useState(true);
  const [colar, setColar] = useState(false);
  const [txt, setTxt] = useState("");
  const [relatorio, setRelatorio] = useState(null);
  const emOutro = c => (vinculoDe[c.id] || []).filter(v => v.id !== cronogramaId);
  const termo = normalizar(busca);
  const termoDigitos = soDigitos(busca);
  const jaVinculados = new Set(selecionadosIniciais || []);
  const filtrados = base
    .filter(c => c.ativo !== false || jaVinculados.has(c.id)) // inativo só aparece se já estava vinculado
    .filter(c => !soLivres || sel.has(c.id) || !emOutro(c).length)
    .filter(c => !termo || normalizar(c.razaoSocial).includes(termo) || normalizar(c.codigo).includes(termo) || normalizar(c.grupo).includes(termo) || (termoDigitos.length >= 3 && c.documento.includes(termoDigitos)))
    .sort((a,b) => (a.razaoSocial||"").localeCompare(b.razaoSocial||"", "pt-BR"));
  const livresFiltrados = filtrados.filter(c => !emOutro(c).length);
  function alternar(id){ setSel(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); }
  function marcarFiltrados(v){ setSel(prev => { const n = new Set(prev); livresFiltrados.forEach(c => v ? n.add(c.id) : n.delete(c.id)); return n; }); }
  function aplicarColagem(){
    const tokens = txt.split(/[\n\r\t;,]+/).map(s => s.trim()).filter(Boolean);
    const porDoc = Object.fromEntries(base.map(c => [c.documento, c]));
    const porCod = Object.fromEntries(base.filter(c => c.codigo).map(c => [normalizar(c.codigo), c]));
    const achados = [], naoAchados = [], ocupados = [];
    tokens.forEach(t => {
      const n = normalizarDocumento(t);
      const c = (n.valido && porDoc[n.doc]) || porCod[normalizar(t)];
      if(!c){ naoAchados.push(t); return; }
      if(c.ativo === false && !jaVinculados.has(c.id)){ ocupados.push((c.razaoSocial || fmtDocumento(c.documento)) + " (inativo na base)"); return; }
      if(emOutro(c).length){ ocupados.push((c.razaoSocial || fmtDocumento(c.documento)) + " → " + emOutro(c)[0].nome); return; }
      achados.push(c.id);
    });
    setSel(prev => new Set([...prev, ...achados]));
    setRelatorio({ achados: achados.length, naoAchados, ocupados });
  }
  return (
    <div className="modal-overlay dialog-overlay" style={{zIndex:1050}}
      onMouseDown={fecharAoClicarFora(() => txt.trim() || JSON.stringify([...sel].sort()) !== JSON.stringify([...(selecionadosIniciais || [])].sort()), onFechar, "Descartar a seleção de clientes que você fez?")}>
      <div className="modal-box" style={{width:760}}>
        <h3>Vincular clientes ao cronograma</h3>
        {!base.length ? <p className="muted">A base de clientes está vazia. Importe a planilha em <strong>🏢 Base de clientes</strong> primeiro.</p> : <>
        <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginBottom:8}}>
          <input type="search" autoFocus placeholder="Buscar por nome, CNPJ, ID ou grupo…" value={busca} onChange={e=>setBusca(e.target.value)} style={{flex:1, minWidth:220}} />
          <label className="muted" style={{display:"flex", gap:4, alignItems:"center"}}><input type="checkbox" checked={soLivres} onChange={e=>setSoLivres(e.target.checked)} /> só clientes sem cronograma</label>
          <button className="btn btn-sm btn-outline" onClick={()=>setColar(!colar)}>{colar ? "Fechar colagem" : "Colar lista de CNPJs/IDs"}</button>
        </div>
        {colar && (
          <div className="card" style={{background:"var(--surface2)", padding:12}}>
            <textarea rows={4} placeholder={"Cole aqui uma coluna do Excel com CNPJs (com ou sem pontuação) ou IDs — um por linha"} value={txt} onChange={e=>setTxt(e.target.value)} />
            <div style={{display:"flex", gap:8, alignItems:"center", marginTop:6, flexWrap:"wrap"}}>
              <button className="btn btn-sm btn-primary" onClick={aplicarColagem} disabled={!txt.trim()}>Marcar os encontrados</button>
              {relatorio && <span className="muted">{relatorio.achados} marcado(s)
                {relatorio.naoAchados.length ? <> · <span className="doc-invalido" title={relatorio.naoAchados.join("\n")}>{relatorio.naoAchados.length} não encontrado(s)</span></> : ""}
                {relatorio.ocupados.length ? <> · <span className="alerta" title={relatorio.ocupados.join("\n")}>{relatorio.ocupados.length} já em outro cronograma</span></> : ""}
              </span>}
            </div>
          </div>
        )}
        <div style={{display:"flex", gap:10, alignItems:"center", marginBottom:6, flexWrap:"wrap"}}>
          <button className="link-btn" onClick={()=>marcarFiltrados(true)}>Marcar os {livresFiltrados.length} da lista</button>
          <button className="link-btn" onClick={()=>marcarFiltrados(false)}>Desmarcar os da lista</button>
          <span className="muted" style={{marginLeft:"auto"}}><strong>{sel.size}</strong> selecionado(s) · {filtrados.length} na lista</span>
        </div>
        <div className="pick-list">
          <table>
            <thead><tr><th style={{width:30}}></th><th>Razão social</th><th>CNPJ/CPF</th><th>ID</th><th>Grupo</th><th>Cronograma atual</th></tr></thead>
            <tbody>
              {filtrados.map(c => {
                const outro = emOutro(c);
                return (
                  <tr key={c.id} className={outro.length ? "bloq" : ""} onClick={()=>{ if(!outro.length) alternar(c.id); }} style={{cursor: outro.length ? "default" : "pointer"}}>
                    <td><input type="checkbox" checked={sel.has(c.id)} disabled={!!outro.length} onChange={()=>alternar(c.id)} onClick={e=>e.stopPropagation()} aria-label={"Selecionar " + c.razaoSocial} /></td>
                    <td style={{whiteSpace:"normal"}}>{c.razaoSocial || "—"}</td>
                    <td>{fmtDocumento(c.documento)}</td>
                    <td>{c.codigo || "—"}</td>
                    <td>{c.grupo || "—"}</td>
                    <td className="muted">{outro.length ? outro.map(v => v.nome).join(", ") : ""}</td>
                  </tr>
                );
              })}
              {!filtrados.length && <tr><td colSpan={6} className="muted">Nenhum cliente nesse filtro.</td></tr>}
            </tbody>
          </table>
        </div>
        </>}
        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onFechar}>Cancelar</button>
          <button className="btn btn-primary" onClick={()=>onConfirmar([...sel])}>Confirmar ({sel.size})</button>
        </div>
      </div>
    </div>
  );
}

function NovoCronogramaForm({ modelos, base, vinculoDe, ano, anosEstado, onCancelar, onCriarDireto, onIrParaAssistente, gerentes = [], escopo = "all" }){
  const [nome, setNome] = useState("");
  const usaGerencia = gerentes.length > 0;
  const [gerenteId, setGerenteId] = useState(escopo !== "all" ? escopo : "");
  // Ano da versão que nasce: qualquer ano ainda NÃO encerrado — o anterior ao vigente (ex.: cliente novo entrando
  // em 2026 enquanto 2026 não foi encerrado), o vigente e os dois seguintes. Padrão: o ano em que você está.
  const anosPossiveis = [-1, 0, 1, 2].map(i => anoVigente() + i).filter(a => !anoEncerrado(a, anosEstado));
  const [anoNovo, setAnoNovo] = useState(() => anosPossiveis.includes(ano) ? ano : (anosPossiveis.includes(anoVigente()) ? anoVigente() : anosPossiveis[0]));
  // Modelos da empresa + os da gerência escolhida.
  const modelosDaGer = usaGerencia ? modelos.filter(m => !m.gerenteId || m.gerenteId === gerenteId) : modelos;
  const [modeloId, setModeloId] = useState(() => (modelosDaGer[0] || modelos[0] || {}).id || "");
  const [verPrevia, setVerPrevia] = useState(true);
  const modeloEscolhido = modelosDaGer.find(m => m.id === modeloId);
  const [clientesIds, setClientesIds] = useState([]);
  const [escolhendo, setEscolhendo] = useState(false);
  const porId = Object.fromEntries(base.map(c => [c.id, c]));
  const escolhidos = clientesIds.map(id => porId[id]).filter(Boolean);

  function dados(){ return { nome: nome.trim(), modeloId, clientesIds, ano: anoNovo, gerenteId: usaGerencia ? gerenteId : null }; }
  function validar(){
    if(!nome.trim()){ ui.alert("Dá um nome pro cronograma antes de continuar (ex.: nome do grupo econômico)."); return false; }
    if(usaGerencia && !gerenteId){ ui.alert("Escolha a gerência do cronograma — é obrigatória."); return false; }
    if(!modeloEscolhido){ ui.alert("Escolha o Modelo de partida."); return false; }
    return true;
  }
  return (
    <div className="modal-overlay" onMouseDown={fecharAoClicarFora(() => !!nome.trim() || clientesIds.length > 0, onCancelar, "Descartar o novo cronograma que você começou a preencher?")}>
      <div className="modal-box" style={{width:560}}>
        <h3>Novo cronograma</h3>
        <div style={{display:"grid", gridTemplateColumns:"1fr 140px", gap:10}}>
          <div className="wizard-q"><label>Nome do cronograma</label>
            <input type="text" autoFocus style={{width:"100%"}} value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: Grupo XPTO" /></div>
          <div className="wizard-q"><label>Ano</label>
            <select style={{width:"100%", fontWeight:700}} value={anoNovo} onChange={e=>setAnoNovo(Number(e.target.value))} aria-label="Ano do cronograma">
              {anosPossiveis.map(a => <option key={a} value={a}>{a}{a === anoVigente() ? " (atual)" : a < anoVigente() ? " (ainda aberto)" : ""}</option>)}
            </select></div>
        </div>
        {usaGerencia && <div className="wizard-q"><label>Gerência *</label>
          <select style={{width:"100%"}} value={gerenteId} disabled={escopo !== "all"} onChange={e=>{ const g = e.target.value; setGerenteId(g); setClientesIds([]); const lista = modelos.filter(m => !m.gerenteId || m.gerenteId === g); if(!lista.some(m => m.id === modeloId)) setModeloId((lista[0] || {}).id || ""); }} aria-label="Gerência do cronograma">
            <option value="">Selecione…</option>
            {gerentes.map(g => <option key={g.id} value={g.id}>{g.nome}</option>)}
          </select>
        </div>}
        <div className="wizard-q">
          <label>Modelo (padrão da casa) de partida</label>
          <select style={{width:"100%"}} value={modeloId} onChange={e=>setModeloId(e.target.value)}>
            {modelosDaGer.map(m => <option key={m.id} value={m.id}>{m.nome}{usaGerencia && m.gerenteId ? " (da gerência)" : ""}</option>)}
          </select>
          <button type="button" className="link-btn" style={{marginTop:6}} onClick={()=>setVerPrevia(!verPrevia)}>
            {verPrevia ? "▾ esconder as datas da folha deste Modelo" : "▸ ver as datas da folha deste Modelo"}
          </button>
          {verPrevia && modeloEscolhido && (
            <div className="card" style={{background:"var(--surface2)", padding:"10px 12px", marginTop:6, marginBottom:0}}>
              <PreviaFolha processos={modeloEscolhido.processos} ano={anoNovo} titulo="Folha deste Modelo" />
            </div>
          )}
        </div>
        <div className="wizard-q">
          <label>Clientes (CNPJs) que seguem este cronograma</label>
          <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
            <button className="btn btn-sm btn-outline" disabled={usaGerencia && !gerenteId} title={usaGerencia && !gerenteId ? "Escolha a gerência primeiro" : ""} onClick={()=>setEscolhendo(true)}>{escolhidos.length ? "Alterar seleção" : "Escolher clientes…"}</button>
            <span className="muted">{escolhidos.length ? escolhidos.length + " selecionado(s)" : "nenhum ainda — dá pra vincular depois também"}</span>
          </div>
          {escolhidos.length > 0 && (
            <div className="muted" style={{marginTop:6, maxHeight:90, overflow:"auto"}}>
              {escolhidos.slice(0, 30).map(c => c.razaoSocial || fmtDocumento(c.documento)).join(" · ")}{escolhidos.length > 30 ? " · e mais " + (escolhidos.length - 30) : ""}
            </div>
          )}
        </div>
        <div className="wizard-actions">
          <button className="btn btn-ghost" onClick={onCancelar}>Cancelar</button>
          {/* Sempre pelo assistente (decisão do usuário): as perguntas-chave personalizam o cronograma. */}
          <button className="btn btn-primary" onClick={()=>{ if(validar()) onIrParaAssistente(dados()); }}>Continuar no assistente de datas-chave →</button>
        </div>
      </div>
      {escolhendo && (
        <VincularClientesModal base={usaGerencia ? base.filter(c => c.gerenteId === gerenteId) : base} selecionadosIniciais={clientesIds} cronogramaId={null} vinculoDe={vinculoDe}
          onFechar={()=>setEscolhendo(false)}
          onConfirmar={ids => {
            setClientesIds(ids); setEscolhendo(false);
            if(!nome.trim() && ids.length === 1 && porId[ids[0]]) setNome(porId[ids[0]].razaoSocial || "");
          }} />
      )}
    </div>
  );
}

/* ---------- Base de clientes: tela, importação e cadastro avulso ---------- */
function celulaTexto(v){
  if(v == null) return "";
  if(v instanceof Date) return toISO(v);
  if(typeof v === "object"){
    if(v.richText) return v.richText.map(t => t.text).join("");
    if(v.text != null) return String(v.text);
    if(v.result != null) return String(v.result);
    return "";
  }
  return String(v);
}
async function lerArquivoTabela(arquivo){
  const nome = arquivo.name.toLowerCase();
  const buf = await arquivo.arrayBuffer();
  if(nome.endsWith(".xlsx")){
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    const rows = [];
    ws.eachRow({ includeEmpty:false }, row => { rows.push((row.values || []).slice(1).map(celulaTexto)); });
    return rows;
  }
  if(nome.endsWith(".csv") || nome.endsWith(".txt")){
    let txt;
    try { txt = new TextDecoder("utf-8", { fatal:true }).decode(buf); }
    catch(e){ txt = new TextDecoder("windows-1252").decode(buf); } // CSV salvo pelo Excel no Windows
    return parseTabelaTexto(txt);
  }
  throw new Error("Formato não suportado — use .xlsx ou .csv (arquivos .xls antigos: salve como .xlsx antes).");
}
async function baixarModeloPlanilha(){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Clientes");
  ws.columns = [{ header:"ID", width:12 }, { header:"Razão social", width:48 }, { header:"CNPJ", width:22, style:{ numFmt:"@" } }, { header:"Grupo", width:22 },
    { header:"Gerente", width:22 }, { header:"Coordenador", width:22 }, { header:"Analista", width:22 }];
  ws.getRow(1).font = { bold:true };
  ws.addRow(["1001", "Empresa Exemplo Ltda", "11.222.333/0001-81", "Grupo Exemplo", "Nome do gerente", "Nome do coordenador", "Nome do analista"]);
  const buffer = await wb.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([buffer], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = "modelo_importacao_clientes.xlsx";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
