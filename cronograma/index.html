<!-- =========================================================================
     INTERFACE (React + JSX via Babel no navegador).
     Na integração com o site autenticado, este bloco deve ser compilado no
     build de lá (Vite/esbuild) — o Babel aqui é só pra rodar como arquivo único.
     ========================================================================= -->
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Diálogos próprios (substituem alert/confirm/prompt nativos) ---------- */
const dialogBus = { abrir: null };
function abrirDialogo(cfg){
  return new Promise(resolve => {
    if(dialogBus.abrir) dialogBus.abrir({ ...cfg, resolve });
    else resolve(cfg.tipo === "confirm" ? window.confirm(cfg.msg) : cfg.tipo === "prompt" ? window.prompt(cfg.msg, cfg.valorInicial || "") : window.alert(cfg.msg));
  });
}
const ui = {
  alert: (msg, opts={}) => abrirDialogo({ tipo:"alert", msg, ...opts }),
  confirm: (msg, opts={}) => abrirDialogo({ tipo:"confirm", msg, ...opts }),
  prompt: (msg, valorInicial="", opts={}) => abrirDialogo({ tipo:"prompt", msg, valorInicial, ...opts }),
};
function DialogHost(){
  const [d, setD] = useState(null);
  const [valor, setValor] = useState("");
  useEffect(() => {
    dialogBus.abrir = cfg => { setValor(cfg.valorInicial || ""); setD(cfg); };
    return () => { dialogBus.abrir = null; };
  }, []);
  const fechar = r => { d.resolve(r); setD(null); };
  const cancelar = () => fechar(d.tipo === "prompt" ? null : d.tipo === "confirm" ? false : undefined);
  const ok = () => fechar(d.tipo === "prompt" ? valor : true);
  useEffect(() => {
    if(!d) return;
    const onKey = e => { if(e.key === "Escape") cancelar(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  if(!d) return null;
  return (
    <div className="modal-overlay dialog-overlay">
      <div className="modal-box" style={{width:460}} role="dialog" aria-modal="true">
        {d.titulo && <h3>{d.titulo}</h3>}
        <p style={{whiteSpace:"pre-line", fontSize:13.5}}>{d.msg}</p>
        {d.tipo === "prompt" && (
          <input type="text" autoFocus style={{width:"100%", fontSize:13, padding:"6px 8px"}} value={valor}
            onChange={e=>setValor(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") ok(); }} />
        )}
        <div className="wizard-actions">
          {d.tipo !== "alert" && <button className="btn btn-ghost" onClick={cancelar}>{d.cancelLabel || "Cancelar"}</button>}
          <button autoFocus={d.tipo !== "prompt"} className={"btn " + (d.perigo ? "btn-danger" : "btn-primary")} onClick={ok}>{d.okLabel || "OK"}</button>
        </div>
      </div>
    </div>
  );
}

// Clicar fora de uma janela fecha; se houver algo preenchido/pendente, confirma antes.
// Usa mousedown (onde o clique COMEÇOU): arrastar uma seleção de texto pra fora não fecha.
function fecharAoClicarFora(temPendencia, fechar, mensagem){
  return async e => {
    if(e.target !== e.currentTarget) return;
    const pend = typeof temPendencia === "function" ? temPendencia() : temPendencia;
    if(pend && !(await ui.confirm(mensagem || "Você tem informações preenchidas nesta janela. Fechar e descartar?", { okLabel:"Descartar e fechar", perigo:true }))) return;
    fechar();
  };
}

function Alertas({ lista }){
  if(!lista || !lista.length) return null;
  return <span className="alerta" title={lista.join("\n")}> ⚠</span>;
}

/* ---------- Editor de regra ---------- */
// Modo simples: "N dias úteis antes/depois da tarefa anterior". Avançado:
// referenciar outra tarefa, recorrência ou âncora própria.
function RuleEditor({ regra, isPrimeiro, anterior, outrosEventos, outrosBlocos, onChange }){
  const [avancado, setAvancado] = useState(
    isPrimeiro || regra.tipo === "recorrencia" || regra.tipo === "vinculo" || regra.tipo === "semana_rel" || (regra.tipo === "deslocamento" && !!regra.refManual) || ANCORA_TIPOS.includes(regra.tipo)
  );
  const tipo = regra.tipo;

  function setTipoAvancado(t){
    if(t === "dia_fixo") onChange({ tipo:"dia_fixo", dia:25, ajuste:"prev", mesOffset:0 });
    else if(t === "nth_util") onChange({ tipo:"nth_util", n:5, mesOffset:0 });
    else if(t === "ultimo_util") onChange({ tipo:"ultimo_util", mesOffset:0 });
    else if(t === "penultimo_util") onChange({ tipo:"penultimo_util", mesOffset:0 });
    else if(t === "nth_util_fim") onChange({ tipo:"nth_util_fim", n:3, mesOffset:0 });
    else if(t === "nth_semana") onChange({ tipo:"nth_semana", n:1, diaSemana:1, ajuste:"next", mesOffset:0 });
    else if(t === "deslocamento") onChange({ tipo:"deslocamento", ref: (anterior || outrosEventos[0])?.id || "", dias:1, direcao:"depois", refManual:true });
    else if(t === "recorrencia") onChange({ tipo:"recorrencia", modo:"semanal", diaSemana:3, slaDias:2, ajuste:"prev" });
    else if(t === "semana_rel"){
      const ref = (anterior || outrosEventos[0])?.id;
      if(!ref){ ui.alert("Não há outra tarefa neste bloco para usar de referência."); return; }
      onChange({ tipo:"semana_rel", ref, diaSemana:1, direcao:"antes", mesmoDia:false, ajuste:"prev" });
    }
    else if(t === "vinculo"){
      const p0 = (outrosBlocos || []).find(p => p.id === "folha_mensal") || (outrosBlocos || [])[0];
      if(!p0){ ui.alert("Não há outro bloco neste cronograma para vincular."); return; }
      const e0 = acharEventoCredito(p0) || p0.eventos[0];
      onChange({ tipo:"vinculo", processoRef:p0.id, eventoRef:e0.id, dias:0, direcao:"antes", rotuloRef: p0.nome + " · " + e0.nome });
    }
  }

  if(!avancado && !isPrimeiro){
    const dias = regra.tipo === "deslocamento" ? regra.dias : 1;
    const direcao = regra.tipo === "deslocamento" ? regra.direcao : "depois";
    return (
      <div className="rule-editor">
        <input type="number" min="0" style={{width:48}} value={dias} aria-label="Dias úteis"
          onChange={e=>onChange({ tipo:"deslocamento", ref: regra.ref || anterior?.id, dias:Math.max(0, Number(e.target.value)||0), direcao })} />
        <select value={direcao} onChange={e=>onChange({ tipo:"deslocamento", ref: regra.ref || anterior?.id, dias, direcao:e.target.value })}>
          <option value="depois">dias úteis depois da anterior</option>
          <option value="antes">dias úteis antes da anterior</option>
        </select>
        <button type="button" className="link-btn" style={{fontSize:11}} onClick={()=>setAvancado(true)}>avançado ▾</button>
      </div>
    );
  }

  return (
    <div className="rule-editor">
      <select value={tipo} onChange={e=>setTipoAvancado(e.target.value)}>
        {Object.entries(RULE_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
      </select>
      {tipo === "dia_fixo" && <>
        <span className="muted">dia</span>
        <input type="number" min="1" max="31" style={{width:52}} value={regra.dia}
          onChange={e=>onChange({...regra, dia:Math.min(31, Math.max(1, Number(e.target.value)||1))})} />
        <span className="muted">ou dia útil</span>
        <select value={regra.ajuste} onChange={e=>onChange({...regra, ajuste:e.target.value})}>
          <option value="prev">anterior</option>
          <option value="next">posterior</option>
        </select>
      </>}
      {(tipo === "nth_util" || tipo === "nth_util_fim") && <>
        <input type="number" min="1" max="23" style={{width:52}} value={regra.n}
          onChange={e=>onChange({...regra, n:Math.min(23, Math.max(1, Number(e.target.value)||1))})} />
        <span className="muted">{tipo === "nth_util" ? "º dia útil do mês" : "º dia útil, contando do fim do mês"}</span>
      </>}
      {tipo === "nth_semana" && <CamposDiaSemana regra={regra} onChange={onChange} />}
      {tipo === "deslocamento" && <>
        <input type="number" min="0" style={{width:52}} value={regra.dias}
          onChange={e=>onChange({...regra, dias:Math.max(0, Number(e.target.value)||0)})} />
        <span className="muted">dias úteis</span>
        <select value={regra.direcao} onChange={e=>onChange({...regra, direcao:e.target.value})}>
          <option value="antes">antes de</option>
          <option value="depois">depois de</option>
        </select>
        <select value={regra.ref} onChange={e=>onChange({...regra, ref:e.target.value, refManual:true})}>
          {outrosEventos.map(ev => <option key={ev.id} value={ev.id}>{ev.nome}</option>)}
        </select>
      </>}
      {tipo === "recorrencia" && <>
        <select value={regra.modo} onChange={e=>onChange({...regra, modo:e.target.value})}>
          <option value="semanal">Semanal</option>
          <option value="intervalo">A cada N dias (ex.: quinzenal = 15)</option>
        </select>
        {regra.modo === "semanal" ? (
          <select value={regra.diaSemana} onChange={e=>onChange({...regra, diaSemana:Number(e.target.value)})}>
            {["domingo","segunda","terça","quarta","quinta","sexta","sábado"].map((d,i)=><option key={i} value={i}>{d}</option>)}
          </select>
        ) : <>
          <input type="number" min="1" style={{width:48}} value={regra.intervaloDias||15}
            onChange={e=>onChange({...regra, intervaloDias:Math.max(1, Number(e.target.value)||15)})} />
          <span className="muted">dias, a partir de</span>
          <input type="date" value={regra.dataBase||""} onChange={e=>onChange({...regra, dataBase:e.target.value})} />
        </>}
        <span className="muted">se cair em feriado:</span>
        <select value={regra.ajuste || ""} onChange={e=>onChange({...regra, ajuste:e.target.value})} aria-label="Se cair em feriado">
          <option value="">manter a data</option>
          <option value="prev">dia útil anterior</option>
          <option value="next">dia útil posterior</option>
        </select>
        <span className="muted">SLA processamento:</span>
        <input type="number" min="0" style={{width:48}} value={regra.slaDias||0}
          onChange={e=>onChange({...regra, slaDias:Math.max(0, Number(e.target.value)||0)})} />
        <span className="muted">dias úteis</span>
      </>}
      {tipo === "semana_rel" && <>
        <select value={regra.diaSemana} onChange={e=>onChange({...regra, diaSemana:Number(e.target.value)})} aria-label="Dia da semana">
          {DIAS_SEMANA_NOMES.map((d,i) => <option key={i} value={i}>{d}</option>)}
        </select>
        <select value={regra.direcao} onChange={e=>onChange({...regra, direcao:e.target.value})} aria-label="Antes ou depois">
          <option value="antes">anterior a</option>
          <option value="depois">posterior a</option>
        </select>
        <select value={regra.ref} onChange={e=>onChange({...regra, ref:e.target.value})} aria-label="Tarefa de referência">
          {outrosEventos.map(ev => <option key={ev.id} value={ev.id}>{ev.nome}</option>)}
        </select>
        <span className="muted">com no mínimo</span>
        <input type="number" min="0" style={{width:48}} value={regra.diasMin || 0} onChange={e=>onChange({...regra, diasMin:Math.max(0, Number(e.target.value)||0)})} aria-label="Distância mínima em dias úteis" />
        <span className="muted">d.u. {regra.direcao === "antes" ? "de antecedência" : "depois"}</span>
        {!regra.diasMin && <label className="muted chk" title="Se a tarefa de referência já cair nesse dia da semana, usa o mesmo dia (senão vai para a semana anterior/seguinte)">
          <input type="checkbox" checked={!!regra.mesmoDia} onChange={e=>onChange({...regra, mesmoDia:e.target.checked})} /> pode ser o mesmo dia
        </label>}
        <span className="muted">se não for dia útil:</span>
        <select value={regra.ajuste || ""} onChange={e=>onChange({...regra, ajuste:e.target.value})} aria-label="Se não for dia útil">
          <option value="">manter a data</option>
          <option value="prev">dia útil anterior</option>
          <option value="next">dia útil posterior</option>
        </select>
      </>}
      {tipo === "vinculo" && (() => {
        const blocos = outrosBlocos || [];
        const pSel = blocos.find(p => p.id === regra.processoRef);
        const setVinc = (processoRef, eventoRef) => {
          const p = blocos.find(x => x.id === processoRef); const e = p && (p.eventos.find(x => x.id === eventoRef) || acharEventoCredito(p) || p.eventos[0]);
          if(p && e) onChange({ ...regra, processoRef: p.id, eventoRef: e.id, rotuloRef: p.nome + " · " + e.nome });
        };
        return <>
          <input type="number" min="0" style={{width:52}} value={regra.dias || 0} onChange={e=>onChange({...regra, dias:Math.max(0, Number(e.target.value)||0)})} aria-label="Dias úteis de diferença" />
          <span className="muted">d.u.</span>
          <select value={regra.direcao || "antes"} onChange={e=>onChange({...regra, direcao:e.target.value})} disabled={!regra.dias}>
            <option value="antes">antes de</option>
            <option value="depois">depois de</option>
          </select>
          <select value={regra.processoRef || ""} onChange={e=>setVinc(e.target.value, null)} aria-label="Bloco vinculado">
            {!pSel && <option value={regra.processoRef || ""}>{regra.rotuloRef ? regra.rotuloRef.split(" · ")[0] + " (não está aqui)" : "—"}</option>}
            {blocos.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
          <select value={regra.eventoRef || ""} onChange={e=>setVinc(regra.processoRef, e.target.value)} aria-label="Tarefa vinculada">
            {(pSel ? pSel.eventos : []).map(ev => <option key={ev.id} value={ev.id}>{ev.nome}</option>)}
          </select>
          <span className="muted">{regra.dias ? "" : "(0 = mesma data)"}</span>
        </>;
      })()}
      {ANCORA_TIPOS.includes(tipo) && <>
        <span className="muted">referente ao</span>
        <select value={regra.mesOffset || 0} onChange={e=>onChange({...regra, mesOffset:Number(e.target.value)})}>
          <option value={0}>mês da competência</option>
          <option value={1}>mês seguinte à competência</option>
          <option value={-1}>mês anterior à competência</option>
        </select>
      </>}
      {tipo !== "recorrencia" && outrosEventos.length > 0 && <>
        {(regra.ou || []).map((o, i) => {
          const setLim = patch => onChange({ ...regra, ou: regra.ou.map((x, j) => j === i ? { ...x, ...patch } : x) });
          return (
            <span key={i} className="rule-editor" style={{flexBasis:"100%"}}>
              <span className="muted">ou</span>
              <input type="number" min="0" style={{width:52}} value={o.dias} onChange={e=>setLim({ dias: Math.max(0, Number(e.target.value)||0) })} aria-label="Dias úteis do limite" />
              <span className="muted">d.u.</span>
              <select value={o.direcao} onChange={e=>setLim({ direcao: e.target.value })}>
                <option value="antes">antes de</option>
                <option value="depois">depois de</option>
              </select>
              <select value={o.ref} onChange={e=>setLim({ ref: e.target.value })}>
                {outrosEventos.map(ev => <option key={ev.id} value={ev.id}>{ev.nome}</option>)}
              </select>
              <span className="muted">(o que vier primeiro)</span>
              <button type="button" className="link-btn perigo" style={{fontSize:11}} onClick={()=>onChange({ ...regra, ou: regra.ou.filter((_, j) => j !== i) })}>remover limite</button>
            </span>
          );
        })}
        <button type="button" className="link-btn" style={{fontSize:11}}
          onClick={()=>onChange({ ...regra, ...(tipo === "deslocamento" ? { refManual:true } : {}), ou: [...(regra.ou || []), { ref: (outrosEventos.find(ev => ev.id !== regra.ref) || outrosEventos[0])?.id, dias: 1, direcao: "antes" }] })}>+ limite (o que vier primeiro)</button>
      </>}
      {!isPrimeiro && <button type="button" className="link-btn" style={{fontSize:11}} onClick={()=>{ setAvancado(false); onChange({ tipo:"deslocamento", ref:anterior?.id, dias:1, direcao:"depois" }); }}>modo simples</button>}
    </div>
  );
}

const TIPOS_BENEFICIO_PADRAO = ["VA","VR","VT","VC","Outros"];

// Tipos de benefício que compartilham o mesmo cronograma ficam no mesmo GRUPO (ex.: VA e VR no grupo 1,
// VT no grupo 2 → 2 blocos: "Benefícios — VA + VR" e "Benefícios — VT"). `grupos` = { tipo: número do grupo }.
function montarBlocosDeBeneficio(processo, grupos, nomeOutros){
  const porGrupo = {};
  TIPOS_BENEFICIO_PADRAO.forEach(t => {
    const g = grupos[t]; if(!g) return;
    const nomeTipo = t === "Outros" ? (nomeOutros || "").trim() : t;
    (porGrupo[g] = porGrupo[g] || []).push(nomeTipo);
  });
  return Object.keys(porGrupo).sort((a,b) => a - b).map(g => {
    const tipos = porGrupo[g];
    return { ...clonar(processo), id: novoId("beneficios_" + tipos.join("_").toLowerCase().replace(/[^\w]+/g,"_")),
      nome: "Benefícios — " + tipos.join(" + "), familia: "beneficios", tiposBeneficio: tipos };
  });
}
function DesdobrarBeneficioPainel({ processo, onConfirmar, onFechar }){
  const [grupos, setGrupos] = useState({}); // tipo → número do grupo (0/ausente = não tem)
  const [nomeOutros, setNomeOutros] = useState("");
  const usados = TIPOS_BENEFICIO_PADRAO.filter(t => grupos[t]);
  const previa = usados.length && !(grupos.Outros && !nomeOutros.trim()) ? montarBlocosDeBeneficio(processo, grupos, nomeOutros) : [];
  function confirmar(){
    if(!usados.length){ ui.alert("Escolha ao menos um tipo de benefício."); return; }
    if(grupos.Outros && !nomeOutros.trim()){ ui.alert('Informe o nome do tipo em "Outros".'); return; }
    onConfirmar(montarBlocosDeBeneficio(processo, grupos, nomeOutros));
  }
  return (
    <div className="card" style={{background:"var(--surface2)", border:"1px dashed #94a3b8"}}>
      <strong style={{fontSize:12.5}}>Desdobrar por tipo de benefício</strong>
      <p className="muted" style={{margin:"4px 0 8px"}}>Para cada tipo, escolha o cronograma. Tipos no <strong>mesmo número</strong> compartilham um bloco só (ex.: VA e VR no 1, VT no 2).</p>
      <div style={{display:"flex", flexWrap:"wrap", gap:10, alignItems:"center"}}>
        {TIPOS_BENEFICIO_PADRAO.map(t => (
          <label key={t} className="badge" style={{background: grupos[t] ? "#e0e7ff":"#fff", color: grupos[t] ? "#3730a3":"#475569", border:"1px solid var(--line)", display:"flex", alignItems:"center", gap:6, padding:"4px 8px"}}>
            <strong>{t}</strong>
            <select value={grupos[t] || 0} onChange={e=>setGrupos({ ...grupos, [t]: Number(e.target.value) })} aria-label={"Cronograma do " + t}>
              <option value={0}>não tem</option>
              {[1,2,3,4,5].map(n => <option key={n} value={n}>cronograma {n}</option>)}
            </select>
          </label>
        ))}
        {grupos.Outros > 0 && (
          <input type="text" placeholder="Nome do tipo (ex.: Vale Cultura)" value={nomeOutros} onChange={e=>setNomeOutros(e.target.value)} style={{width:200}} />
        )}
      </div>
      {previa.length > 0 && <div className="muted" style={{marginTop:8}}>Vai criar {previa.length} bloco(s): {previa.map(p => <strong key={p.id} style={{color:"var(--ink)"}}>{p.nome}</strong>).reduce((a, b, i) => i ? [...a, " · ", b] : [b], [])}</div>}
      <div style={{marginTop:10, display:"flex", gap:8}}>
        <button className="btn btn-sm btn-primary" onClick={confirmar}>Criar bloco(s)</button>
        <button className="btn btn-sm btn-ghost" onClick={onFechar}>Cancelar</button>
      </div>
    </div>
  );
}

/* ---------- Card de um processo (v4: recolhível, regra em texto, selo "fora do padrão") ---------- */
// Linha-resumo de um processo recolhido: datas-chave da competência, alertas e padrão.
function resumoDoProcesso(processo, calc){
  const chaves = [];
  processo.eventos.forEach((ev, i) => {
    if(ev.ativo === false || !calc[i] || !calc[i].data) return;
    const n = normalizar(ev.nome);
    if(/credito|contabil|kits|^data de pagamento/.test(n)) chaves.push({ nome: ev.nome.replace(/^Data (do|de) /i, "").replace(/^Liberação do /i, ""), data: calc[i].data });
  });
  const alertas = calc.reduce((s, c) => s + (c && c.alertas ? c.alertas.length : 0), 0);
  return { chaves, alertas };
}

function ProcessoCard({ processo, onUpdate, onDesdobrar, mesReferencia, ano, somenteLeitura, modo, acoesExtras, processoModelo, aberto, onAlternar, destaqueEventoId, todosProcessos }){
  const modoAtual = modo || "cliente";
  const estaAberto = aberto === undefined ? true : aberto;
  const mesesValidos = mesesDoProcesso(processo);
  // Processo de meses específicos escolhe sozinho um mês válido pra prévia.
  const mesPreview = processo.frequencia.tipo === "meses_especificos"
    ? (mesesValidos.includes(mesReferencia) ? mesReferencia : (mesesValidos[0] || null))
    : mesReferencia;
  const previewForaDoMes = processo.frequencia.tipo === "meses_especificos" && mesPreview !== mesReferencia;
  // Para a prévia, o próprio processo entra na lista no lugar da versão antiga (edições ainda não gravadas).
  const todosComEste = useMemo(() => todosProcessos ? todosProcessos.map(p => p.id === processo.id ? processo : p).concat(todosProcessos.some(p => p.id === processo.id) ? [] : [processo]) : null, [todosProcessos, processo]);
  const outrosBlocos = useMemo(() => (todosProcessos || []).filter(p => p.id !== processo.id), [todosProcessos, processo.id]);
  const preview = useMemo(() => mesPreview ? resolveProcesso(processo, ano, mesPreview, todosComEste) : processo.eventos.map(()=>null), [processo, ano, mesPreview, todosComEste]);
  const [desdobrarAberto, setDesdobrarAberto] = useState(false);
  const [linhaExcecao, setLinhaExcecao] = useState(null);
  const [regraEditando, setRegraEditando] = useState(null);
  const [excData, setExcData] = useState("");
  const [excMotivo, setExcMotivo] = useState("");
  const padrao = useMemo(() => modoAtual === "cliente" ? resumoPadraoProcesso(processo, processoModelo) : { fora:0, extras:0, faltando:0 }, [processo, processoModelo, modoAtual]);
  const resumo = useMemo(() => resumoDoProcesso(processo, preview), [processo, preview]);

  // Pulo vindo da central de alertas: rola até a tarefa e pisca a linha.
  useEffect(() => {
    if(!destaqueEventoId || !estaAberto) return;
    const el = document.getElementById("ev-" + processo.id + "-" + String(destaqueEventoId).split(":")[0]);
    if(el){ el.scrollIntoView({ behavior:"smooth", block:"center" }); el.classList.remove("linha-destaque"); void el.offsetWidth; el.classList.add("linha-destaque"); }
  }, [destaqueEventoId, estaAberto]);

  // Clicar fora da tarefa fecha o editor de prazo (as mudanças já valem na hora)
  // e o ajuste pontual — este pede confirmação se tiver data/motivo não aplicados.
  useEffect(() => {
    if(!regraEditando && linhaExcecao === null) return;
    const aoPressionar = async e => {
      if(e.target.closest && e.target.closest(".dialog-overlay")) return; // clique dentro de um diálogo
      if(regraEditando){
        const linha = document.getElementById("ev-" + processo.id + "-" + String(regraEditando).split("#")[0]);
        if(linha && !linha.contains(e.target)) setRegraEditando(null);
      }
      if(linhaExcecao !== null){
        const ev = processo.eventos[linhaExcecao];
        const bloco = document.getElementById("exc-" + processo.id + "-" + linhaExcecao);
        const linha = ev && document.getElementById("ev-" + processo.id + "-" + ev.id);
        if(bloco && !bloco.contains(e.target) && !(linha && linha.contains(e.target))){
          const existente = ev && mesPreview && ev.excecoes ? ev.excecoes[competenciaKey(ano, mesPreview)] : null;
          const pendente = excData !== (existente ? existente.data : "") || excMotivo !== (existente ? existente.motivo || "" : "");
          if(pendente && !(await ui.confirm("Descartar o ajuste pontual que ainda não foi aplicado?", { okLabel:"Descartar", perigo:true }))) return;
          setLinhaExcecao(null);
        }
      }
    };
    document.addEventListener("mousedown", aoPressionar);
    return () => document.removeEventListener("mousedown", aoPressionar);
  }, [regraEditando, linhaExcecao, excData, excMotivo, processo, ano, mesPreview]);

  function updateEvento(idx, patch){
    onUpdate({ ...processo, eventos: processo.eventos.map((ev,i) => i===idx ? {...ev, ...patch} : ev) });
  }
  async function alternarCiclo(ligar){
    if(!ligar){
      if(await ui.confirm("Desligar o ciclo semanal deste bloco? As tarefas que contam a partir do início passam a ter uma data só por mês (a do 1º ciclo).", { okLabel:"Desligar" }))
        onUpdate({ ...processo, ciclo: null });
      return;
    }
    const r = converterParaCicloSemanal(processo);
    if(r.erro){ ui.alert(r.erro, { titulo:"Ciclo semanal" }); return; }
    const txt = 'Cada ciclo começa em "' + r.inicio.nome + '" (' + RECORRENCIA_LABEL(r.inicio.regra) + ") e as demais tarefas contam a partir dele, ciclo a ciclo.\n\n" +
      "• Você escolhe a que mês o ciclo pertence: ao do início (padrão) ou ao da última tarefa (ex.: crédito).\n" +
      "• Se o início cair em feriado e for ajustado, o ciclo inteiro acompanha.\n• Ajuste pontual não vale dentro do ciclo." +
      (r.convertidas.length ? "\n\nAs tarefas semanais seguintes viram prazo a partir da anterior:\n" + r.convertidas.map(x => "• " + x).join("\n") : "");
    if(await ui.confirm(txt, { titulo:"Ligar ciclo semanal", okLabel:"Ligar ciclo semanal" })) onUpdate(r.processo);
  }
  function toggleFrequenciaMes(m){
    const meses = processo.frequencia.meses || [];
    const novo = meses.includes(m) ? meses.filter(x=>x!==m) : [...meses, m].sort((a,b)=>a-b);
    onUpdate({ ...processo, frequencia: { ...processo.frequencia, meses: novo } });
  }
  function mover(idx, delta){
    const novoIdx = idx + delta;
    if(novoIdx < 0 || novoIdx >= processo.eventos.length) return;
    const eventos = [...processo.eventos];
    [eventos[idx], eventos[novoIdx]] = [eventos[novoIdx], eventos[idx]];
    onUpdate({ ...processo, eventos: renormalizarRefs(eventos) });
  }
  async function remover(idx){
    const alvo = processo.eventos[idx];
    if(alvo.bloqueada && modoAtual==="cliente"){
      ui.alert("Esta é uma tarefa-padrão bloqueada — não pode ser excluída aqui. Ajuste no cadastro de Modelos, se for o caso.");
      return;
    }
    const { processo: novo, aviso } = removerEventoDaCadeia(processo, idx);
    const ok = await ui.confirm('Remover a tarefa "' + alvo.nome + '"?' + (aviso ? "\n\n" + aviso : ""), { titulo:"Remover tarefa", okLabel:"Remover", perigo:true });
    if(ok) onUpdate(novo);
  }
  function adicionar(){
    const ultimo = processo.eventos[processo.eventos.length-1];
    const novo = { id: novoId("ev"), nome:"Nova tarefa", responsavel:"SINERGY", ativo:true, bloqueada:false, excecoes:{},
      regra: ultimo ? offAfter(ultimo.id, 1) : {tipo:"dia_fixo", dia:10, ajuste:"next"} };
    onUpdate({ ...processo, eventos: [...processo.eventos, novo] });
    setRegraEditando(novo.id);
  }
  async function restaurarPadrao(idx, dif){
    const ev = processo.eventos[idx];
    if(!(await ui.confirm('Voltar "' + ev.nome + '" para o padrão do Modelo?\n\n' + dif.itens.join("\n"), { okLabel:"Voltar ao padrão" }))) return;
    updateEvento(idx, { nome: dif.modelo.nome, responsavel: dif.modelo.responsavel, ativo: dif.modelo.ativo !== false, regra: clonar(dif.modelo.regra) });
  }

  // Ajuste pontual: data manual só pra competência da prévia atual.
  function abrirExcecao(idx){
    const ev = processo.eventos[idx];
    const existente = mesPreview && ev.excecoes ? ev.excecoes[competenciaKey(ano, mesPreview)] : null;
    setExcData(existente ? existente.data : "");
    setExcMotivo(existente ? existente.motivo || "" : "");
    setLinhaExcecao(idx);
  }
  function salvarExcecao(idx){
    if(!mesPreview) return;
    if(!excData){ ui.alert("Informe a data do ajuste."); return; }
    const ev = processo.eventos[idx];
    updateEvento(idx, { excecoes: { ...(ev.excecoes||{}), [competenciaKey(ano, mesPreview)]: { data: excData, motivo: excMotivo, em: new Date().toISOString() } } });
    setLinhaExcecao(null);
  }
  function removerExcecao(idx){
    if(!mesPreview) return;
    const excecoes = { ...(processo.eventos[idx].excecoes||{}) };
    delete excecoes[competenciaKey(ano, mesPreview)];
    updateEvento(idx, { excecoes });
    setLinhaExcecao(null);
  }
  const excDataObj = excData ? deISO(excData) : null;
  const excNaoUtil = excDataObj && !isBusinessDay(excDataObj);
  const colunas = modoAtual==="modelo" ? 8 : 7;
  const foraDoPadraoTotal = padrao.fora + padrao.extras;

  return (
    <fieldset disabled={!!somenteLeitura} style={{border:"none", margin:0, padding:0, minWidth:0}} id={"proc-" + processo.id}>
    {desdobrarAberto && (
      <DesdobrarBeneficioPainel processo={processo}
        onFechar={()=>setDesdobrarAberto(false)}
        onConfirmar={(novos)=>{ onDesdobrar(novos); setDesdobrarAberto(false); }} />
    )}
    <div className="card">
      <h3 style={{marginBottom: estaAberto ? 10 : 0}}>
        <span style={{display:"flex", alignItems:"center", gap:6, flex:1, minWidth:220}}>
          {onAlternar && <button type="button" className="proc-toggle" onClick={onAlternar} aria-expanded={estaAberto} title={estaAberto ? "Recolher" : "Expandir"} disabled={false}>{estaAberto ? "▾" : "▸"}</button>}
          {estaAberto
            ? <input type="text" className="nome-editavel" value={processo.nome} onChange={e=>onUpdate({...processo, nome:e.target.value})} aria-label="Nome do processo"
                title="Clique para editar o nome" style={{fontSize:15, fontWeight:700, padding:"2px 6px", flex:1, minWidth:180}} />
            : <button type="button" className="proc-titulo" onClick={onAlternar}>{processo.nome}</button>}
          {!somenteLeitura && <button type="button" className="link-btn" style={{fontSize:12, whiteSpace:"nowrap"}} title="Renomear"
            onClick={async ()=>{
              const nome = await ui.prompt("Novo nome:", processo.nome, { titulo:"Renomear", okLabel:"Salvar" });
              if(nome && nome.trim() && nome.trim() !== processo.nome) onUpdate({ ...processo, nome: nome.trim() });
            }}>✎ renomear</button>}
        </span>
        <span style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
          {processo.frequencia.tipo === "mensal"
            ? <span className="badge badge-on">todo mês</span>
            : <span className="badge badge-months">meses específicos{previewForaDoMes ? " · prévia em " + MESES[mesPreview-1] : ""}</span>}
          {processo.ciclo && <span className="badge badge-on" title="Tarefas calculadas ciclo a ciclo a partir da 1ª tarefa semanal">🔁 ciclo semanal</span>}
          {resumo.alertas > 0 && <span className="badge badge-alerta" title="Alertas nesta competência">⚠ {resumo.alertas}</span>}
          {foraDoPadraoTotal > 0 && <span className="badge badge-padrao" title="Tarefas diferentes do Modelo">≠ padrão {foraDoPadraoTotal}</span>}
          {estaAberto && processo.familia === "beneficios" && modoAtual!=="modelo" && (
            <button className="btn btn-sm btn-outline" onClick={()=>setDesdobrarAberto(true)}>
              {processo.id === "beneficios" ? "Desdobrar por tipo de benefício" : "+ outro tipo de benefício"}
            </button>
          )}
          {estaAberto && <label className="muted" style={{display:"flex", alignItems:"center", gap:4}}>
            <input type="checkbox" checked={processo.ativo} onChange={e=>onUpdate({...processo, ativo:e.target.checked})} />
            {modoAtual==="modelo" ? "ativo por padrão" : "processo ativo"}
          </label>}
          {acoesExtras}
        </span>
      </h3>

      {!estaAberto && (
        <div className="proc-resumo">
          <span>{processo.eventos.filter(e => e.ativo !== false).length} tarefa(s)</span>
          {resumo.chaves.map((c, i) => <span key={i}>· {c.nome}: <strong>{fmtBR(c.data)}</strong></span>)}
          {mesPreview && <span className="muted">(comp. {MESES[mesPreview-1]}/{ano})</span>}
          {padrao.faltando > 0 && <span className="badge badge-padrao">{padrao.faltando} tarefa(s) do Modelo removida(s)</span>}
        </div>
      )}

      {estaAberto && <>
      <div style={{display:"flex", gap:14, marginBottom:10, alignItems:"center", flexWrap:"wrap"}}>
        <label className="muted">Frequência:</label>
        <select value={processo.frequencia.tipo} onChange={e=>{
          const tipo = e.target.value;
          onUpdate({ ...processo, frequencia: tipo === "mensal" ? {tipo:"mensal"} : {tipo:"meses_especificos", meses:processo.frequencia.meses||[]} });
        }}>
          <option value="mensal">Todo mês</option>
          <option value="meses_especificos">Meses específicos</option>
        </select>
        {processo.frequencia.tipo === "meses_especificos" && (
          <div className="month-picker">
            {MESES.map((m,i) => (
              <button type="button" key={m} className={"month-chip " + (processo.frequencia.meses?.includes(i+1) ? "on" : "")}
                aria-pressed={!!processo.frequencia.meses?.includes(i+1)} onClick={()=>toggleFrequenciaMes(i+1)}>{m}</button>
            ))}
          </div>
        )}
        <label className="muted chk" title="As tarefas seguem a 1ª tarefa semanal, ciclo a ciclo (ex.: envio seg → processamento → arquivos → crédito)">
          <input type="checkbox" checked={!!processo.ciclo} onChange={e=>alternarCiclo(e.target.checked)} /> ciclo semanal
        </label>
        {processo.ciclo && <label className="muted" style={{display:"flex", alignItems:"center", gap:4}}>
          pertence ao mês
          <select value={processo.ciclo.pertence || "inicio"} onChange={e=>onUpdate({ ...processo, ciclo: { ...processo.ciclo, pertence: e.target.value } })} aria-label="A que mês o ciclo pertence">
            <option value="inicio">do início do ciclo</option>
            <option value="fim">da última tarefa (ex.: crédito)</option>
          </select>
        </label>}
        {processo.ciclo && !tarefaInicioDoCiclo(processo, mesPreview || 1) && <span className="alerta" style={{fontSize:12}}>⚠ Ciclo semanal sem tarefa de início (recorrência semanal).</span>}
        {padrao.faltando > 0 && <span className="badge badge-padrao">{padrao.faltando} tarefa(s) do Modelo removida(s) deste cronograma</span>}
      </div>

      <div className="table-wrap">
      <table className="ev-table" style={{minWidth:860}}>
        <thead><tr>
          <th style={{width:64}}></th><th style={{width:40}}>Ativa</th>
          {modoAtual==="modelo" && <th style={{width:60}}>🔒 Padrão</th>}
          <th style={{width:"26%"}}>Tarefa</th><th style={{width:124}}>Responsável</th><th>Prazo / regra</th>
          <th style={{width:180}}>Prévia (comp. {mesPreview?MESES[mesPreview-1]:"—"}/{ano})</th><th style={{width:34}}></th>
        </tr></thead>
        <tbody>
          {processo.eventos.map((ev, idx) => {
            const calc = preview[idx];
            const previewTxt = calc && calc.ocorrencias && calc.ocorrencias.length ? formatarOcorrencias(calc.ocorrencias)
              : ev.regra.tipo === "recorrencia" ? RECORRENCIA_LABEL(ev.regra)
              : (calc && calc.data ? fmtBR(calc.data) : "—");
            const travada = !!ev.bloqueada && modoAtual==="cliente";
            const excecaoAtual = mesPreview && ev.excecoes ? ev.excecoes[competenciaKey(ano, mesPreview)] : null;
            const dif = modoAtual === "cliente" ? diferencasDoPadrao(processo, ev, processoModelo) : null;
            const editando = regraEditando === ev.id && !somenteLeitura;
            return (
              <React.Fragment key={ev.id}>
              <tr id={"ev-" + processo.id + "-" + ev.id} style={ev.ativo===false ? {opacity:.45} : undefined}>
                <td>
                  <button className="btn btn-sm btn-ghost" disabled={idx===0} onClick={()=>mover(idx,-1)} title="Mover para cima" aria-label="Mover para cima">▲</button>{" "}
                  <button className="btn btn-sm btn-ghost" disabled={idx===processo.eventos.length-1} onClick={()=>mover(idx,1)} title="Mover para baixo" aria-label="Mover para baixo">▼</button>
                </td>
                <td style={{textAlign:"center"}}>
                  <input type="checkbox" checked={ev.ativo!==false} title="Esse cliente tem esta tarefa?" onChange={e=>updateEvento(idx, {ativo:e.target.checked})} />
                </td>
                {modoAtual==="modelo" && <td style={{textAlign:"center"}}>
                  <input type="checkbox" checked={!!ev.bloqueada} title="Tarefa-padrão: nome e exclusão ficam travados nos clientes"
                    onChange={e=>updateEvento(idx, {bloqueada:e.target.checked})} />
                </td>}
                <td style={{whiteSpace:"normal"}}>
                  <div style={{display:"flex", alignItems:"center", gap:4}}>
                    {travada && <span title="Tarefa-padrão — nome e existência protegidos">🔒</span>}
                    <input type="text" value={ev.nome} readOnly={travada} aria-label="Nome da tarefa"
                      title={travada?"Tarefa-padrão — nome protegido (só o prazo é editável)":undefined}
                      style={{width:"100%", border:"none", background:"transparent", fontSize:13.5, padding:2}}
                      onChange={e=>updateEvento(idx, {nome:e.target.value})} />
                  </div>
                  {dif && (
                    <button type="button" className={"badge " + (dif.extra ? "badge-extra" : "badge-padrao")} style={{border:"none", cursor: dif.extra || somenteLeitura ? "default" : "pointer"}}
                      title={dif.itens.join("\n") + (dif.extra ? "" : "\n\nClique para voltar ao padrão do Modelo")}
                      onClick={()=>{ if(!dif.extra && !somenteLeitura) restaurarPadrao(idx, dif); }}>
                      {dif.extra ? "+ fora do Modelo" : "≠ padrão ↺"}
                    </button>
                  )}
                </td>
                <td>
                  <select className={classeResponsavel(ev.responsavel)} value={ev.responsavel}
                    onChange={e=>updateEvento(idx,{responsavel:e.target.value})}>
                    {RESPONSAVEIS_TAREFA.map(rp => <option key={rp} value={rp}>{rp}</option>)}
                  </select>
                </td>
                <td style={{whiteSpace:"normal"}}>
                  {(() => {
                    // Regra base + regras "a partir de" (vigências) dentro do ano.
                    const vigs = (ev.vigencias || []).slice().sort((a,b) => a.aPartirDe - b.aPartirDe);
                    const outros = processo.eventos.filter((_,i)=>i!==idx);
                    const editor = (regra, aoMudar) => (
                      <div>
                        <RuleEditor regra={regra} isPrimeiro={idx===0} anterior={processo.eventos[idx-1]} outrosEventos={outros} outrosBlocos={outrosBlocos} onChange={aoMudar} />
                        <button type="button" className="btn btn-sm btn-primary" style={{marginTop:6}} onClick={()=>setRegraEditando(null)}>Concluir</button>
                      </div>
                    );
                    const setVig = (m, regra) => updateEvento(idx, { vigencias: vigs.map(v => v.aPartirDe === m ? { ...v, regra } : v) });
                    const tirarVig = m => updateEvento(idx, { vigencias: vigs.filter(v => v.aPartirDe !== m) });
                    const rotuloBase = vigs.length ? (vigs[0].aPartirDe === 2 ? "jan: " : "jan–" + MESES[vigs[0].aPartirDe - 2].toLowerCase() + ": ") : "";
                    return <>
                      {regraEditando === ev.id && !somenteLeitura ? editor(ev.regra, regra => updateEvento(idx, { regra })) : (
                        <span className="regra-txt">
                          <span>{rotuloBase && <span className="vig-rotulo">{rotuloBase}</span>}{descreverRegra(ev.regra, processo.eventos)}</span>
                          {!somenteLeitura && <button type="button" className="link-btn" onClick={()=>setRegraEditando(ev.id)} aria-label={"Editar prazo de " + ev.nome}>✎ editar</button>}
                        </span>
                      )}
                      {vigs.map(v => (
                        <div key={v.aPartirDe} className="vig-linha">
                          {regraEditando === ev.id + "#" + v.aPartirDe && !somenteLeitura ? <><span className="vig-rotulo">a partir de {MESES[v.aPartirDe - 1].toLowerCase()}:</span>{editor(v.regra, regra => setVig(v.aPartirDe, regra))}</> : (
                            <span className="regra-txt">
                              <span><span className="vig-rotulo">a partir de {MESES[v.aPartirDe - 1].toLowerCase()}:</span> {descreverRegra(v.regra, processo.eventos)}</span>
                              {!somenteLeitura && <>
                                <button type="button" className="link-btn" onClick={()=>setRegraEditando(ev.id + "#" + v.aPartirDe)}>✎</button>
                                <button type="button" className="link-btn perigo" title={"Tirar a regra a partir de " + MESES[v.aPartirDe - 1]} onClick={()=>tirarVig(v.aPartirDe)}>✕</button>
                              </>}
                            </span>
                          )}
                        </div>
                      ))}
                      {modoAtual === "cliente" && !somenteLeitura && (
                        <div className="vig-nova">
                          <select value="" aria-label={"Mudar o prazo de " + ev.nome + " a partir de um mês"} onChange={e => {
                            const m = Number(e.target.value); if(!m) return;
                            updateEvento(idx, { vigencias: [...vigs, { aPartirDe: m, regra: clonar(regraVigente(ev, m)) }].sort((a,b) => a.aPartirDe - b.aPartirDe) });
                            setRegraEditando(ev.id + "#" + m);
                          }}>
                            <option value="">+ mudar a partir de…</option>
                            {MESES.map((nomeMes, i) => i + 1).filter(m => m >= 2 && !vigs.some(v => v.aPartirDe === m)).map(m => <option key={m} value={m}>{MESES_LONGOS[m - 1]}</option>)}
                          </select>
                        </div>
                      )}
                    </>;
                  })()}
                </td>
                <td style={{whiteSpace:"normal"}}>
                  <strong style={{fontWeight:600}}>{previewTxt}</strong>
                  {calc && calc.vigenciaDesde && <div className="muted" style={{fontSize:11.5}}>regra a partir de {MESES[calc.vigenciaDesde - 1].toLowerCase()}</div>}
                  {calc && calc.temExcecao && <span title={"Ajuste pontual para este mês" + (calc.excecao?.motivo ? ": " + calc.excecao.motivo : "")} style={{color:"var(--warn)"}}> ✱</span>}
                  <Alertas lista={calc && calc.alertas} />
                  {calc && calc.limitadoPor && <div className="muted" style={{fontSize:11.5}}>puxado por "{(processo.eventos.find(e => e.id === calc.limitadoPor) || {}).nome}"</div>}
                  {modoAtual==="cliente" && !somenteLeitura && mesPreview && ev.regra.tipo!=="recorrencia" && !processo.ciclo && (
                    <div><button type="button" className="link-btn" style={{fontSize:11.5, color:"var(--muted)"}}
                      onClick={()=>linhaExcecao===idx ? setLinhaExcecao(null) : abrirExcecao(idx)}>{excecaoAtual?"✱ ajuste":"ajuste pontual"}</button></div>
                  )}
                </td>
                <td><button className="btn btn-sm btn-ghost" disabled={travada} aria-label="Remover tarefa"
                  title={travada?"Tarefa-padrão — não pode ser removida":"Remover tarefa"} onClick={()=>remover(idx)}>🗑</button></td>
              </tr>
              {calc && calc.alertas && calc.alertas.length > 0 && (
                <tr><td colSpan={colunas} className="linha-alerta">⚠ {calc.alertas.join(" · ")}</td></tr>
              )}
              {linhaExcecao===idx && (
                <tr id={"exc-" + processo.id + "-" + idx}><td colSpan={colunas} style={{background:"var(--surface2)", whiteSpace:"normal"}}>
                  <div className="rule-editor">
                    <span className="muted">Ajuste só para a competência {MESES[mesPreview-1]}/{ano}:</span>
                    <input type="date" value={excData} onChange={e=>setExcData(e.target.value)} />
                    <input type="text" placeholder="Motivo (opcional)" style={{width:220}} value={excMotivo} onChange={e=>setExcMotivo(e.target.value)} />
                    <button className="btn btn-sm btn-primary" onClick={()=>salvarExcecao(idx)}>Aplicar ajuste</button>
                    {excecaoAtual && <button className="btn btn-sm btn-ghost" onClick={()=>removerExcecao(idx)}>Remover ajuste</button>}
                    <button className="btn btn-sm btn-ghost" onClick={()=>setLinhaExcecao(null)}>Fechar</button>
                  </div>
                  {excNaoUtil && <div className="alerta" style={{fontSize:12, marginTop:6}}>
                    ⚠ {fmtBR(excDataObj)} é {nomeFeriado(excDataObj) ? "feriado (" + nomeFeriado(excDataObj) + ")" : "fim de semana"}. Dá pra salvar assim mesmo, mas confira se é isso.
                  </div>}
                </td></tr>
              )}
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
      </div>
      <button className="btn btn-sm btn-outline" style={{marginTop:8}} onClick={adicionar}>+ Nova tarefa</button>
      </>}
    </div>
    </fieldset>
  );
}

/* ---------- Prévia anual (por competência) ---------- */
function celulaGrade(ev, calc){
  if(ev.ativo===false) return "—";
  if(calc && calc.ocorrencias && calc.ocorrencias.length) return formatarOcorrencias(calc.ocorrencias);
  if(ev.regra.tipo === "recorrencia") return RECORRENCIA_LABEL(ev.regra);
  const txt = calc && calc.data ? fmtBR(calc.data) : "—";
  return calc && calc.temExcecao ? txt + " ✱" : txt;
}

function GradeAnual({ cliente, ano }){
  return (
    <div className="card grid-preview">
      <h3>Cronograma completo — {ano}</h3>
      <p className="muted" style={{marginTop:0}}>As colunas são o <strong>mês de competência</strong>. A data mostrada é a data real — pode cair no mês seguinte (ex.: crédito da folha). Datas fora do mês da competência aparecem em itálico. Para ver por data real, use a aba Calendário.</p>
      <div className="table-wrap">
      <table>
        <thead>
          <tr>
            <th style={{width:60}}>Seção</th><th style={{width:260}}>Evento</th><th style={{width:70}}>Resp.</th>
            {MESES.map(m => <th key={m}>Comp. {m}</th>)}
          </tr>
        </thead>
        <tbody>
          {cliente.processos.filter(p=>p.ativo).map(processo => {
            const eventosVisiveis = processo.eventos.filter(ev => ev.ativo !== false);
            const mesesAtivos = new Set(mesesDoProcesso(processo));
            const porMes = {};
            mesesAtivos.forEach(m => { porMes[m] = resolveProcesso(processo, ano, m, cliente.processos); });
            return eventosVisiveis.map((ev) => {
              const idx = processo.eventos.indexOf(ev);
              return (
                <tr key={processo.id + ev.id}>
                  {ev === eventosVisiveis[0] && <td rowSpan={eventosVisiveis.length} style={{fontWeight:700, background:"var(--surface2)", whiteSpace:"normal"}}>{processo.nome}</td>}
                  <td title={infoCategoria(categoriaDoEvento(processo, ev), processo.nome).label}>
                    <span className="cat-dot" style={{background: infoCategoria(categoriaDoEvento(processo, ev), processo.nome).cor}} />{ev.nome}
                  </td>
                  <td className={classeResponsavel(ev.responsavel)}>{ev.responsavel}</td>
                  {MESES.map((m,i) => {
                    const mNum = i+1;
                    if(!mesesAtivos.has(mNum)) return <td key={m} className="muted">—</td>;
                    const calc = porMes[mNum][idx];
                    const foraDoMes = calc && calc.data && ev.regra.tipo !== "recorrencia" && !calc.ocorrencias && (calc.data.getMonth()+1 !== mNum || calc.data.getFullYear() !== ano);
                    return <td key={m} style={foraDoMes ? {fontStyle:"italic", color:"var(--texto-sec)"} : undefined}
                      title={foraDoMes ? "Competência " + m + ", data real em " + MESES[calc.data.getMonth()] : undefined}>
                      {celulaGrade(ev, calc)}<Alertas lista={calc && calc.alertas} />
                    </td>;
                  })}
                </tr>
              );
            });
          })}
        </tbody>
      </table>
      </div>
    </div>
  );
}

/* ---------- Calendário mensal (por data real) ---------- */
// Chip de uma entrega: cor = categoria. SINERGY = preenchido; CLIENTE = contorno tracejado.
function estiloChip(it){
  const cor = infoCategoria(it.categoria, it.processo).cor;
  return it.responsavel === "CLIENTE"
    ? { color: cor, background: "var(--surface)", border: "1px dashed " + cor, borderLeft: "3px solid " + cor }
    : { color: cor, background: cor + "1f", border: "1px solid " + cor + "33", borderLeft: "3px solid " + cor };
}
function CalendarioMensal({ cliente, ano, mes, soSinergy, onSoSinergy, onNavegar }){
  const itens = useMemo(() => eventosDoMesCalendario(cliente, ano, mes), [cliente, ano, mes]);
  const [ocultas, setOcultas] = useState(() => new Set());
  const porResp = soSinergy ? itens.filter(i => ehSinergy(i.responsavel)) : itens;
  const categoriasDoMes = [];
  porResp.forEach(i => { if(!categoriasDoMes.some(c => c.id === i.categoria)) categoriasDoMes.push({ id:i.categoria, ...infoCategoria(i.categoria, i.processo), n:0 }); categoriasDoMes.find(c => c.id === i.categoria).n++; });
  const ordemCat = Object.keys(CATEGORIAS);
  categoriasDoMes.sort((a,b) => (ordemCat.indexOf(a.id) + 1 || 99) - (ordemCat.indexOf(b.id) + 1 || 99));
  const visiveis = porResp.filter(i => !ocultas.has(i.categoria));
  function alternarCategoria(id){ setOcultas(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); }
  const porDia = {};
  visiveis.forEach(i => { const k = i.data.getDate(); (porDia[k] = porDia[k] || []).push(i); });
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const offset = (new Date(ano, mes-1, 1).getDay() + 6) % 7; // semana começa na segunda
  const celulas = [];
  for(let i=0; i<offset; i++) celulas.push(null);
  for(let d=1; d<=diasNoMes; d++) celulas.push(d);
  while(celulas.length % 7) celulas.push(null);
  const uteis = diasUteisDoMes(ano, mes).length;

  return (
    <div className="card">
      <h3>
        <span className="cal-nav">
          <button className="btn btn-sm btn-outline" onClick={()=>onNavegar(-1)} aria-label="Mês anterior">◀</button>
          <span>{MESES_LONGOS[mes-1]} de {ano}</span>
          <button className="btn btn-sm btn-outline" onClick={()=>onNavegar(1)} aria-label="Próximo mês">▶</button>
          <span className="muted" style={{fontWeight:400}}>{uteis} dias úteis · {visiveis.length} entrega(s)</span>
        </span>
        <label className="muted" style={{fontWeight:400, display:"flex", gap:4, alignItems:"center"}}>
          <input type="checkbox" checked={soSinergy} onChange={e=>onSoSinergy(e.target.checked)} /> só tarefas SINERGY
        </label>
      </h3>
      <div className="cal-legenda">
        {categoriasDoMes.map(c => (
          <button type="button" key={c.id} className={"cal-leg-item" + (ocultas.has(c.id) ? " off" : "")} onClick={()=>alternarCategoria(c.id)}
            title={ocultas.has(c.id) ? "Mostrar" : "Esconder"} aria-pressed={!ocultas.has(c.id)}>
            <span className="cal-leg-cor" style={{background:c.cor}} />{c.label} <span className="muted">({c.n})</span>
          </button>
        ))}
        {ocultas.size > 0 && <button type="button" className="link-btn" onClick={()=>setOcultas(new Set())}>mostrar todas</button>}
      </div>
      <p className="muted" style={{marginTop:0}}>Datas reais, somando todas as competências que caem neste mês. Clique numa categoria pra esconder/mostrar. Preenchido = SINERGY · tracejado = CLIENTE · fundo cinza = fim de semana · fundo vermelho = feriado · ✱ ajuste pontual.</p>
      <div className="table-wrap">
        <div className="cal-grid">
          {["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d => <div key={d} className="cal-head">{d}</div>)}
          {celulas.map((d, i) => {
            if(d === null) return <div key={i} className="cal-cell vazio" />;
            const data = new Date(ano, mes-1, d);
            const feriado = nomeFeriado(data);
            const fds = data.getDay() === 0 || data.getDay() === 6;
            return (
              <div key={i} className={"cal-cell" + (feriado ? " feriado" : fds ? " off" : "")}>
                <div className="cal-dia">{d}</div>
                {feriado && <div className="cal-feriado-nome">{feriado}</div>}
                {(porDia[d] || []).map((it, j) => {
                  const outraComp = it.competencia.m !== mes || it.competencia.y !== ano;
                  return (
                    <span key={j} className="cal-item" style={estiloChip(it)}
                      title={infoCategoria(it.categoria, it.processo).label + " · " + it.responsavel + "\n" + it.processo + " — " + it.evento + (it.rotulo ? " (" + it.rotulo + ")" : "") + "\nCompetência " + compLabel(it.competencia) + (it.alertas.length ? "\n⚠ " + it.alertas.join("\n⚠ ") : "")}>
                      <strong>{infoCategoria(it.categoria, it.processo).label}</strong> · {it.evento}{it.rotulo ? " (" + it.rotulo + ")" : ""}
                      {outraComp && <em> · comp. {compLabel(it.competencia)}</em>}
                      {it.temExcecao && " ✱"}{it.alertas.length ? " ⚠" : ""}
                    </span>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PainelConflitos({ conflitos, ano, mes, soSinergy, onSoSinergy, recolhido }){
  const [aberto, setAberto] = useState(!recolhido);
  if(!conflitos.length) return null;
  return (
    <div className="card" style={{background:"var(--perigo-bg)", border:"1px solid var(--perigo-borda)", padding: aberto ? undefined : "10px 16px"}}>
      <h3 style={{color:"var(--perigo-txt)", fontSize:13.5, marginBottom: aberto ? 10 : 0}}>
        <button type="button" className="proc-titulo" style={{color:"var(--perigo-txt)", fontSize:13.5}} onClick={()=>setAberto(!aberto)} aria-expanded={aberto}>
          {aberto ? "▾" : "▸"} ⚠ {conflitos.length} dia(s) com entregas de processos diferentes em {MESES_LONGOS[mes-1]}/{ano} (datas reais)
        </button>
        <label className="muted" style={{fontWeight:400, display:"flex", gap:4, alignItems:"center"}}>
          <input type="checkbox" checked={soSinergy} onChange={e=>onSoSinergy(e.target.checked)} /> só tarefas SINERGY
        </label>
      </h3>
      {aberto && <div className="table-wrap">
      <table style={{fontSize:12}}>
        <tbody>
          {conflitos.map((c,i) => (
            <tr key={i}>
              <td style={{fontWeight:700, width:90, verticalAlign:"top"}}>{fmtBR(deISO(c.data))}</td>
              <td style={{whiteSpace:"normal"}}>
                {c.itens.map((it,ii) => (
                  <div key={ii}>
                    <span className="badge" style={{...estiloChip(it), marginRight:6}}>{infoCategoria(it.categoria, it.processo).label}</span>
                    {it.evento}{it.rotulo ? " (" + it.rotulo + ")" : ""}
                    <span className="muted"> · comp. {compLabel(it.competencia)}</span>
                  </div>
                ))}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      </div>}
    </div>
  );
}

/* ---------- Exportação Excel ---------- */
// Datas vão como DATA de verdade (filtráveis/ordenáveis no Excel), não texto.
// Ajuste pontual = data em laranja + comentário com o motivo.
function dataExcel(d){ return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); }
function estiloCabecalho(row){
  row.eachCell(cell => {
    cell.font = { bold:true, color:{argb:"FFFFFFFF"} };
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FF2563EB"} };
    cell.alignment = { vertical:"middle", horizontal:"center" };
  });
}
// Nome de aba válido e único (Excel: máx. 31 caracteres, sem : \ / ? * [ ]).
function nomeDeAba(wb, base){
  let nome = String(base).replace(/[:\\/?*\[\]]/g, " ").slice(0, 31).trim() || "Cronograma";
  let n = 2;
  while(wb.getWorksheet(nome)){ const suf = " (" + n++ + ")"; nome = String(base).replace(/[:\\/?*\[\]]/g, " ").slice(0, 31 - suf.length).trim() + suf; }
  return nome;
}
// Uma aba com a grade anual de um cronograma (competência × tarefa).
// modo "cliente" = vai para o cliente validar (sem dados internos); "interno" = com modelo base, status etc.
function adicionarAbaCronograma(wb, nomeAba, cliente, ano, clientesVinculados, modo){
  clientesVinculados = clientesVinculados || [];
  const interno = modo !== "cliente";
  const totalColunas = 3 + MESES.length;
  const ws = wb.addWorksheet(nomeDeAba(wb, nomeAba), { views: [{ state:"frozen", xSplit:3, ySplit:4 }] });
  ws.columns = [30, 46, 14, ...MESES.map(()=>14)].map(width => ({ width }));
  // Impressão: paisagem, cabendo na largura, com a Sinergy RH no rodapé.
  ws.pageSetup = { orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:0, paperSize:9 };
  ws.headerFooter = { oddFooter: "&LSinergy RH · Cronograma Operacional " + ano + "&RPágina &P de &N" };

  // Linha 1: logo da Sinergy RH na coluna A e o título ao lado.
  ws.getRow(1).height = 36;
  try {
    const idLogo = wb.addImage({ base64: LOGO_SINERGY_PNG, extension: "png" });
    // Centralizado na célula A1: coluna A (largura 30 ≈ 215 px) e linha 1 (36 pt = 48 px); logo 157×40 px.
    // O ExcelJS grava a fração da âncora com tamanhos FIXOS (medido: 1,0 de coluna = 300000 EMU, 1,0 de
    // linha = 360000 EMU; 1 px = 9525 EMU), não com a largura real — por isso a folga é calculada em px.
    const larguraColPx = 30 * 7 + 5, alturaLinhaPx = 36 * 96 / 72, wLogo = 157, hLogo = 40;
    const folgaX = (larguraColPx - wLogo) / 2, folgaY = (alturaLinhaPx - hLogo) / 2;
    ws.addImage(idLogo, { tl: { col: folgaX * 9525 / 300000, row: folgaY * 9525 / 360000 }, ext: { width: wLogo, height: hLogo }, editAs: "oneCell" });
  } catch(e){ ws.getCell(1, 1).value = "Sinergy RH"; ws.getCell(1, 1).font = { bold:true, size:16, color:{argb:"FF2563EB"} }; }
  ws.mergeCells(1, 2, 1, totalColunas);
  ws.getCell(1, 2).value = "Cronograma Operacional " + ano;
  ws.getCell(1, 2).font = { bold:true, size:15, color:{argb:"FF1E293B"} };
  ws.getCell(1, 2).alignment = { vertical:"middle" };
  ws.mergeCells(2, 1, 2, totalColunas);
  ws.getCell(2, 1).value = cliente.nome;
  ws.getCell(2, 1).font = { bold:true, size:12, color:{argb:"FF334155"} };
  ws.mergeCells(3, 1, 3, totalColunas);
  if(interno){
    ws.getCell(3, 1).value = "USO INTERNO · " + clientesVinculados.length + " cliente(s) vinculado(s) · Modelo base: " + (cliente.modeloBase || "—") + " · Status: " + statusLabel(cliente.status) + " · Gerado em " + fmtBR(new Date()) +
      " · Colunas = mês de competência; a data exibida é a data real, que pode cair no mês seguinte.";
    ws.getCell(3, 1).font = { italic:true, size:9, color:{argb:"FF64748B"} };
  } else ws.getRow(3).height = 6; // espaço antes do cabeçalho (mantém o congelamento na linha 4)
  // Faixa azul fina sob o título.
  for(let c = 1; c <= totalColunas; c++) ws.getCell(1, c).border = { bottom: { style:"medium", color:{argb:"FF2563EB"} } };

  const headerRowIdx = 4;
  const headerRow = ws.getRow(headerRowIdx);
  headerRow.values = ["Seção", "Evento", "Responsável", ...MESES_LONGOS];
  headerRow.height = 20;
  estiloCabecalho(headerRow);
  ws.autoFilter = { from:{ row:headerRowIdx, column:1 }, to:{ row:headerRowIdx, column:totalColunas } };

  const bordaFina = { style:"hair", color:{argb:"FFE2E8F0"} };
  let rowIdx = headerRowIdx + 1;
  let faixaClara = true;
  cliente.processos.filter(p=>p.ativo).forEach(processo => {
    const eventosVisiveis = processo.eventos.filter(ev => ev.ativo !== false);
    if(!eventosVisiveis.length) return;
    const mesesAtivos = new Set(mesesDoProcesso(processo));
    const porMes = {};
    mesesAtivos.forEach(m => { porMes[m] = resolveProcesso(processo, ano, m, cliente.processos); });
    const inicioBloco = rowIdx;
    const corFaixa = faixaClara ? "FFF8FAFC" : "FFFFFFFF";
    eventosVisiveis.forEach(ev => {
      const idx = processo.eventos.indexOf(ev);
      const row = ws.getRow(rowIdx);
      const excecoesDaLinha = {};
      row.getCell(1).value = processo.nome;
      row.getCell(2).value = ev.nome;
      row.getCell(3).value = ev.responsavel;
      MESES.forEach((m,i) => {
        const mNum = i+1, cell = row.getCell(4+i);
        if(!mesesAtivos.has(mNum)){ cell.value = ""; return; }
        const calc = porMes[mNum][idx];
        if(ev.regra.tipo === "recorrencia" || (calc && calc.ocorrencias) || !calc || !calc.data){ cell.value = celulaGrade(ev, calc); return; }
        cell.value = dataExcel(calc.data);
        cell.numFmt = "dd/mm/yyyy";
        if(calc.temExcecao) excecoesDaLinha[4+i] = calc.excecao;
      });
      for(let c=1; c<=totalColunas; c++){
        const cell = row.getCell(c);
        cell.border = { top:bordaFina, bottom:bordaFina, left:bordaFina, right:bordaFina };
        cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:corFaixa} };
        if(c <= 2) cell.alignment = { vertical:"middle", wrapText:true };
        else cell.alignment = { horizontal:"center" };
        if(c === 3) cell.font = { bold:true, color:{argb: ev.responsavel==="CLIENTE" ? "FF0891B2" : ev.responsavel==="SINERGY-BPO" ? "FF0F766E" : "FF7C3AED"} };
        if(excecoesDaLinha[c]){
          cell.font = { bold:true, color:{argb:"FFD97706"} };
          cell.note = "Ajuste pontual" + (excecoesDaLinha[c].motivo ? ": " + excecoesDaLinha[c].motivo : "");
        }
      }
      rowIdx++;
    });
    if(rowIdx - 1 > inicioBloco) ws.mergeCells(inicioBloco, 1, rowIdx - 1, 1);
    const cellSecao = ws.getCell(inicioBloco, 1);
    cellSecao.font = { bold:true };
    cellSecao.alignment = { vertical:"middle", wrapText:true };
    faixaClara = !faixaClara;
  });

  rowIdx++;
  ws.mergeCells(rowIdx, 1, rowIdx, totalColunas);
  ws.getCell(rowIdx, 1).value = "Datas em laranja = ajuste pontual: data alterada manualmente só para aquele mês (passe o mouse para ver o motivo).";
  ws.getCell(rowIdx, 1).font = { italic:true, size:9, color:{argb:"FF92400E"} };
  rowIdx++;
  ws.mergeCells(rowIdx, 1, rowIdx, totalColunas);
  ws.getCell(rowIdx, 1).value = "Cronograma elaborado pela Sinergy RH.";
  ws.getCell(rowIdx, 1).font = { size:9, color:{argb:"FF64748B"} };
  return ws;
}
// modo "cliente": sem Gerente/Coordenador/Analista (responsáveis internos da Sinergy).
function adicionarAbaClientes(wb, nomeAba, linhas, modo){
  const ws = wb.addWorksheet(nomeDeAba(wb, nomeAba), { views:[{ state:"frozen", ySplit:1 }] });
  const temCrono = linhas.some(l => l.cronograma);
  const interno = modo !== "cliente";
  ws.columns = [...(temCrono ? [{ width:34 }] : []), { width:14 }, { width:48 }, { width:22 }, { width:20 }, ...(interno ? [{ width:22 }, { width:22 }, { width:22 }] : [])];
  ws.getRow(1).values = [...(temCrono ? ["Cronograma"] : []), "ID", "Razão social", "CNPJ/CPF", "Grupo", ...(interno ? ["Gerente", "Coordenador", "Analista"] : [])];
  estiloCabecalho(ws.getRow(1));
  linhas.forEach(l => ws.addRow([...(temCrono ? [l.cronograma || ""] : []), l.codigo || "", l.razaoSocial || "", fmtDocumento(l.documento), l.grupo || "", ...(interno ? [l.gerente || "", l.coordenador || "", l.analista || ""] : [])]));
}
function adicionarAbaFeriados(wb, ano){
  const ws = wb.addWorksheet("Feriados " + ano, { views:[{ state:"frozen", ySplit:1 }] });
  ws.columns = [{ width:14 }, { width:38 }];
  ws.getRow(1).values = ["Data", "Feriado"];
  estiloCabecalho(ws.getRow(1));
  feriadosDoAno(ano).forEach(([d, label]) => { const r = ws.addRow([dataExcel(deISO(d)), label]); r.getCell(1).numFmt = "dd/mm/yyyy"; });
}
async function baixarWorkbook(wb, nomeArquivo){
  const buffer = await wb.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([buffer], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
